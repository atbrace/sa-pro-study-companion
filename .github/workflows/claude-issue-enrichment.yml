name: Issue Enrichment

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: 'Comma-separated issue numbers to enrich (e.g. "22,41,43")'
        required: true
        type: string

jobs:
  # Prepare the matrix for manual dispatch
  prepare-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.parse.outputs.issues }}
    steps:
      - name: Parse issue numbers
        id: parse
        env:
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
        run: |
          # Convert "22,41,43" to JSON array [22,41,43]
          echo "issues=$(echo "$ISSUE_NUMBERS" | tr -d ' ' | jq -cR 'split(",") | map(tonumber)')" >> "$GITHUB_OUTPUT"

  # Runs for each issue in a manual dispatch
  enrich-manual:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    strategy:
      matrix:
        issue: ${{ fromJSON(needs.prepare-matrix.outputs.issues) }}
      max-parallel: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: React with eyes emoji
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ matrix.issue }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUM}/reactions" \
            -f content=eyes

      - name: Enrich issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            You are an issue enrichment agent for a GitHub repository. Your job is to
            research issue #${{ matrix.issue }} and post a structured analysis comment that
            helps the team make faster decisions when they pick it up for implementation.

            CRITICAL: The issue number is ${{ matrix.issue }}. Use this number in ALL
            gh commands below. Do NOT use environment variables for the issue number.

            ## Issue Context

            Read the issue details by running:
            gh issue view ${{ matrix.issue }} --json number,title,body,labels,author

            ## Instructions

            Read the repository's CLAUDE.md to understand the project's purpose, tech
            stack, architecture, and design principles. Then analyze the issue and
            perform the following checks.

            ### 1. Issue Type Classification

            Determine the type: bug, feature, enhancement, chore, polish, or perf.
            If the issue lacks a type label, recommend one.

            ### 2. Scope & Alignment

            Check whether this issue aligns with the project's stated design principles
            and scope in CLAUDE.md. Flag if it appears to conflict with:
            - Local-first / single-user design
            - Assessment-driven learning focus
            - The defined tech stack (Next.js, SQLite, Tailwind, shadcn/ui)
            - Any other architectural constraints

            If the issue is clearly in scope, say so briefly. Only elaborate if there
            is a genuine concern.

            ### 3. Duplicate & Overlap Detection

            Run `gh issue list --state open --json number,title,body,labels` and read
            the results. Check for:
            - Exact duplicates (same problem/feature)
            - Semantic overlap (issues that would touch the same code or solve related problems)
            - Dependency relationships (this issue blocks or is blocked by another)

            ### 4. Acceptance Criteria Assessment

            Check whether the issue defines objectively testable acceptance criteria
            (checkboxes, specific behaviors, measurable outcomes). Then:
            - If criteria exist and are testable: confirm they look good
            - If criteria are missing or vague: propose specific, testable criteria
              that could be used in automated quality gates
            - If the criteria genuinely require human judgment to define (e.g.,
              subjective UX decisions): flag this explicitly

            ### 5. Code Surface Area & Effort

            Analyze the codebase to identify which files and components would likely
            need to change. Use Grep and Glob to find relevant code. Provide:
            - List of files/directories likely touched
            - Effort estimate: small (<30min), medium (30min-2hr), or large (>2hr)
            - Any potential conflicts with other open issues touching the same files

            ### 6. Type-Specific Research

            **For features/enhancements:**
            - Are there existing patterns in the codebase that should be followed?
            - What's the current state of the area being changed?
            - Are there relevant framework APIs or library features to consider?
            - Suggest an implementation approach if one is apparent

            **For bugs:**
            - Trace the reported behavior in the code if possible
            - Identify the likely root cause files and logic paths
            - Assess blast radius — what else could be affected?

            ### 7. Priority Validation

            If the issue has a priority label, check whether it makes sense given:
            - Project goals and current milestones
            - Whether it blocks or is blocked by higher-priority work
            - Its impact on core functionality vs. nice-to-have

            If the priority seems misaligned, recommend a change with reasoning.

            ## Output

            Post a SINGLE comment on issue #${{ matrix.issue }} using:
            gh issue comment ${{ matrix.issue }} --body "<your report>"

            Format the comment exactly like this:

            ## Issue Enrichment Report

            ### Type
            [classification + label recommendation if missing]

            ### Scope & Alignment
            [In scope / Concern — brief reasoning]

            ### Related Issues
            - **Duplicates:** none found (or #N — reason)
            - **Overlaps with:** #N — shared code/concern
            - **Blocked by:** #N — reason
            - **Blocks:** #N — reason

            ### Acceptance Criteria
            [Assessment: existing criteria are testable / proposed criteria below / needs human judgment]

            If proposing criteria:
            - [ ] Criterion 1
            - [ ] Criterion 2

            ### Code Surface Area
            **Files likely touched:**
            - `path/to/file.ts` — reason
            - `path/to/other.ts` — reason

            **Effort estimate:** small/medium/large

            ### Research Findings
            [Type-specific findings — implementation patterns, root cause analysis, relevant APIs, etc.]

            ### Priority Assessment
            [Current priority is appropriate / Recommend changing to X because Y]

            ---
            *Automated enrichment by Claude — verify findings before implementation*

            ## Labels

            After posting the comment, apply labels to issue #${{ matrix.issue }} using:
            gh issue edit ${{ matrix.issue }} --add-label "<label1>" --add-label "<label2>"

            Apply these labels based on your analysis:

            **Effort** (exactly one):
            - `effort/small` — <30 min implementation
            - `effort/medium` — 30min-2hr implementation
            - `effort/large` — >2hr implementation

            **Criteria status** (exactly one):
            - `has-criteria` — issue has objectively testable acceptance criteria
            - `needs-criteria` — criteria are missing or vague

            Do NOT modify existing type or priority labels. Only add effort and criteria labels.
            If the labels don't exist yet, create them first:
            gh label create "effort/small" --color "0E8A16" --description "< 30min" 2>/dev/null || true
            gh label create "effort/medium" --color "FBCA04" --description "30min - 2hr" 2>/dev/null || true
            gh label create "effort/large" --color "D93F0B" --description "> 2hr" 2>/dev/null || true
            gh label create "has-criteria" --color "0075CA" --description "Has testable acceptance criteria" 2>/dev/null || true
            gh label create "needs-criteria" --color "E4E669" --description "Needs acceptance criteria defined" 2>/dev/null || true

            IMPORTANT:
            - Be concise. Each section should be 1-3 sentences unless detail is needed.
            - Do not speculate. If you can't determine something from the code, say so.
            - Do not start implementing the issue. Research and report only.
            - Post exactly one comment. Do not edit the issue body.
            - The issue number is ${{ matrix.issue }}. Do NOT enrich any other issue.

          claude_args: '--allowed-tools "Read,Glob,Grep,Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh search:*)"'

      - name: Verify enrichment completed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ matrix.issue }}
        run: |
          # Check issue is accessible
          if ! gh issue view "$ISSUE_NUM" --json state >/dev/null 2>&1; then
            echo "::error::Issue #${ISSUE_NUM} is not accessible (deleted, locked, or private)"
            exit 1
          fi

          # Check enrichment comment was posted
          has_comment=$(gh issue view "$ISSUE_NUM" --json comments \
            --jq '[.comments[].body | test("Issue Enrichment Report")] | any')

          if [ "$has_comment" != "true" ]; then
            echo "::error::Enrichment comment was not posted to issue #${ISSUE_NUM}"
            exit 1
          fi

          # Check effort label was applied (warning only, not blocking)
          has_effort=$(gh issue view "$ISSUE_NUM" --json labels \
            --jq '[.labels[].name | test("^effort/")] | any')

          if [ "$has_effort" != "true" ]; then
            echo "::warning::Effort label was not applied to issue #${ISSUE_NUM}"
          fi

          echo "✓ Enrichment verified for issue #${ISSUE_NUM}"

  # Runs automatically when a new issue is opened
  enrich-single:
    if: github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'skip-enrichment')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: React with eyes emoji
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions \
            -f content=eyes

      - name: Enrich issue
        id: enrich
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            You are an issue enrichment agent for a GitHub repository. Your job is to
            research issue #${{ github.event.issue.number }} and post a structured analysis comment that
            helps the team make faster decisions when they pick it up for implementation.


id: drift-detection
name: Drift Detection and Model Retraining
shortName: Drift Detection
examTask: task-4-1
description: >
  Master drift detection strategies for production ML models including data drift, concept drift,
  and bias drift monitoring using Amazon SageMaker Model Monitor and Clarify. Learn to create
  baselines, detect violations, configure automated retraining triggers, and implement A/B testing
  and shadow deployments for model validation.
estimatedStudyTime: 75
difficulty: advanced
prerequisites:
  - model-monitoring
  - sagemaker-endpoints
keyServices:
  - Amazon SageMaker Model Monitor
  - Amazon SageMaker Clarify
  - Amazon SageMaker Pipelines
  - Amazon EventBridge
  - Amazon CloudWatch
  - AWS Step Functions
keyConcepts:
  - Data drift detection
  - Concept drift vs data drift
  - Bias drift monitoring
  - Feature attribution drift
  - Baseline creation and constraints
  - Constraint violations
  - Automated retraining triggers
  - A/B testing with production variants
  - Shadow deployments
  - Model quality degradation
  - Statistical distribution analysis
  - Deequ for data quality metrics

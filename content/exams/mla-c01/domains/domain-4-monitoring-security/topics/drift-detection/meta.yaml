    type: doc
  - title: Testing Models with Shadow Variants
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-shadow-deployment.html
    type: doc
  - title: Automate Model Retraining with SageMaker Pipelines When Drift is Detected

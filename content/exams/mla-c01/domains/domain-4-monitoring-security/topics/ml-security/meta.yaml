id: ml-security
name: Security for ML Solutions
shortName: ML Security
examTask: task-4-3
description: Implement comprehensive security controls for machine learning workloads including IAM policies and execution roles, KMS encryption for data and models, VPC network isolation, secrets management, and compliance controls using AWS SageMaker security features and best practices.
estimatedStudyTime: 90
difficulty: advanced
keyServices:
  - AWS IAM
  - AWS KMS
  - Amazon VPC
  - AWS Secrets Manager
  - Amazon SageMaker
  - AWS CloudTrail
  - AWS Security Hub
  - Amazon GuardDuty
  - AWS Resource Access Manager
keyConcepts:
  - IAM execution roles
  - SageMaker condition keys
  - Resource-based policies
  - KMS customer-managed keys
  - Encryption at rest and in transit
  - VPC endpoints and PrivateLink
  - Network isolation
  - Inter-container encryption
  - VPC-only mode
  - Secrets rotation
  - Model registry access control
  - Cross-account model sharing
  - CloudTrail audit logging
  - Security monitoring
  - Compliance validation

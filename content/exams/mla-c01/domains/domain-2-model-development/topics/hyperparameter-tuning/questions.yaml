  - id: hpt-013
    type: multi
    correctCount: 2
    text: |
      A company runs monthly hyperparameter tuning jobs for their recommendation model. Each month's tuning job costs $800 in compute and takes 18 hours. The ML team wants to reduce both cost and time while maintaining model quality.

      Which TWO strategies would provide the most significant combined reduction in cost and time?
    options:
      - id: A
        text: Use warm start tuning with each month's job using the previous month as a parent to leverage historical hyperparameter knowledge.
      - id: B
        text: Switch from Bayesian optimization to Random Search to maximize parallel job execution and reduce overall duration.
      - id: C
        text: Enable Managed Spot Training to reduce instance costs by 50-90% with automatic interruption handling.
      - id: D
        text: Enable CompleteOnConvergence to automatically stop tuning when improvements drop below 1% likelihood.
      - id: E
        text: Reduce MaxNumberOfTrainingJobs by 50% to cut costs in half.
    correctAnswer:
      - A
      - C
    explanation: |
      Options A and C provide the best combined cost and time reduction while maintaining quality:

      **Option A - Warm Start Tuning:**

      **Time reduction: 30-50%**
      - Leverages previous month's results to focus search on promising regions
      - Reduces exploration needed to find good configurations
      - Each month builds on the previous month's knowledge

      **Quality maintenance:**
      - Doesn't reduce search coverage, just makes it more efficient
      - Uses TRANSFER_LEARNING type since data changes monthly
      - Can adapt to dataset drift while retaining hyperparameter insights

      **Cost reduction: 30-50%** (indirectly via time reduction)
      - Fewer total training jobs needed to reach convergence
      - Can reduce MaxNumberOfTrainingJobs without compromising results

      **Option C - Managed Spot Training:**

      **Cost reduction: 50-90%**
      - Spot instances cost 50-90% less than On-Demand for same instance types
      - SageMaker handles interruptions automatically with checkpointing
      - No code changes needed, just configuration flag

      **Time impact: Minimal (0-15% increase)**
      - Spot interruptions may occasionally extend individual jobs
      - Overall tuning time largely unaffected due to parallel job execution
      - Interruptions rarely impact critical path in tuning workflows

      **Quality maintenance:**
      - Identical training algorithms, data, and hyperparameters
      - Only infrastructure changes (Spot vs On-Demand)

      **Combined impact of A + C:**
      - Time reduction: 30-50% (from warm start)
      - Cost reduction: 65-95% (30-50% from warm start time savings + 50-90% from Spot on remaining compute)
      - Quality: Maintained or improved (warm start can find better configurations faster)

      Why other options are less effective:

      - Option B (Random Search): Switching strategies might increase parallelism but doesn't fundamentally reduce work needed. Bayesian optimization's intelligent search often finds good solutions with fewer total jobs than Random Search. This swap might INCREASE costs due to more jobs needed, while only marginally reducing time

      - Option D (CompleteOnConvergence): Provides moderate time/cost savings (10-30%) by stopping when improvement plateaus. However, this is less impactful than warm start + Spot. Also, Option D alone doesn't guarantee quality maintenance - it might stop before reaching quality targets

      - Option E (Reduce MaxNumberOfTrainingJobs by 50%): Cuts costs by ~50% but significantly risks quality compromise. Halving search coverage likely misses optimal configurations, violating the "maintaining quality" requirement. This is a cost-quality tradeoff, not a pure efficiency gain

      **Implementation approach:**

      Month 1 (January):
      - Run initial tuning job with Managed Spot Training enabled
      - MaxNumberOfTrainingJobs: 150, Spot savings: ~70%
      - Cost: $800 × 0.30 = $240 (vs $800 baseline)

      Month 2 (February):
      - Warm start using January job as parent
      - Managed Spot Training enabled
      - MaxNumberOfTrainingJobs: 100 (warm start reduces jobs needed)
      - Time: ~12 hours (vs 18 baseline)
      - Cost: $800 × 0.30 × (100/150) = $160 (vs $800 baseline)

      Ongoing monthly savings: ~$640/month = $7,680/year

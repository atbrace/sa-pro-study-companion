  - id: hpt-015
    type: single
    text: |
      A tuning job was configured with MaxNumberOfTrainingJobs set to 250 and BestObjectiveNotImproving.MaxNumberOfTrainingJobsNotImproving set to 30. After running for several hours, the job completed with only 142 training jobs executed.

      Reviewing the DescribeHyperParameterTuningJob response shows:
      - BestTrainingJob objective metric: 0.8821
      - TuningJobStatus: Completed
      - ObjectiveStatusCounters.Succeeded: 142

      Training jobs 113-142 all had objective metrics between 0.8650 and 0.8805 (none exceeded 0.8821).

      What caused the tuning job to stop before reaching 250 training jobs?
    options:
      - id: A
        text: Early stopping terminated 108 training jobs (250 - 142 = 108) due to poor performance compared to the median baseline.
      - id: B
        text: The BestObjectiveNotImproving completion criterion was met after 30 consecutive jobs (jobs 113-142) failed to improve beyond 0.8821.
      - id: C
        text: The tuning job reached convergence because the objective metric values (0.8650-0.8805) were within 1% of the best value (0.8821).
      - id: D
        text: All remaining hyperparameter combinations were exhausted, leaving no new configurations to test.
    correctAnswer: B
    explanation: |
      Option B correctly identifies the stopping reason:

      **BestObjectiveNotImproving criterion triggered:**

      1. **Configuration**: `MaxNumberOfTrainingJobsNotImproving: 30` was set in the completion criteria
      2. **Best metric**: Job achieved 0.8821 as the best objective metric (presumably maximizing accuracy or similar)
      3. **Consecutive non-improving jobs**: Jobs 113-142 (30 consecutive jobs) all produced metrics below 0.8821, ranging from 0.8650-0.8805
      4. **Stopping condition**: After 30 consecutive jobs without improvement beyond 0.8821, SageMaker stopped the tuning job per the configured completion criterion

      **Why this criterion exists:**

      BestObjectiveNotImproving detects when the search has plateaued - continuing to explore the hyperparameter space is unlikely to find significantly better configurations. This saves compute costs and time when further exploration shows diminishing returns.

      **Job count analysis:**
      - Jobs 1-112: Exploration phase, best metric (0.8821) was found during this period
      - Jobs 113-142: 30 consecutive jobs that didn't exceed 0.8821
      - Jobs 143-250: Never executed because stopping criterion was met at job 142

      Why other options are incorrect:

      - Option A: Early stopping (`TrainingJobEarlyStoppingType='Auto'`) stops individual training jobs mid-execution (e.g., after a few epochs) if they're underperforming. It does NOT stop the overall tuning job or prevent jobs from being launched. The fact that 142 jobs "Succeeded" (per ObjectiveStatusCounters) indicates they completed normally, not stopped early. Additionally, early stopping is a within-job mechanism, while this is a between-jobs tuning job completion criterion

      - Option C: While the metric range (0.8650-0.8805) is within ~2% of 0.8821, this describes convergence detection (`CompleteOnConvergence`), which wasn't mentioned in the configuration. BestObjectiveNotImproving (which WAS configured) uses a count-based threshold (30 consecutive jobs), not a percentage-improvement threshold. The question explicitly states this criterion was set to 30

      - Option D: The tuning job used Bayesian optimization, Random Search, or Hyperband (not Grid Search, as the question doesn't specify Grid Search). These strategies have infinite or extremely large search spaces for continuous/integer parameters - they never "exhaust" combinations. Even if discrete, 250 jobs is far too few to exhaust meaningful hyperparameter combinations across typical search spaces. The stop was due to the configured completion criterion, not search space exhaustion

      **Best practices for BestObjectiveNotImproving:**

      - Set to 10-30 for small tuning jobs (<100 total jobs)
      - Set to 30-50 for medium tuning jobs (100-300 total jobs)
      - Set to 50-100 for large tuning jobs (300+ total jobs)

      Higher values reduce the risk of stopping prematurely due to local plateaus in the search, while lower values save costs when genuine convergence occurs.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning-progress.html
    services:
      - Amazon SageMaker Automatic Model Tuning
    concepts:
      - BestObjectiveNotImproving
      - Completion criteria
      - Consecutive non-improving jobs
      - Tuning job stopping

  - id: hpt-016
    type: single
    text: |
      A machine learning team needs to tune hyperparameters for a custom TensorFlow neural network that trains for 100 epochs and publishes validation accuracy after each epoch using tf.keras.callbacks.ProgbarLogger. Training takes approximately 40 minutes per job. They want to use Hyperband strategy for efficient resource allocation.

      How should early stopping be configured for this Hyperband tuning job?
    options:
      - id: A
        text: Set TrainingJobEarlyStoppingType to "Auto" to enable SageMaker early stopping alongside Hyperband's resource allocation.
      - id: B
        text: Set TrainingJobEarlyStoppingType to "Off" because Hyperband has its own built-in early stopping mechanism.
      - id: C
        text: Set TrainingJobEarlyStoppingType to "Auto" only if MaxParallelTrainingJobs is greater than 10 to avoid conflicts.
      - id: D
        text: Configure a custom early stopping callback in the TensorFlow training script since SageMaker early stopping doesn't work with Hyperband.
    correctAnswer: B
    explanation: |
      Option B is correct - set `TrainingJobEarlyStoppingType` to "Off" when using Hyperband because:

      1. **Hyperband's built-in early stopping**: Hyperband has its own sophisticated early stopping and resource allocation mechanism that:
         - Evaluates configurations at multiple resource levels (epochs)
         - Dynamically reallocates epochs from poor performers to promising configurations
         - Uses successive halving to progressively eliminate underperformers
         - Makes stopping decisions based on intermediate metrics at each bracket level

      2. **Conflict avoidance**: Enabling both SageMaker early stopping (Auto) and Hyperband's early stopping creates conflicts:
         - Two different algorithms making independent stopping decisions
         - SageMaker early stopping uses median comparison across all jobs
         - Hyperband uses bracket-based resource allocation and successive halving
         - Conflicting decisions can lead to premature termination of potentially promising configurations

      3. **AWS recommendation**: AWS documentation explicitly recommends setting `TrainingJobEarlyStoppingType='Off'` (the default) when using Hyperband strategy to avoid interference with Hyperband's resource allocation logic

      4. **Hyperband is sufficient**: Hyperband's early stopping is more sophisticated than SageMaker's standard early stopping for iterative algorithms:
         - Considers both intermediate and final results
         - Allocates resources dynamically rather than simple binary stop/continue
         - Optimized for multi-epoch training scenarios (exactly this use case)

      **Configuration example:**

      ```python
      tuner = HyperparameterTuner(
          estimator=tensorflow_estimator,
          objective_metric_name='validation:accuracy',
          hyperparameter_ranges=hyperparameter_ranges,
          objective_type='Maximize',
          max_jobs=100,
          max_parallel_jobs=10,
          strategy='Hyperband',
          early_stopping_type='Off'  # Critical for Hyperband
      )
      ```

      Why other options are incorrect:

      - Option A: Setting TrainingJobEarlyStoppingType to "Auto" with Hyperband creates conflicting early stopping mechanisms. While it won't cause a hard error, it can lead to suboptimal resource allocation as SageMaker's median-based early stopping interferes with Hyperband's bracket-based successive halving

      - Option C: There's no MaxParallelTrainingJobs threshold that makes combining SageMaker early stopping and Hyperband appropriate. Regardless of parallelism level, Hyperband's built-in early stopping should be used exclusively. This option invents a non-existent constraint

      - Option D: Custom early stopping callbacks in TensorFlow (like EarlyStopping) control within-job stopping (e.g., stop at epoch 30 if validation accuracy plateaus). This is separate from hyperparameter tuning's between-job early stopping. Hyperband operates at the tuning job level, not within individual training jobs. Custom callbacks don't replace or supplement Hyperband's mechanism. Furthermore, Hyperband DOES work with SageMaker - it's a fully supported strategy

      **How Hyperband's early stopping works:**

      Hyperband uses successive halving across brackets:
      - **Bracket 1**: Trains many configurations with few epochs (e.g., 64 configs × 10 epochs)
      - **Halving**: Keeps top 50% based on intermediate metrics, discards rest
      - **Bracket 2**: Trains survivors with more epochs (e.g., 32 configs × 20 epochs)
      - **Repeat**: Continue halving and increasing epochs until few configurations receive full 100 epochs

      This adaptive resource allocation is far more efficient than binary early stopping for iterative algorithms with intermediate metrics.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning-how-it-works.html
    services:
      - Amazon SageMaker Automatic Model Tuning
      - Amazon SageMaker Training Jobs
    concepts:
      - Hyperband strategy
      - Early stopping
      - Multi-fidelity optimization
      - Resource allocation

  - id: hpt-017
    type: multi
    correctCount: 3
    text: |
      An ML engineer is reviewing a completed hyperparameter tuning job using the DescribeHyperParameterTuningJob API. The response includes:

      BestTrainingJob:
        TrainingJobName: "tuning-job-042"
        FinalHyperParameterTuningJobObjectiveMetric:
          MetricName: "validation:accuracy"
          Value: 0.9145

      OverallBestTrainingJob:
        TrainingJobName: "parent-job-087"
        FinalHyperParameterTuningJobObjectiveMetric:
          MetricName: "validation:accuracy"
          Value: 0.9287

      Which THREE statements are correct interpretations of this response?
    options:
      - id: A
        text: The tuning job was configured as a warm start job using one or more parent tuning jobs.
      - id: B
        text: The warm start type was IDENTICAL_DATA_AND_ALGORITHM because OverallBestTrainingJob is only returned for this warm start type.
      - id: C
        text: The current tuning job's best result (0.9145) is worse than the overall best result (0.9287) from a parent job.
      - id: D
        text: The engineer should use the hyperparameters from "tuning-job-042" for production deployment since it represents the current job's best model.
      - id: E
        text: The engineer should use the hyperparameters from "parent-job-087" for production deployment since it represents the best model across all tuning efforts.
    correctAnswer:
      - A
      - B
      - E
    explanation: |
      The correct statements are A, B, and E:

      **Statement A - CORRECT**: The presence of `OverallBestTrainingJob` in the API response definitively indicates this was a warm start tuning job. This field is ONLY returned for warm start jobs and shows the best training job across the current job and all parent jobs.

      **Statement B - CORRECT**: `OverallBestTrainingJob` is specifically returned only for warm start jobs with type `IDENTICAL_DATA_AND_ALGORITHM`. This warm start type is used when:
      - Same training data as parent jobs
      - Same algorithm version as parent jobs
      - Only hyperparameter ranges, job counts, or tunable/static conversions changed

      For `TRANSFER_LEARNING` warm start jobs (different data or algorithm), `OverallBestTrainingJob` is NOT returned because cross-dataset comparisons aren't meaningful - the objective metric values aren't directly comparable when data distributions differ.

      **Statement E - CORRECT**: For production deployment, use the hyperparameters from "parent-job-087" (0.9287 accuracy) because:
      - It has the highest validation accuracy across all tuning efforts (current + parents)
      - IDENTICAL_DATA_AND_ALGORITHM guarantees this model was trained on the same data and algorithm as the current job
      - The objective metric (validation:accuracy) is directly comparable across all jobs
      - Goal is to deploy the best-performing model, regardless of which tuning job found it

      **AWS documentation explicitly states:** "For warm start tuning jobs of type IDENTICAL_DATA_AND_ALGORITHM, OverallBestTrainingJob returns the training job with the best objective metric value of all training jobs launched by this tuning job and all parent jobs."

      Why other statements are incorrect:

      **Statement C - PARTIALLY TRUE but MISLEADING**: While factually accurate (0.9145 < 0.9287), this statement implies a negative outcome. However, this is actually expected and acceptable behavior in warm start tuning:
      - Not every tuning job must surpass parents
      - Warm start explores new regions while building on parent knowledge
      - The parent job already found an excellent configuration (0.9287)
      - Current job refined the search and confirmed no significantly better configurations exist
      - The overall effort still succeeded because the best model (parent) is identified

      **Statement D - INCORRECT**: Using "tuning-job-042" would deploy a suboptimal model (0.9145 vs 0.9287 accuracy). The purpose of OverallBestTrainingJob is to identify the globally best model across all related tuning jobs. Ignoring this information and deploying only the current job's best would result in worse production performance (1.4% lower accuracy in this case).

      **Proper workflow:**

      1. Review DescribeHyperParameterTuningJob response
      2. Check for OverallBestTrainingJob field (indicates warm start with IDENTICAL_DATA_AND_ALGORITHM)
      3. If present, use OverallBestTrainingJob for production (highest metric across all efforts)
      4. If absent, use BestTrainingJob (current job's best)
      5. Retrieve hyperparameters via DescribeTrainingJob API using the selected job name
      6. Deploy model from the selected training job to production

      **Production deployment code:**

      ```python
      response = sm_client.describe_hyper_parameter_tuning_job(
          HyperParameterTuningJobName='current-tuning-job'
      )

      # Use OverallBestTrainingJob if available (warm start IDENTICAL_DATA_AND_ALGORITHM)
      if 'OverallBestTrainingJob' in response:
          best_job_name = response['OverallBestTrainingJob']['TrainingJobName']
          best_metric = response['OverallBestTrainingJob']['FinalHyperParameterTuningJobObjectiveMetric']['Value']
      else:
          best_job_name = response['BestTrainingJob']['TrainingJobName']
          best_metric = response['BestTrainingJob']['FinalHyperParameterTuningJobObjectiveMetric']['Value']

      # Deploy the best model
      predictor = estimator.deploy(
          initial_instance_count=1,
          instance_type='ml.m5.xlarge',
          model_uri=f's3://bucket/path/{best_job_name}/model.tar.gz'
      )
      ```
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning-warm-start.html

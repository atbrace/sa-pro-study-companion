  - id: hpt-012
    type: single
    text: |
      A hyperparameter tuning job with the following configuration has been running for 6 hours:
      - MaxNumberOfTrainingJobs: 200
      - MaxParallelTrainingJobs: 10
      - TuningJobCompletionCriteria.ConvergenceDetected.CompleteOnConvergence: Enabled

      The DescribeHyperParameterTuningJob API shows:
      - TrainingJobStatusCounters.Completed: 87
      - BestTrainingJob.FinalHyperParameterTuningJobObjectiveMetric.Value: 0.9234
      - TuningJobStatus: Completed
      - TuningJobCompletionDetails.ConvergenceDetectedTime: 2024-11-15T14:23:00Z

      Why did the tuning job stop before reaching 200 training jobs?
    options:
      - id: A
        text: The best training job achieved the maximum possible objective metric value (0.9234) and further tuning would not improve results.
      - id: B
        text: Convergence was detected - the algorithm determined that additional training jobs are unlikely to improve beyond 1% of the current best metric (0.9234).
      - id: C
        text: All 10 parallel training jobs failed simultaneously due to resource constraints, causing automatic job termination.
      - id: D
        text: The tuning job reached the maximum runtime limit before completing all 200 training jobs.
    correctAnswer: B
    explanation: |
      Convergence detection (Option B) caused the early stop because:

      1. **ConvergenceDetectedTime present**: The API response includes `ConvergenceDetectedTime: 2024-11-15T14:23:00Z`, indicating that SageMaker's convergence detection algorithm determined the search had converged
      2. **CompleteOnConvergence enabled**: The configuration explicitly enabled `CompleteOnConvergence: Enabled`, instructing SageMaker to stop when convergence is detected
      3. **Convergence definition**: SageMaker defines convergence as a state where additional training jobs are unlikely to return more than 1% improvement over the current best objective metric (0.9234 in this case)
      4. **Stopped at 87/200 jobs**: The job completed only 87 of 200 planned training jobs, stopped early due to convergence rather than reaching the MaxNumberOfTrainingJobs limit

      **How convergence detection works:**

      SageMaker's proprietary convergence detection algorithm analyzes:
      - Distribution of recent objective metric values
      - Improvement trends over the last N training jobs
      - Statistical likelihood of future improvements
      - Hyperparameter space exploration coverage

      When the algorithm determines that the probability of finding configurations more than 1% better than the current best is very low, it marks the job as converged.

      Why other options are incorrect:

      - Option A: 0.9234 is not necessarily the "maximum possible" value - metrics can approach 1.0 for accuracy-like objectives. The job stopped due to convergence detection (unlikely to improve >1%), not because the maximum was reached. Also, the TuningJobCompletionDetails specifically shows ConvergenceDetectedTime, not a max-value indicator

      - Option C: If multiple parallel jobs failed simultaneously, TrainingJobStatusCounters would show failed jobs. The API response shows 87 Completed jobs with no mention of failures. Also, the TuningJobStatus is "Completed" (success), not "Failed" or "Stopped" (which would indicate abnormal termination)

      - Option D: The configuration doesn't specify MaxRuntimeInSeconds, so there's no explicit runtime limit. Additionally, the TuningJobCompletionDetails specifically shows ConvergenceDetectedTime, which is only populated when convergence triggers the stop - not when runtime limits are reached (which would populate a different field)

      **Value of convergence detection:**

      Convergence detection saved 113 unnecessary training jobs (200 - 87 = 113), reducing:
      - Compute costs by ~56% (113/200)
      - Tuning time by ~56%
      - Carbon footprint from unused compute

      While still achieving near-optimal results (further jobs unlikely to improve >1%).

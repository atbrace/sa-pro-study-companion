  - id: hpt-018
    type: single
    text: |
      A data scientist wants to implement Autotune for a hyperparameter tuning job to automatically optimize configuration without manual specification. The algorithm being tuned is XGBoost for a regression task with objective metric "validation:rmse" (minimize).

      Which fields can Autotune automatically configure when Mode is set to "Enabled"?
    options:
      - id: A
        text: Only ParameterRanges - Autotune converts AutoParameters with ValueHints into optimized IntegerParameterRanges or ContinuousParameterRanges.
      - id: B
        text: ParameterRanges, ResourceLimits (MaxNumberOfTrainingJobs, MaxParallelTrainingJobs), and Strategy (Bayesian, Random, Hyperband).
      - id: C
        text: ParameterRanges, ResourceLimits, TrainingJobEarlyStoppingType, RetryStrategy, Strategy, and ConvergenceDetected completion criteria.
      - id: D
        text: Only Strategy and ResourceLimits - ParameterRanges must always be specified manually for algorithm-specific hyperparameters.
    correctAnswer: C
    explanation: |
      Option C is correct - Autotune can automatically configure:

      1. **ParameterRanges**: Converts AutoParameters (with optional ValueHints) into optimized IntegerParameterRanges, ContinuousParameterRanges, or CategoricalParameterRanges based on algorithm characteristics and hints

      2. **ResourceLimits**: Optimizes MaxNumberOfTrainingJobs and MaxParallelTrainingJobs based on the algorithm, dataset size, and time constraints

      3. **TrainingJobEarlyStoppingType**: Determines whether to enable early stopping (Auto) or disable it (Off) based on expected training job characteristics

      4. **RetryStrategy**: Configures automatic retry policies for training jobs that fail due to transient errors

      5. **Strategy**: Selects the optimal tuning strategy (Bayesian, Random, Hyperband, Grid) based on hyperparameter types, expected training duration, and parallelism needs

      6. **ConvergenceDetected**: Configures CompleteOnConvergence completion criteria to automatically stop when convergence is detected

      **How Autotune works:**

      The data scientist provides high-level hints:

      ```python
      config = {
          'Autotune': {'Mode': 'Enabled'},
          'HyperParameterTuningJobConfig': {
              'HyperParameterTuningJobObjective': {
                  'Type': 'Minimize',
                  'MetricName': 'validation:rmse'
              },
              'ResourceLimits': {
                  'MaxNumberOfTrainingJobs': 100,
                  'MaxParallelTrainingJobs': 5
              },
              'ParameterRanges': {
                  'AutoParameters': [
                      {'Name': 'eta', 'ValueHint': '0.1'},
                      {'Name': 'max_depth', 'ValueHint': '6'},
                      {'Name': 'subsample', 'ValueHint': '0.8'}
                  ]
              }
          }
      }
      ```

      Autotune converts this to optimized configuration:

      ```python
      {
          'Strategy': 'Bayesian',  # Autotune selected
          'TrainingJobEarlyStoppingType': 'Off',  # XGBoost benefits less from early stopping
          'TuningJobCompletionCriteria': {
              'ConvergenceDetected': {'CompleteOnConvergence': 'Enabled'}
          },
          'ParameterRanges': {
              'ContinuousParameterRanges': [
                  {'Name': 'eta', 'MinValue': '0.01', 'MaxValue': '0.3', 'ScalingType': 'Logarithmic'}
              ],
              'IntegerParameterRanges': [
                  {'Name': 'max_depth', 'MinValue': '3', 'MaxValue': '10', 'ScalingType': 'Linear'}
              ],
              'ContinuousParameterRanges': [
                  {'Name': 'subsample', 'MinValue': '0.5', 'MaxValue': '1.0', 'ScalingType': 'Linear'}
              ]
          }
      }
      ```

      **Benefits:**

      - Reduces ML engineering effort - no need to research optimal ranges and strategies
      - Leverages AWS's knowledge of algorithm characteristics
      - Automatically applies best practices for scaling types
      - Adapts configuration based on ValueHints and algorithm type

      Why other options are incorrect:

      - Option A: Autotune does far more than just ParameterRanges. It optimizes the full tuning configuration including strategy, resource limits, early stopping, retry policies, and convergence detection

      - Option B: Missing several key fields that Autotune configures: TrainingJobEarlyStoppingType, RetryStrategy, and ConvergenceDetected. Option B lists only a subset of Autotune's capabilities

      - Option D: Backwards logic. Autotune's PRIMARY value is automatically determining ParameterRanges from AutoParameters with ValueHints. Strategy and ResourceLimits optimization is secondary. Without ParameterRanges automation, Autotune would lose much of its value proposition

      **When to use Autotune:**

      - Prototyping new models without hyperparameter tuning expertise
      - Using SageMaker built-in algorithms where AWS has deep knowledge
      - Time-constrained projects where manual configuration research isn't feasible
      - Teams new to hyperparameter optimization

      **When to manually configure:**

      - Domain expertise suggests specific ranges (e.g., known good learning rates for your data)
      - Custom algorithms where Autotune lacks algorithm-specific knowledge
      - Production workloads requiring reproducible, version-controlled configurations
      - Advanced users who want fine-grained control over tuning behavior

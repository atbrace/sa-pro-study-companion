  - id: me-016
    type: single
    text: |
      A data scientist is using Amazon SageMaker to train a multi-class classification model with 8 classes.
      After training, they examine the confusion matrix and notice that class 3 is frequently misclassified
      as class 5, with 230 out of 300 class 3 examples being predicted as class 5.

      What is the MOST effective approach to address this specific confusion?
    options:
      - id: A
        text: Remove class 5 from the dataset entirely
      - id: B
        text: Gather more training data for classes 3 and 5, and add features that better distinguish between them
      - id: C
        text: Increase the learning rate to help the model learn faster
      - id: D
        text: Switch from multi-class classification to binary classification
    correctAnswer: B
    explanation: |
      High confusion between specific classes indicates the model cannot distinguish them with the current
      features and training data. The confusion matrix shows this is a class-specific problem (class 3 vs
      class 5), not a general model failure.

      The solution is to:
      1. Gather more training examples for both classes 3 and 5 to give the model more opportunities to
      learn their differences
      2. Perform error analysis - examine the misclassified examples to understand what makes class 3 and
      class 5 similar
      3. Engineer features that distinguish between these classes based on the error analysis insights
      4. Consider class weights to penalize class 3 vs class 5 confusion more heavily during training

      For example, if classes 3 and 5 represent similar product categories, you might add features about
      subcategories, price ranges, or customer segments that differentiate them.

      Option A is incorrect and counterproductive - removing a class does not solve the business problem
      of distinguishing these categories. Option C is incorrect - learning rate affects convergence and
      stability, not the model's ability to distinguish similar classes. Option D is incorrect - converting
      to binary classification loses information about the other 6 classes and does not address the
      fundamental issue.

      SageMaker Autopilot automatically generates confusion matrices with up to 15 classes, helping you
      identify these class-specific issues.
    awsDocLink: https://aws.amazon.com/blogs/machine-learning/automatically-generate-model-evaluation-metrics-using-sagemaker-autopilot-model-quality-reports/

      - Confusion Matrix
      - Multi-Class Classification
      - Error Analysis
      - Feature Engineering

  - id: me-017
    type: single
    text: |
      A machine learning team wants to build a scalable k-fold cross-validation pipeline for a dataset with
      5 million records. Traditional sequential k-fold training takes 10 hours. Which AWS architecture would
      MOST effectively reduce this time?
    options:
      - id: A
        text: Use a single larger EC2 instance with more CPU and memory
      - id: B
        text: Implement SageMaker Pipelines with a preprocessing step that splits data into k folds, followed by k parallel SageMaker Training jobs
      - id: C
        text: Use AWS Lambda to train each fold sequentially
      - id: D
        text: Store the data in Amazon DynamoDB for faster access during training
    correctAnswer: B
    explanation: |
      Traditional k-fold cross-validation trains k models sequentially on a single machine, which does not
      scale well. The solution is to parallelize the k training jobs.

      SageMaker Pipelines Architecture:
      1. Preprocessing Step: Use SageMaker Processing to split the 5 million records into k folds (e.g., k=5)
      and upload each fold combination to S3
      2. Parallel Training: Launch k SageMaker Training jobs simultaneously, each using a different fold
      combination for train/validation
      3. Model Evaluation: Aggregate metrics from all k jobs to compute mean and standard deviation of
      performance metrics
      4. Model Registration: Register the best model or ensemble in Model Registry

      By running k training jobs in parallel instead of sequentially, you reduce total time from k × training_time
      to approximately training_time (plus overhead). In this scenario, 10 hours could become ~2 hours (plus
      preprocessing and aggregation).

      SageMaker Training automatically provisions and tears down compute resources, and supports distributed
      training for large models and datasets.

      Option A helps but does not eliminate the sequential bottleneck - you still train k models one after
      another. Option C is incorrect because Lambda has a 15-minute timeout and limited resources, making
      it unsuitable for training on 5 million records. Option D is incorrect because DynamoDB is not optimized
      for ML training data access - S3 is the standard for SageMaker training data.
    awsDocLink: https://aws.amazon.com/blogs/architecture/field-notes-build-a-cross-validation-machine-learning-model-pipeline-at-scale-with-amazon-sagemaker/
    services:
      - Amazon SageMaker Pipelines
      - Amazon SageMaker Training
      - Amazon SageMaker Processing
    concepts:
      - Cross-Validation
      - Parallel Training
      - MLOps
      - Scalability

  - id: me-018
    type: multi
    correctCount: 2
    text: |
      A model monitoring job using Amazon SageMaker Model Monitor detects that the mean of a critical feature
      "transaction_amount" has drifted from $125 (baseline) to $340 (current production). Which TWO actions
      should the team take?
    options:
      - id: A
        text: Immediately retrain the model without investigating the cause of drift
      - id: B
        text: Investigate whether the drift is due to legitimate changes in user behavior or a data pipeline issue
      - id: C
        text: Disable monitoring for the transaction_amount feature
      - id: D
        text: Validate current model performance with recent ground truth data to quantify the impact of drift
      - id: E
        text: Increase the drift threshold to prevent future alarms
    correctAnswer: [B, D]
    explanation: |
      Data drift detection is an early warning system, but not all drift requires the same response. The
      team must understand the cause and impact:

      Option B (Investigate Root Cause): The drift could be due to:
      - Legitimate behavior change (customers purchasing higher-value items, seasonal effect, new product launch)
      - Data pipeline bug (currency conversion error, data corruption, missing data being filled with defaults)
      - Data quality issue (outliers, incorrect data source)
      - Adversarial manipulation

      Understanding the cause determines the appropriate response. If it is legitimate behavior change,
      retraining is appropriate. If it is a bug, fix the pipeline before retraining.

      Option D (Validate Performance Impact): Drift does not always degrade performance. Collect recent ground
      truth labels and compute current model metrics (accuracy, precision, recall, etc.). If performance is
      still acceptable, retraining may not be urgent. If performance has degraded significantly, prioritize
      retraining.

      Option A is incorrect - retraining without understanding the cause might not fix the issue (if it is
      a data bug) or might introduce new problems. Option C is incorrect - disabling monitoring for a critical
      feature loses important visibility. Option E is incorrect - raising thresholds to silence alarms does
      not address the underlying drift.

      Model Monitor integrates with CloudWatch Alarms and EventBridge to automate investigation workflows.
    awsDocLink: https://aws.amazon.com/blogs/architecture/detecting-data-drift-using-amazon-sagemaker/
    services:
      - Amazon SageMaker Model Monitor
      - Amazon CloudWatch
    concepts:
      - Data Drift
      - Root Cause Analysis
      - Model Performance Validation
      - Incident Response

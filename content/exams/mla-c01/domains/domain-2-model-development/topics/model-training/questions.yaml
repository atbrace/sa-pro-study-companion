  - id: mt-016
    type: single
    text: |
      A company is running automated hyperparameter tuning jobs daily for multiple models. Each tuning
      job runs 100 training jobs with Bayesian optimization. The team notices that tuning jobs for
      similar models (e.g., image classifiers with different datasets) often explore the same
      suboptimal hyperparameter ranges before converging.

      Which SageMaker feature would help reduce redundant exploration and accelerate tuning?
    options:
      - id: A
        text: Enable automatic early stopping to terminate poorly performing jobs faster
      - id: B
        text: Use warm start tuning to leverage results from previous tuning jobs
      - id: C
        text: Switch to Hyperband strategy to allocate resources more efficiently
      - id: D
        text: Increase MaxParallelTrainingJobs to explore more hyperparameters simultaneously
    correctAnswer: B
    explanation: |
      Warm start tuning allows you to leverage knowledge from previous hyperparameter tuning jobs
      when starting new tuning jobs. This is ideal when tuning similar models or the same model with
      slightly different data, as it enables the new tuning job to "start warm" rather than from
      scratch.

      How warm start works:
      1. You specify up to 5 parent tuning jobs when creating a new tuning job
      2. SageMaker uses results from parent jobs to inform Bayesian optimization in the new job
      3. The new job avoids re-exploring hyperparameter regions known to be suboptimal
      4. Convergence to optimal hyperparameters is faster (fewer total training jobs needed)

      For the described scenario (daily tuning of similar models), each day's tuning job can use
      previous days' results as parent jobs, progressively building knowledge about optimal
      hyperparameter regions for this class of models.

      Option A (early stopping) saves compute on individual jobs but doesn't transfer knowledge between
      tuning jobs. Option C (Hyperband) is faster but still explores from scratch each time. Option D
      (more parallel jobs) doesn't reduce redundant exploration, just speeds up random exploration.

      Warm start configurations:
      - IDENTICAL_DATA_AND_ALGORITHM: Same model and data, refining previous tuning
      - TRANSFER_LEARNING: Similar models or datasets, transferring hyperparameter knowledge
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning-warm-start.html
    services:
      - SageMaker Automatic Model Tuning
    concepts:
      - Warm start tuning
      - Hyperparameter optimization
      - Transfer learning

  - id: mt-017
    type: single
    text: |
      A machine learning engineer is training a custom scikit-learn model using SageMaker. The training
      data is stored in S3 as multiple CSV files totaling 50 GB. The training script needs to read
      all data into memory for preprocessing before training begins. The current training job uses
      an ml.m5.2xlarge instance (32 GB RAM) and fails with an out-of-memory error.

      What is the MOST cost-effective solution?
    options:
      - id: A
        text: Upgrade to ml.m5.4xlarge (64 GB RAM) to accommodate the full dataset in memory
      - id: B
        text: Switch to an ml.r5.2xlarge memory-optimized instance with 64 GB RAM
      - id: C
        text: Modify the training script to use incremental learning with partial_fit to process data in batches
      - id: D
        text: Enable SageMaker data parallel training to distribute data across multiple instances
    correctAnswer: B
    explanation: |
      Memory-optimized instances (ml.r5 family) provide the most cost-effective solution for memory-
      constrained workloads. The ml.r5.2xlarge offers 64 GB RAM (double the ml.m5.2xlarge) at a lower
      price than ml.m5.4xlarge for equivalent memory capacity.

      Cost comparison for 64 GB RAM:
      - ml.m5.4xlarge: 16 vCPUs, 64 GB RAM, higher price
      - ml.r5.2xlarge: 8 vCPUs, 64 GB RAM, lower price, optimized for memory-intensive workloads

      For workloads where memory is the constraint (not CPU), r5 instances provide better price-per-GB-
      RAM ratio. The reduced CPU count (8 vs 16 cores) is acceptable for scikit-learn, which often
      doesn't scale perfectly to 16+ cores anyway.

      Option A (ml.m5.4xlarge) would work but costs more for the same memory capacity. Option C
      (incremental learning) requires significant code changes and may not be appropriate for all
      scikit-learn algorithms (many don't support partial_fit). Option D (data parallel) is for deep
      learning frameworks, not scikit-learn, and adds unnecessary complexity.

      General guidance: When memory is the constraint, choose memory-optimized instances (r5, r6i)
      over general-purpose instances (m5, m6i) for better cost efficiency.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/notebooks-available-instance-types.html
    services:
      - Amazon SageMaker Training Jobs
    concepts:
      - Instance type selection
      - Memory-optimized instances
      - Cost optimization

  - id: mt-018
    type: multi
    correctCount: 3
    text: |
      A data scientist is implementing L2 regularization for a neural network training job to address
      overfitting. The model is implemented in PyTorch and will be trained using SageMaker automatic
      model tuning.

      Which THREE practices should be followed for effective L2 regularization tuning? (Select THREE)
    options:
      - id: A
        text: Define the L2 regularization strength (weight_decay) as a hyperparameter with logarithmic scaling
      - id: B
        text: Set the L2 regularization range from 0.00001 to 10 to explore multiple orders of magnitude
      - id: C
        text: Apply weight decay to all parameters including batch normalization layers
      - id: D
        text: Monitor both training loss and validation loss to verify regularization reduces overfitting
      - id: E
        text: Use a categorical hyperparameter range with values [0.0001, 0.001, 0.01, 0.1]
      - id: F
        text: Disable regularization during the initial epochs and enable it only after epoch 10
    correctAnswer: [A, B, D]
    explanation: |
      Effective L2 regularization tuning requires three key practices:

      Option A (logarithmic scaling): L2 regularization strength spans multiple orders of magnitude
      (like learning rates), making logarithmic scaling essential for balanced exploration. This
      ensures equal sampling across small values (0.00001) and large values (10).

      Option B (wide range): Starting with a wide range (0.00001 to 10) ensures comprehensive
      exploration from essentially no regularization (0.00001) to very strong regularization (10).
      After initial tuning, narrow the range around promising values for fine-tuning.

      Option D (monitor losses): The purpose of regularization is preventing overfitting. Monitor
      both training and validation loss to verify that:
      - Training loss increases slightly (regularization adds penalty)
      - Validation loss decreases (better generalization)
      - Gap between training and validation narrows (reduced overfitting)

      Option C is incorrect - batch normalization layers should typically exclude weight decay as they
      already provide regularization effects. Most frameworks allow excluding specific parameter groups.

      Option E (categorical) is not wrong but less effective than continuous logarithmic ranges,
      which enable discovering optimal values between the specified points.

      Option F is incorrect - regularization should be applied from the beginning of training to guide
      the optimization process. Starting regularization mid-training can disrupt learned patterns.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning-ex-tuning-job.html
    services:
      - SageMaker Automatic Model Tuning
      - Amazon SageMaker Training Jobs
    concepts:
      - L2 regularization
      - Hyperparameter tuning
      - Overfitting prevention
      - Regularization best practices

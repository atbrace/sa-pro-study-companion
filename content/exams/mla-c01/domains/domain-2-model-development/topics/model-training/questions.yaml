  - id: mt-015
    type: multi
    correctCount: 2
    text: |
      A machine learning team is training a transformer-based language model with 6 billion parameters
      using SageMaker. The model fits in the memory of a single ml.p4d.24xlarge instance (8 A100 GPUs,
      40 GB each) but training is taking longer than expected. The team wants to reduce training time.

      Which TWO strategies would effectively reduce training time without requiring code changes to
      the model architecture? (Select TWO)
    options:
      - id: A
        text: Enable SageMaker distributed data parallel training across multiple instances
      - id: B
        text: Use SageMaker Training Compiler to optimize the training computation graph
      - id: C
        text: Switch to model parallelism to distribute the model across instances
      - id: D
        text: Enable mixed precision training using bfloat16 or float16
      - id: E
        text: Reduce the number of training epochs to complete training faster
    correctAnswer: [B, D]
    explanation: |
      Two strategies can reduce training time without model architecture changes:

      Option B (Training Compiler): SageMaker Training Compiler optimizes deep learning models by
      compiling the training computation graph, applying graph-level optimizations (operator fusion,
      memory planning, layout optimization). For transformer models, Training Compiler can provide
      up to 50% training speedup with no code changes required - simply enable compiler_config in
      the estimator.

      Option D (Mixed precision): Using float16 or bfloat16 instead of float32 provides:
      - 2× faster computation on A100 Tensor Cores
      - 40-50% memory savings (enabling larger batch sizes for further speedup)
      - Minimal accuracy impact with proper loss scaling
      Modern frameworks (PyTorch AMP, TensorFlow mixed_precision) make this a simple configuration
      change without modifying model architecture.

      Option A (data parallel) is effective but since the model fits in one instance, the question
      asks for optimization of current setup. Data parallel would require multiple instances and is
      better when scaling beyond single-instance limits.

      Option C (model parallelism) is for models too large to fit in single-instance memory - not
      applicable here since the model already fits.

      Option E (fewer epochs) reduces training quality rather than optimizing training efficiency.

      Best practice: Combine both strategies (Training Compiler + mixed precision) for maximum speedup.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/training-compiler.html

id: modeling-approaches
name: ML Modeling Approaches and Algorithm Selection
shortName: Modeling Approaches
examTask: task-2-1
description: >
  Select appropriate ML algorithms and AWS AI services based on business requirements,
  problem type, and data characteristics. Understand when to use built-in algorithms,
  AutoML, foundation models, or specialized AI services.

estimatedStudyTime: 90
difficulty: intermediate

keyServices:
  - Amazon SageMaker Built-in Algorithms
  - Amazon SageMaker Autopilot
  - Amazon Bedrock
  - Amazon Rekognition
  - Amazon Comprehend
  - Amazon Translate
  - Amazon Transcribe
  - Amazon Forecast
  - Amazon Personalize

keyConcepts:
  - Supervised vs unsupervised learning
  - Algorithm selection criteria
  - XGBoost vs Linear Learner
  - Built-in algorithm use cases
  - AutoML capabilities
  - Foundation model selection
  - AI service vs custom model decision
  - Problem type mapping
  - Data type considerations


id: domain-1-data-preparation
name: Data Preparation for Machine Learning
shortName: Data Preparation
weight: 28
description: >
  Ingest, transform, validate, and prepare data for ML modeling. This includes
  data storage strategies, feature engineering, data quality validation, and
  bias detection using AWS services like SageMaker Data Wrangler and Glue.
color: blue
icon: database

examTasks:
  - id: task-1-1
    name: Ingest and store data
    description: >
      Design data ingestion pipelines and storage solutions for ML workloads
      using services like S3, Kinesis, and various data formats.
  - id: task-1-2
    name: Transform data and perform feature engineering
    description: >
      Apply data transformations, feature engineering techniques, and encoding
      methods using SageMaker Data Wrangler, Glue, and related tools.
  - id: task-1-3
    name: Ensure data integrity and prepare data for modeling
    description: >
      Validate data quality, identify bias, and prepare datasets for model
      training including splitting, shuffling, and augmentation.

topics:
  - data-ingestion-storage
  - data-transformation
  - feature-engineering
  - data-quality-bias

keyServices:
  - Amazon S3
  - Amazon Kinesis
  - AWS Glue
  - AWS Glue DataBrew
  - Amazon SageMaker Data Wrangler
  - Amazon SageMaker Feature Store
  - Amazon SageMaker Clarify
  - Amazon Athena
  - Amazon EMR


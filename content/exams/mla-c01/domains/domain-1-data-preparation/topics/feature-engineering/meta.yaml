id: feature-engineering
name: Feature Engineering Techniques
shortName: Feature Engineering
examTask: task-1-2
description: Master feature engineering techniques including encoding methods, scaling, normalization, time series feature extraction, and automated feature engineering using SageMaker Data Wrangler, Feature Store, and scikit-learn extensions. Learn to transform raw data into meaningful features that improve model performance.
estimatedStudyTime: 90
difficulty: intermediate

keyServices:
  - Amazon SageMaker Data Wrangler
  - Amazon SageMaker Feature Store
  - Amazon SageMaker Processing
  - Amazon SageMaker Autopilot
  - SageMaker scikit-learn extension

keyConcepts:
  - Categorical encoding (one-hot, ordinal, target, similarity)
  - Feature scaling and normalization (standard, robust, min-max)
  - Time series feature engineering (lag features, rolling windows, datetime extraction)
  - Text featurization (TF-IDF, character statistics, vectorization)
  - Dimensionality reduction (PCA, feature selection)
  - Feature Store online and offline stores
  - Automated feature engineering with Autopilot
  - Training-serving skew prevention
  - Feature reusability and sharing


    services:
      - AWS Glue Data Quality
    concepts:
      - Dynamic rules
      - Anomaly detection
      - Data freshness
      - DQDL capabilities

  - id: dqb-013
    type: single
    text: |
      A fintech company trains a credit risk model using historical loan data. The model will predict whether to approve
      new loan applications. The data science team wants to ensure that similarly qualified applicants from different
      demographic groups have similar probabilities of receiving the same decision (approval or denial).

      Which SageMaker Clarify metric specifically tests for this type of fairness?
    options:
      - id: A
        text: Difference in Positive Proportions in Predicted Labels (DPPL)
      - id: B
        text: Counterfactual Fliptest (FT)
      - id: C
        text: Disparate Impact (DI)
      - id: D
        text: Treatment Equality (TE)
    correctAnswer: B
    explanation: |
      Counterfactual Fliptest (FT) is correct because it specifically evaluates whether changing only the protected attribute
      (while keeping all other qualifications the same) causes the model's prediction to change.

      **What Counterfactual Fliptest measures:**
      - Creates synthetic "counterfactual" examples by swapping the sensitive attribute value
      - Keeps all other features identical (income, credit score, employment, etc.)
      - Compares the model's prediction on the original vs. counterfactual example
      - If predictions differ, the model is treating similarly qualified individuals differently based solely on demographics

      **Example scenario:**
      - Original applicant: Age=25, Income=$50k, Credit=720, Employed=Yes → Prediction: Approved
      - Counterfactual: Age=65, Income=$50k, Credit=720, Employed=Yes → Prediction: Denied

      If the only difference is age and the predictions differ, the fliptest detects this disparity. This is exactly what
      the question asks: "similarly qualified applicants from different demographic groups" receiving different decisions.

      **Why this matters:**
      - FT measures individual fairness - similar individuals should be treated similarly
      - This is different from group fairness (equal approval rates across groups)
      - FT detects direct discrimination based on protected attributes
      - It tests counterfactual fairness: what would happen if this person belonged to a different demographic group?

      Why other options are incorrect:

      **Option A (DPPL)** measures group fairness - whether positive predictions occur at similar rates across demographic
      groups. DPPL tells you if 30% of group A and 30% of group B get approvals, but doesn't tell you if similarly qualified
      individuals within those groups are treated equally. Two groups could have equal approval rates (DPPL=0) but still
      treat similar individuals differently.

      **Option C (Disparate Impact)** also measures group fairness as a ratio rather than difference. It compares overall
      positive prediction rates between groups (e.g., group B approved at 80% the rate of group A). Like DPPL, it doesn't
      evaluate individual-level fairness for similarly qualified applicants.

      **Option D (Treatment Equality)** compares the ratio of false positives to false negatives between groups. It measures
      whether error types affect groups proportionally, not whether similar individuals receive similar treatment. TE could
      be equal even if the model systematically discriminates against similar individuals from one group.

      The key distinction: DPPL and DI measure group-level outcomes, while FT measures individual-level fairness for
      similar applicants. The question's phrase "similarly qualified applicants" is the signal to use FT.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-measure-post-training-bias.html
    services:
      - Amazon SageMaker Clarify
    concepts:
      - Counterfactual fairness
      - Individual fairness
      - Post-training bias metrics
      - Fliptest

  - id: dqb-014
    type: single
    text: |
      A data scientist is preparing tabular data for a fraud detection model. The dataset has 50 numeric features and
      100,000 training examples. To prevent overfitting, they want to apply data augmentation. However, the features have
      complex relationships (e.g., total_amount = quantity * unit_price) that must be preserved.

      Which augmentation approach is most appropriate for this scenario?
    options:
      - id: A
        text: Add Gaussian noise to all numeric features independently
      - id: B
        text: Use SMOTE (Synthetic Minority Over-sampling Technique) to create synthetic examples by interpolating between existing examples
      - id: C
        text: Randomly permute feature values across examples to create new combinations
      - id: D
        text: Use a Variational Autoencoder (VAE) to learn feature relationships and generate new examples
    correctAnswer: D
    explanation: |
      Variational Autoencoder (VAE) is correct because it learns the complex relationships between features and generates
      synthetic examples that preserve these relationships.

      **Why VAE is appropriate:**
      - VAEs learn a compressed latent representation that captures feature dependencies
      - The encoder-decoder architecture learns the underlying data distribution, including constraints like
        total_amount = quantity * unit_price
      - Generating from the learned latent space produces new examples that maintain realistic feature relationships
      - VAEs handle high-dimensional tabular data with complex correlations effectively
      - Once trained, you can sample from the latent space to generate as many synthetic examples as needed

      **How VAEs work:**
      1. Encoder network compresses input features to a low-dimensional latent representation
      2. The latent space is constrained to follow a probability distribution (typically Gaussian)
      3. Decoder network reconstructs the original features from the latent representation
      4. Training minimizes reconstruction error while regularizing the latent space
      5. To generate synthetic data, sample from the latent distribution and decode

      **Why VAEs preserve relationships:**
      - If the relationship total_amount = quantity * unit_price exists in training data, the VAE learns this constraint
      - Generated examples will maintain this relationship because the decoder learned to reconstruct consistent values
      - Unlike naive approaches, VAEs don't violate learned constraints

      Why other options are incorrect:

      **Option A (Add Gaussian noise independently)** violates feature relationships:
      - Adding noise to quantity, unit_price, and total_amount independently breaks the constraint
      - Example: Original (quantity=10, unit_price=5, total_amount=50) + noise → (10.1, 5.2, 49.8) = INVALID
      - The augmented example now has quantity * unit_price ≠ total_amount
      - This creates unrealistic training examples that confuse the model
      - For simple independent features this can work, but not with complex relationships

      **Option B (SMOTE - Synthetic Minority Over-sampling Technique)** also violates relationships:
      - SMOTE interpolates between examples: synthetic = example1 + λ * (example2 - example1)
      - If example1 has (q=10, p=5, t=50) and example2 has (q=20, p=4, t=80), interpolating gives (q=15, p=4.5, t=65)
      - But 15 * 4.5 = 67.5 ≠ 65, violating the constraint
      - SMOTE treats features as independent, which is incorrect for related features
      - SMOTE is primarily designed for addressing class imbalance, not general augmentation with constraints

      **Option C (Random permutation)** creates nonsensical combinations:
      - Taking quantity from one example, unit_price from another, and total_amount from a third creates invalid examples
      - Relationships between features are completely destroyed
      - Example: Combining q=10 from fraud case, p=1000 from luxury purchase, t=5 from small transaction = NONSENSE
      - This only works if features are truly independent (rare in real-world tabular data)

      **Additional context:**
      The question mentions "complex relationships" as a key constraint. This is the signal that naive augmentation
      techniques will fail. VAEs and GANs are the primary techniques for augmenting tabular data with feature dependencies.
      VAE is more stable and easier to train than GANs, making it the better choice for this scenario.

      For the MLA-C01 exam, remember:
      - Image augmentation: geometric and color transformations
      - Text augmentation: back-translation, synonym replacement
      - Tabular with constraints: VAE or GAN (VAE is more common/stable)
      - Tabular with class imbalance and simple features: SMOTE

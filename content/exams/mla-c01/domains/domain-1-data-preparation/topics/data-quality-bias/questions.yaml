    services:
      - Amazon SageMaker
    concepts:
      - Data augmentation
      - Variational Autoencoders
      - Tabular data augmentation
      - Feature relationships

  - id: dqb-015
    type: multi
    correctCount: 2
    text: |
      A healthcare ML team is deploying a diagnostic model to production using Amazon SageMaker. They want to monitor both
      data quality and bias continuously. The model predicts disease likelihood based on patient vitals and demographics.
      Protected attributes include age and gender.

      Which monitoring approaches should they implement? (Choose TWO.)
    options:
      - id: A
        text: Enable SageMaker Model Monitor Data Quality monitoring to detect drift in vital sign distributions compared to training data
      - id: B
        text: Configure SageMaker Clarify with Model Monitor to continuously evaluate bias metrics on inference data
      - id: C
        text: Use AWS Glue Data Quality to validate training data quality before deployment and never check again
      - id: D
        text: Set up CloudWatch alarms on inference API latency as the primary quality indicator
      - id: E
        text: Implement custom preprocessing logic within the model endpoint to reject low-quality inputs
    correctAnswer:
      - A
      - B
    explanation: |
      Options A and B together provide comprehensive continuous monitoring of both data quality and fairness in production.

      **Option A (Model Monitor Data Quality monitoring)** is correct because:
      - Detects data drift by comparing inference input distributions to training data baselines
      - Critical for healthcare where patient demographics and vital sign ranges can shift over time
      - Monitors statistical properties: mean, std, min, max, missing value rates, etc.
      - Example: If the age distribution of patients shifts toward elderly (mean age increases from 45 to 65), this could
        degrade model performance if it was trained primarily on middle-aged patients
      - Generates CloudWatch metrics and triggers alarms when drift exceeds thresholds
      - Captures inference inputs automatically from SageMaker endpoints

      **Setup involves:**
      1. Create a baseline by running a SageMaker Processing job on training data
      2. Enable Data Capture on the SageMaker endpoint
      3. Create a monitoring schedule that compares captured data to baseline
      4. Configure CloudWatch alarms for violations

      **Option B (SageMaker Clarify with Model Monitor for bias)** is correct because:
      - Continuously evaluates fairness metrics on production predictions
      - Detects bias drift where a model becomes biased over time even if it was fair during training
      - Monitors post-training bias metrics like DPPL, AD, RD across protected attributes (age, gender)
      - Example: If the model starts predicting disease at higher rates for older patients with similar vital signs as
        younger patients, bias metrics will detect this disparity
      - Integrated with Model Monitor for automated, scheduled bias analysis
      - Generates bias reports and CloudWatch metrics

      **Why both are needed:**
      - Data quality monitoring detects input distribution changes (data drift)
      - Bias monitoring detects fairness issues in model predictions (bias drift)
      - These are complementary: data can drift without causing bias, or bias can emerge without data drift
      - Comprehensive production monitoring requires both dimensions

      Why other options are incorrect or insufficient:

      **Option C (One-time AWS Glue Data Quality check)** is insufficient because:
      - The question asks for continuous monitoring, not one-time validation
      - Validating training data before deployment is good practice, but doesn't detect production issues
      - Data quality can degrade in production due to upstream system changes, data pipeline bugs, or shifting patterns
      - "Never check again" directly contradicts continuous monitoring best practices
      - You should validate training data AND monitor production data continuously

      **Option D (CloudWatch alarms on API latency)** is incorrect because:
      - Latency measures model performance (speed), not data quality or fairness
      - Low latency doesn't indicate good data quality or absence of bias
      - A model can make fast, low-latency predictions on low-quality or biased data
      - While monitoring latency is operationally important, it's not a quality or fairness indicator
      - This confuses operational metrics with data/model quality metrics

      **Option E (Custom preprocessing to reject low-quality inputs)** is incorrect because:
      - This is defensive filtering, not monitoring
      - Rejecting inputs doesn't provide visibility into what quality issues are occurring
      - You lose data on the frequency and types of quality problems
      - Monitoring (options A and B) provides metrics and alerts while allowing inference to continue
      - Rejecting inputs can cause production failures and poor user experience
      - Better to monitor quality issues and retrain/update models than to fail at inference time

      The correct production monitoring strategy combines:
      1. Model Monitor Data Quality for input drift detection
      2. Model Monitor Bias (via Clarify) for fairness monitoring
      3. Model Monitor Model Quality for prediction accuracy monitoring (not asked in this question)

      All three together provide comprehensive production ML monitoring.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor.html
    services:
      - Amazon SageMaker Model Monitor
      - Amazon SageMaker Clarify
    concepts:
      - Continuous monitoring
      - Data quality monitoring
      - Bias monitoring
      - Production ML monitoring

  - id: dqb-016
    type: single
    text: |
      A machine learning team has a dataset with 1,000,000 rows that cannot fit in memory for preprocessing. They need to
      shuffle the data before training to ensure good gradient estimates during model training with mini-batch SGD.

      Which approach allows them to shuffle this large dataset efficiently?
    options:
      - id: A
        text: Load the entire dataset into memory, shuffle using random.shuffle(), then write to disk
      - id: B
        text: Use reservoir sampling to maintain a shuffled sample in memory
      - id: C
        text: Split the data into multiple files, shuffle the file processing order, and use framework data loaders with buffer-based shuffling
      - id: D
        text: Don't shuffle the data since the dataset is already large enough to ensure diverse batches
    correctAnswer: C
    explanation: |
      Option C is correct because it provides a practical, memory-efficient approach to shuffling large datasets that don't
      fit in memory.

      **The multi-level shuffling strategy:**

      1. **File-level shuffling**: Split data into multiple files (e.g., 100 files of 10,000 rows each), then randomize
         the order in which files are processed. This ensures batches don't always come from the same region of data.

      2. **Buffer-based shuffling**: Deep learning frameworks (TensorFlow, PyTorch) provide data loaders with shuffle
         buffers. These load a buffer of examples into memory (e.g., 10,000 rows), shuffle within the buffer, emit examples,
         and refill the buffer. This provides local randomization without loading the entire dataset.

      **Example with TensorFlow:**
      ```python
      dataset = tf.data.Dataset.list_files('data_part_*.csv', shuffle=True)  # Shuffle file order
      dataset = dataset.interleave(lambda x: tf.data.TextLineDataset(x), cycle_length=4)
      dataset = dataset.shuffle(buffer_size=10000)  # Buffer-based shuffle
      dataset = dataset.batch(32)
      ```

      **Example with PyTorch:**
      ```python
      # When creating DataLoader for a large dataset split into chunks
      dataset = LargeDataset(file_pattern='data_part_*.csv')
      dataloader = DataLoader(dataset, batch_size=32, shuffle=True)
      # PyTorch handles memory-efficient shuffling internally
      ```

      **Why this works:**
      - File-level shuffling prevents sequential regions from dominating training
      - Buffer-based shuffling provides local randomization with bounded memory usage
      - Combined, these provide sufficient randomization for good gradient estimates
      - Memory usage is O(buffer_size), not O(dataset_size)

      **SageMaker support:**
      - SageMaker training jobs can shuffle S3 file processing order
      - Built-in algorithms automatically handle shuffling
      - Pipe mode enables streaming data with shuffle buffers

      Why other options are incorrect:

      **Option A (Load entire dataset in memory)** is explicitly stated as impossible in the question:
      - "1,000,000 rows that cannot fit in memory"
      - Attempting to load the entire dataset would cause out-of-memory errors
      - This is the naive approach that doesn't scale to large datasets
      - Even if it technically fit, loading 1M rows just to shuffle is inefficient

      **Option B (Reservoir sampling)** is a technique for maintaining a random sample from a stream, not for shuffling:
      - Reservoir sampling selects K random items from N items in a stream
      - It's used when you want a random subset (sample), not a shuffled complete dataset
      - This would give you a random sample of 1M rows, but not all 1M rows in shuffled order
      - This is the wrong tool for this job - it's for sampling, not shuffling

      **Option D (Don't shuffle)** is incorrect because:
      - Dataset size doesn't eliminate the need for shuffling
      - Even large datasets need shuffling if they have any ordering (by time, by source, by label, etc.)
      - The question specifically states they need shuffling for "good gradient estimates during mini-batch SGD"
      - If data is ordered by label or has any systematic ordering, batches will be biased without shuffling
      - Example: If the dataset is ordered with all class A examples first, then all class B, early batches will be
        all class A, causing poor gradient estimates
      - Shuffling is about randomizing batch composition, not dataset size

      **Key exam takeaway:**
      For large datasets that don't fit in memory, use a combination of:
      1. File-level shuffling (randomize file processing order)
      2. Buffer-based shuffling (frameworks provide this via shuffle buffers)
      3. SageMaker Pipe mode for streaming with shuffle buffers

      Never assume you can load the entire dataset in memory - design for scale.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html
    services:
      - Amazon SageMaker Processing
      - Amazon SageMaker Training
    concepts:
      - Data shuffling
      - Large-scale data processing
      - Buffer-based shuffling
      - Memory-efficient preprocessing

  - id: dqb-017
    type: single
    text: |
      A financial institution is evaluating their loan approval model for fairness. The model has been trained and deployed.
      They discover that among applicants who truly should be approved (ground truth label = approved), the model correctly
      approves 85% of applicants from demographic group A but only 70% of applicants from demographic group B.

      Which bias metric quantifies this disparity in the model's ability to identify qualified applicants?
    options:
      - id: A
        text: Difference in Positive Proportions in Predicted Labels (DPPL)
      - id: B
        text: Accuracy Difference (AD)
      - id: C
        text: Recall Difference (RD)
      - id: D
        text: Difference in Conditional Acceptance (DCAcc)
    correctAnswer: C
    explanation: |
      Recall Difference (RD) is correct because it measures the difference in true positive rates (recall/sensitivity)
      between facets - exactly what the question describes.

      **Understanding Recall:**
      - Recall = True Positives / (True Positives + False Negatives)
      - Measures the proportion of actual positive cases that the model correctly identifies
      - Also called sensitivity or true positive rate (TPR)

      **In this scenario:**
      - Group A recall: 85% of truly qualified applicants are approved
      - Group B recall: 70% of truly qualified applicants are approved
      - RD = 0.85 - 0.70 = 0.15 (or 15%)

      This 15% recall difference indicates the model is better at identifying qualified applicants from group A than from
      group B. In other words, the model "misses" 30% of qualified applicants from group B but only 15% from group A.

      **Why this matters:**
      - Equal opportunity fairness requires similar recall across groups
      - If qualified individuals should be approved regardless of demographics, the model should identify them at equal rates
      - Lower recall for group B means qualified applicants from that group face higher false negative rates
      - This is a form of discrimination where qualified individuals are unfairly denied based on group membership

      **The question's key phrases:**
      - "among applicants who truly should be approved" → focusing on true positives
      - "correctly approves" → measures true positive rate
      - This is the definition of recall: correctly identifying true positives

      Why other options are incorrect:

      **Option A (DPPL)** measures overall positive prediction rates, not performance on truly qualified applicants:
      - DPPL = proportion of all group A getting approvals - proportion of all group B getting approvals
      - DPPL includes both correct approvals (true positives) and incorrect approvals (false positives)
      - The question specifically asks about correctly identifying qualified (true positive) applicants
      - DPPL could be equal (both groups get same approval rate) even if recall differs (one group's approvals are less
        accurate)

      **Option B (AD - Accuracy Difference)** measures overall prediction correctness, not specific to identifying positives:
      - Accuracy = (TP + TN) / (TP + TN + FP + FN)
      - Includes both positive and negative predictions
      - The question focuses specifically on the model's performance on qualified applicants (positives only)
      - A model could have equal accuracy but different recall if it makes different types of errors for each group

      **Option D (DCAcc - Difference in Conditional Acceptance)** is related but measures something different:
      - DCAcc compares whether qualified applicants are approved at similar rates (similar to recall)
      - However, DCAcc specifically looks at the conditional probability and is calculated differently
      - RD is the standard, direct measure of true positive rate differences
      - When the question describes true positive rates explicitly (85% vs 70%), RD is the most direct answer

      **Key exam insight:**
      Questions about "correctly identifying" positive cases or "missing" qualified applicants are asking about recall.
      Different bias metrics capture different notions of fairness:
      - DPPL → Equal selection rates (demographic parity)
      - RD → Equal ability to identify qualified applicants (equal opportunity)
      - AD → Equal overall accuracy
      - Specificity Difference → Equal ability to identify unqualified applicants

      The specific scenario description tells you which metric to use.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-measure-post-training-bias.html
    services:
      - Amazon SageMaker Clarify
    concepts:
      - Recall Difference
      - Equal opportunity
      - Post-training bias metrics
      - True positive rate

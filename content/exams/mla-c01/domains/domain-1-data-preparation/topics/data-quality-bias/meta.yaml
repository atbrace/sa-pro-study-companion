id: data-quality-bias
name: Data Quality and Bias Detection
shortName: Data Quality
examTask: task-1-3
description: >-
  Master data validation, quality assessment, and bias detection techniques for ML model preparation.
  Learn to implement AWS Glue Data Quality rules, SageMaker Clarify bias metrics, and best practices
  for data splitting, shuffling, and augmentation to ensure high-quality, fair training datasets.
estimatedStudyTime: 90
difficulty: intermediate

keyServices:
  - Amazon SageMaker Clarify
  - AWS Glue Data Quality
  - Amazon SageMaker Data Wrangler
  - Amazon SageMaker Processing
  - AWS Glue DataBrew

keyConcepts:
  - Pre-training and post-training bias metrics
  - Data Quality Definition Language (DQDL)
  - Train/test/validation split strategies
  - Data augmentation techniques
  - Statistical validation and anomaly detection
  - Referential integrity and schema validation
  - Class imbalance and demographic disparity
  - Data leakage prevention


  - id: dis-012
    type: multi
    correctCount: 2
    text: |
      An ML team is training a natural language processing model using the SageMaker BlazingText built-in algorithm.
      The training dataset consists of 100 GB of text files in S3. The team wants to optimize training performance and minimize costs.

      Which TWO configurations will provide the BEST performance? (Select TWO)
    options:
      - id: A
        text: Convert text files to RecordIO-Protobuf format before training
      - id: B
        text: Use Pipe Mode with augmented manifest format pointing to text files
      - id: C
        text: Use File Mode with text files in their original format
      - id: D
        text: Enable Pipe Mode and provide text files directly in S3 without format conversion
      - id: E
        text: Compress text files into a single TAR.GZ archive and use File Mode
    correctAnswer:
      - C
      - D
    explanation: |
      Options C and D are both correct because BlazingText natively supports text files in both File Mode and Pipe Mode without requiring format conversion, and both approaches work well for this algorithm.

      **Option C - File Mode with text files**:

      File Mode is a valid choice for 100 GB datasets:
      - BlazingText accepts plain text files (one sentence per line for supervised mode, or one document per line for Word2Vec)
      - Download time: ~5-10 minutes for 100 GB with good network bandwidth
      - For 100 GB dataset, download overhead is acceptable (not excessive like 500+ GB datasets)
      - Algorithm can read text files directly from EBS volume
      - No preprocessing or conversion required
      - Best for iterative development: Downloaded once, multiple epochs read from local disk

      **Option D - Pipe Mode with text files**:

      Pipe Mode is also fully supported by BlazingText:
      - BlazingText is one of SageMaker built-in algorithms optimized for Pipe Mode streaming
      - Accepts text files directly - no RecordIO conversion needed
      - Streams from S3 during training, reducing startup time to seconds
      - Lower EBS volume requirements (5-10 GB vs 100+ GB)
      - Best for: Large datasets, cost optimization (lower storage costs), faster training start

      **Both options are correct** because:
      - BlazingText supports both modes equally well with text files
      - 100 GB is the transition point where either mode is reasonable:
        - File Mode: Acceptable download time, good for multiple epochs/experiments
        - Pipe Mode: Faster start, lower costs, streaming benefits
      - Algorithm reads text natively in both modes

      The question asks for configurations providing "BEST performance," and both C and D achieve excellent performance for different optimization goals:
      - C: Optimizes for repeated local reads (multi-epoch training, experimentation)
      - D: Optimizes for startup time and storage costs

      Why other options are incorrect:

      A: Converting text files to RecordIO-Protobuf is unnecessary and counterproductive:
      - BlazingText natively reads text files (one sentence/document per line)
      - RecordIO-Protobuf is designed for numerical/tabular data, not text
      - Conversion adds complexity, preprocessing time, and storage for duplicate data
      - No performance benefit - BlazingText is optimized for text input
      - RecordIO is beneficial for algorithms like Linear Learner, XGBoost (numerical features), not text algorithms

      B: Augmented manifest format is designed for image/video data with labels, not text:
      - Augmented manifest (.manifest JSON Lines file) contains S3 paths to media files and annotations
      - Primary use case: SageMaker Ground Truth labeling jobs for Computer Vision
      - Supported by: Image Classification, Object Detection, Semantic Segmentation algorithms
      - BlazingText for text classification expects text files directly, not manifest pointers to text files
      - Adding unnecessary indirection layer provides no benefit

      E: Compressing into single TAR.GZ archive is an anti-pattern:
      - Single archive creates extraction bottleneck: Must download full 100 GB, then extract (adds 5-10 minutes)
      - Requires additional EBS space during extraction (200 GB: 100 GB archive + 100 GB extracted)
      - No parallelization: Cannot read from archive during extraction
      - Single point of failure: Corrupted archive = entire dataset inaccessible
      - SageMaker File Mode can download multiple S3 objects in parallel, but TAR.GZ is single object
      - BlazingText expects directory of text files, requiring custom extraction logic

      **Best practice**: For BlazingText and text-based algorithms:
      - Development/experimentation: File Mode with text files (Option C)
      - Production training: Pipe Mode with text files (Option D)
      - Never: RecordIO conversion, augmented manifest, or TAR archives

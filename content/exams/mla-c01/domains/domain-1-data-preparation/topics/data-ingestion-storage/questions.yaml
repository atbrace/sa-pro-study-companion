    services:
      - Amazon SageMaker
      - Amazon S3
    concepts:
      - BlazingText algorithm
      - File Mode vs Pipe Mode
      - Text data formats

  - id: dis-013
    type: single
    text: |
      A financial institution is implementing a real-time fraud detection system that processes credit card transactions.
      The system must make predictions within 100 milliseconds of transaction occurrence. ML engineers plan to use features like:
      - Customer's transaction count in last 5 minutes (real-time)
      - Customer's average transaction amount over last 30 days (batch, updated daily)
      - Customer's account age and credit limit (static, updated monthly)

      How should the team design feature storage to meet the 100ms latency requirement?
    options:
      - id: A
        text: Store all features in Amazon DynamoDB with separate tables for real-time, daily, and monthly features
      - id: B
        text: Store all features in SageMaker Feature Store Online Store, ingesting real-time features via Kinesis/Lambda and batch features via EMR/Glue
      - id: C
        text: Store real-time features in ElastiCache Redis and batch features in Amazon RDS, requiring inference code to query both
      - id: D
        text: Store all features in S3 Parquet files and query using Athena during each inference request
    correctAnswer: B
    explanation: |
      Option B is correct because SageMaker Feature Store Online Store is specifically architected for low-latency feature serving with unified access to features from multiple ingestion sources.

      **Why Feature Store Online Store is optimal**:

      1. **Sub-10ms latency**:
         - Backed by Amazon DynamoDB with provisioned throughput
         - GetRecord API returns all features for a customer in single call
         - Consistent single-digit millisecond response times at scale
         - Well within 100ms total inference latency budget (typical: 5-8ms for feature retrieval)

      2. **Unified feature access**:
         - All three feature types (real-time, daily, monthly) stored in same feature group
         - Single GetRecord call retrieves complete feature vector
         - Inference code does not need to query multiple systems
         - Eliminates complexity of joining features from disparate sources

      3. **Flexible ingestion patterns**:
         **Real-time features**:
         ```
         Transaction Stream → Kinesis Data Streams → Lambda → Feature Store PutRecord
         ```
         Lambda maintains running counts per customer in memory/DynamoDB, computes 5-minute window aggregation, writes to Feature Store

         **Daily batch features**:
         ```
         S3 Transaction History → EMR Spark → Compute 30-day averages → Feature Store Spark Connector → Online Store
         ```
         Nightly EMR job processes previous 30 days, updates Online Store with fresh aggregations

         **Monthly static features**:
         ```
         Account Database → AWS Glue → Feature Store → Online Store
         ```
         Monthly Glue job syncs account data from source system

      4. **Feature consistency**:
         - Same feature definitions used in training (Offline Store) and inference (Online Store)
         - Eliminates training-serving skew
         - Feature lineage tracking ensures reproducibility

      5. **Operational simplicity**:
         - Managed service: No infrastructure provisioning for feature serving
         - Automatic scaling: Handles variable transaction volumes
         - Integrated monitoring: CloudWatch metrics for latency and throughput

      **Latency breakdown for 100ms budget**:
      - API Gateway/Load Balancer: 5-10ms
      - Feature Store GetRecord: 5-8ms
      - SageMaker endpoint inference: 20-40ms
      - Response formatting and network: 10-20ms
      - **Total: 40-78ms** (comfortably within 100ms SLA)

      Why other options are incorrect:

      A: DynamoDB with separate tables adds complexity and latency:
      - Requires 3 separate GetItem API calls (one per feature table)
      - Each call: 5-10ms = 15-30ms total just for feature retrieval
      - Inference code must implement joining logic across tables
      - Schema management across 3 tables (vs unified schema in Feature Store)
      - No feature catalog or lineage tracking
      - No integration with SageMaker training (must export to S3 manually)
      - Training-serving skew risk: Training uses S3 data, inference uses DynamoDB

      While technically feasible and meeting latency requirement, this is "build it yourself" approach that Feature Store is designed to replace. Not wrong, but not optimal.

      C: ElastiCache Redis + RDS combination has multiple problems:
      - **Redis latency**: Sub-millisecond for cache hits, but...
      - **RDS latency**: 5-20ms for database queries (depends on query complexity, indexing, connection pooling)
      - Requires 2 separate queries: Redis for real-time, RDS for batch/static
      - RDS query must be optimized: Indexed customer_id lookups, connection pooling configured
      - Risk of cache misses: If real-time feature not in Redis (cold start, TTL expiration), must recompute or fetch from source
      - Operational overhead: Manage Redis cluster (sizing, eviction policies), RDS instance sizing, query optimization
      - No feature versioning or lineage

      While Redis+RDS can meet latency requirements with careful tuning, it adds significant operational complexity compared to managed Feature Store.

      D: S3 + Athena is fundamentally unsuitable for real-time inference:
      - **Athena latency**: 2-5 seconds minimum per query (query queueing, metadata lookup, S3 scan, result return)
      - Athena is designed for interactive analytics, not low-latency serving
      - Cost: $5 per TB scanned - 100ms requirement = ~10 requests/sec = $millions in Athena costs for production fraud detection
      - Concurrency limits: 20 concurrent queries default (insufficient for high-throughput inference)
      - 20-50x over latency budget - completely unsuitable

      This option demonstrates misunderstanding of Athena's purpose (analytics) vs inference serving requirements.

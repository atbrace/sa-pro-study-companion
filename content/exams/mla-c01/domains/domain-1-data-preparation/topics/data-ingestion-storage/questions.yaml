    services:
      - Amazon S3
    concepts:
      - S3 storage classes
      - Cost optimization
      - Experimentation vs production workloads

  - id: dis-010
    type: single
    text: |
      A retail company streams clickstream events from their website to Amazon Kinesis Data Streams for real-time analytics.
      The stream has 20 shards and receives 18 MB per second of data. A new ML application needs to consume this stream to
      compute real-time product recommendation features, but the existing analytics application already consumes the stream
      at full 2 MB/sec per shard read capacity (40 MB/sec total).

      What is the MOST cost-effective way to enable the new ML application to consume the stream without impacting the existing consumer?
    options:
      - id: A
        text: Increase the number of shards from 20 to 40 to double the read capacity for both consumers
      - id: B
        text: Enable Enhanced Fan-Out for the new ML application consumer
      - id: C
        text: Create a second Kinesis Data Stream with 20 shards and use Kinesis Data Firehose to replicate data from the first stream
      - id: D
        text: Configure the new ML application to poll the stream more frequently (1000 ms instead of 5000 ms) to share read capacity
    correctAnswer: B
    explanation: |
      Option B is correct because Enhanced Fan-Out provides dedicated read throughput per consumer without modifying the stream or impacting existing consumers, and is the most cost-effective solution for this scenario.

      **Enhanced Fan-Out explanation**:

      Standard Kinesis consumers share the 2 MB/sec read capacity per shard across all consumers:
      - Original architecture: 20 shards × 2 MB/sec = 40 MB/sec total read capacity
      - 1 existing consumer using full 40 MB/sec
      - Adding 2nd consumer creates contention: Each gets ~20 MB/sec (50% of needed throughput)

      Enhanced Fan-Out provides:
      - **Dedicated 2 MB/sec per shard per consumer**: No sharing of read capacity
      - **Push model**: Kinesis pushes records to consumer via HTTP/2 (lower latency than polling)
      - **Parallel consumers**: Up to 20 Enhanced Fan-Out consumers per stream
      - **No stream modification**: Existing standard consumer continues working unchanged

      With Enhanced Fan-Out for ML application:
      - Existing analytics consumer: 40 MB/sec (unchanged, uses standard shared read capacity)
      - New ML consumer: 40 MB/sec (dedicated Enhanced Fan-Out throughput)
      - Total read capacity: 80 MB/sec (both applications fully satisfied)

      **Cost analysis**:

      Enhanced Fan-Out pricing (US East):
      - $0.015 per shard-hour per consumer
      - $0.013 per GB data retrieved

      For new ML application:
      - Shard-hour cost: 20 shards × $0.015 × 730 hours/month = $219/month
      - Data retrieval: 18 MB/sec × 2.6 million sec/month = 46.8 TB/month × $0.013 = $608/month
      - **Total Enhanced Fan-Out: $827/month**

      **Why this is cost-effective**:

      Option B adds $827/month with zero impact to existing consumer and no operational changes. Compare to alternatives:

      Why other options are incorrect:

      A: Increasing shards from 20 to 40 doubles costs and is operationally disruptive:
      - Shard cost: 40 shards × $0.015 × 730 hours = $438/month (vs $219 for current 20 shards)
      - Additional cost: $219/month for unused capacity (only 18 MB/sec ingested, 40 shards support 40 MB/sec)
      - Resharding operation: Requires UpdateShardCount API call, splits/merges shards (minutes of downtime risk)
      - Application changes: Existing consumer must adjust to new shard distribution (shard iterator invalidation)
      - Ongoing waste: Stream is under-provisioned for writes (18 MB/sec vs 40 MB/sec capacity)

      More expensive than Enhanced Fan-Out ($438 vs $219) with operational complexity and no actual benefit.

      C: Creating a second stream is the most expensive and complex option:
      - Second stream cost: 20 shards × $0.015 × 730 hours = $219/month
      - Data PUT charges for replication: 18 MB/sec ingested twice = double PUT costs
      - Firehose cost: Cannot replicate between Kinesis Streams (Firehose writes to S3/Redshift/OpenSearch, not Kinesis)
      - Correct implementation requires Lambda or Flink to read stream 1 and write to stream 2 (additional compute costs)
      - Lambda cost: ~$150/month for continuous processing at this volume
      - **Total: $600+ per month** with significant operational complexity
      - Data duplication: Now maintaining two identical streams

      Far more expensive than Enhanced Fan-Out and operationally complex.

      D: Increasing polling frequency does not increase total read capacity:
      - Kinesis limit: 5 GetRecords API calls per second per shard (shared across all consumers)
      - 2 MB/sec per shard read limit is absolute, regardless of polling frequency
      - More frequent polling by both consumers increases GetRecords calls (higher API request costs)
      - Likely to hit GetRecords throttling: 2 consumers × 5 calls/sec = 10 calls/sec > 5 call/sec limit
      - ProvisionedThroughputExceededException errors and backoff logic (degraded performance)
      - Does not solve the fundamental problem: Total read capacity remains 40 MB/sec shared

      This option makes the problem worse, not better, by introducing throttling.
    awsDocLink: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html
    services:
      - Amazon Kinesis Data Streams
    concepts:
      - Enhanced Fan-Out
      - Kinesis consumer patterns
      - Read capacity sharing

  - id: dis-011
    type: single
    text: |
      A genomics research organization processes DNA sequencing data files that are 50-150 GB each. After initial processing and
      feature extraction, the raw sequencing files are rarely accessed but must be retained for 10 years for regulatory compliance.
      When files are needed (approximately 1% are accessed per year), researchers require access within 12 hours.

      Which S3 storage class provides the MOST cost-effective solution for these requirements?
    options:
      - id: A
        text: S3 Standard with lifecycle policy to delete after 10 years
      - id: B
        text: S3 Intelligent-Tiering with Archive access tiers enabled
      - id: C
        text: S3 Glacier Flexible Retrieval (formerly Glacier)
      - id: D
        text: S3 Glacier Deep Archive
    correctAnswer: C
    explanation: |
      Option C (S3 Glacier Flexible Retrieval) is correct because it balances low storage cost with the 12-hour retrieval requirement at the best price point.

      **S3 Glacier Flexible Retrieval characteristics**:

      Storage cost:
      - $0.0036 per GB-month (US East)
      - For 100 GB file: $0.36 per month, $43.20 over 10 years

      Retrieval options:
      - **Expedited**: 1-5 minutes, $0.03 per GB + $0.01 per request
      - **Standard**: 3-5 hours, $0.01 per GB + $0.05 per 1,000 requests (meets 12-hour requirement)
      - **Bulk**: 5-12 hours, $0.0025 per GB + $0.025 per 1,000 requests (cheapest, still meets requirement)

      **Cost calculation for 10-year retention with 1% annual access**:

      Assume 1,000 files × 100 GB average = 100 TB total dataset:

      Storage cost (10 years):
      - 100,000 GB × $0.0036 × 120 months = $43,200

      Retrieval cost (1% annually = 10% over 10 years = 100 files):
      - 100 files × 100 GB × $0.0025 (bulk retrieval) = $250
      - Requests: 100 × $0.025 / 1000 = $0.0025 (negligible)

      **Total 10-year cost: $43,450**

      **Why this is optimal**:
      - Meets 12-hour retrieval SLA with bulk retrieval (5-12 hours)
      - 84% cheaper storage than S3 Standard ($0.0036 vs $0.023 per GB-month)
      - Retrieval cost reasonable for 1% annual access rate
      - No minimum object size charges (vs Glacier Instant Retrieval 128 KB minimum)

      Why other options are incorrect:

      A: S3 Standard is dramatically more expensive for long-term archival:
      - Storage: 100,000 GB × $0.023 × 120 months = $276,000
      - **$232,550 more expensive** than Glacier Flexible Retrieval over 10 years
      - No retrieval charges (benefit)
      - Instant access (benefit)
      - But for data accessed 1% per year, instant access does not justify 6.4x higher cost
      - Lifecycle policy to delete is good, but wrong storage class for 10-year retention

      B: S3 Intelligent-Tiering with Archive tiers has unnecessary overhead:
      - Monitoring fee: $0.0025 per 1,000 objects = $2.50/month for 1 million objects
      - Frequent Access tier (first 30 days): $0.023 per GB-month
      - Archive Access tier (after 90 days): $0.0036 per GB-month (same as Glacier Flexible)
      - Archive Instant Access tier (after 90 days, if configured): $0.004 per GB-month

      Cost analysis:
      - First 30 days in Frequent Access: Pays full S3 Standard cost ($0.023 per GB-month)
      - Days 30-90 in Infrequent Access: $0.0125 per GB-month
      - After 90 days in Archive Access: $0.0036 per GB-month (same as Glacier Flexible)
      - Monitoring overhead: $2.50/month = $300 over 10 years

      For data that will never be accessed after initial upload (rare 1% access), paying Standard rates for 30 days and monitoring fees for 10 years is wasteful. Intelligent-Tiering is designed for *unpredictable* access patterns, but this scenario is highly predictable (immediate archive, rare retrieval).

      **Total: ~$44,000** (slightly more than Glacier Flexible due to first 90 days and monitoring fees)

      C: S3 Glacier Deep Archive is cheaper for storage but has 12-48 hour retrieval time:
      - Storage: $0.00099 per GB-month (72% cheaper than Glacier Flexible)
      - Retrieval: Standard (12 hours), $0.02 per GB + $0.10 per 1,000 requests
      - Bulk (48 hours): $0.0025 per GB

      **Critical issue**: 12-hour retrieval requirement is at the *minimum* of Glacier Deep Archive Standard retrieval (12-48 hours typical). This is a borderline case:
      - If researchers need files urgently (within 12 hours guarantee), Deep Archive is risky (could take up to 48 hours)
      - Standard retrieval also costs 2x more per GB ($0.02 vs $0.01) than Glacier Flexible

      Cost for 100 TB over 10 years:
      - Storage: 100,000 GB × $0.00099 × 120 months = $11,880
      - Retrieval (10% over 10 years): 10,000 GB × $0.02 = $200
      - **Total: $12,080** (cheapest option if retrieval SLA can be relaxed)

      However, "researchers require access within 12 hours" suggests this is a firm requirement, not a flexible guideline. Glacier Deep Archive's 12-48 hour window makes it unsuitable. If the requirement stated "within 24-48 hours," Deep Archive would be the better choice.

      **Key decision**: Glacier Flexible Retrieval (Option C) is the safest choice meeting the stated 12-hour requirement with cost-effective storage. If the scenario explicitly stated "up to 48 hours acceptable," Deep Archive would be optimal.
    awsDocLink: https://aws.amazon.com/s3/storage-classes/glacier/
    services:
      - Amazon S3
      - S3 Glacier
    concepts:
      - S3 storage classes
      - Long-term archival

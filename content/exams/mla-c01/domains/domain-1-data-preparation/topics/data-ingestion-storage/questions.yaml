    services:
      - Amazon SageMaker Feature Store
      - Amazon Kinesis Data Streams
      - AWS Lambda
      - Amazon EMR
    concepts:
      - Low-latency feature serving
      - Real-time vs batch features
      - Feature Store Online Store

  - id: dis-014
    type: single
    text: |
      An IoT analytics company collects sensor data from 100,000 devices, each sending 1 KB of telemetry every 10 seconds.
      The data must be ingested in real-time, stored in S3 for historical analysis, and made available for batch ML model training.
      The team wants to minimize operational complexity.

      Which architecture BEST meets these requirements?
    options:
      - id: A
        text: Devices → Amazon Kinesis Data Streams → AWS Lambda → Amazon S3 → AWS Glue Crawler → Training
      - id: B
        text: Devices → Amazon Kinesis Data Streams → Amazon Kinesis Data Firehose → Amazon S3 → AWS Glue Crawler → Training
      - id: C
        text: Devices → Amazon SQS → AWS Lambda → Amazon S3 → Manual schema definition → Training
      - id: D
        text: Devices → Amazon API Gateway → AWS Lambda → Amazon DynamoDB → DynamoDB Streams → S3 Export → Training
    correctAnswer: B
    explanation: |
      Option B is correct because it uses managed services end-to-end with minimal custom code, automatically handles streaming ingestion and S3 delivery, and requires the least operational overhead.

      **Architecture analysis**:

      **Ingestion throughput calculation**:
      - Devices: 100,000
      - Frequency: Every 10 seconds = 0.1 messages/sec per device
      - Total throughput: 100,000 devices × 0.1 msg/sec = 10,000 messages/sec
      - Data volume: 10,000 msg/sec × 1 KB = 10 MB/sec

      **Kinesis Data Streams (first component)**:
      - Handles 10,000 msg/sec, 10 MB/sec easily
      - Required shards: max(10 MB/sec ÷ 1, 10,000 msg/sec ÷ 1,000) = 10 shards
      - Provides real-time ingestion buffer
      - Retains data 24 hours - 365 days for replay if downstream issues occur
      - Enables multiple consumers if needed later (real-time analytics, alerting)

      **Kinesis Data Firehose (delivery to S3)**:
      - Managed service: Automatically reads from Data Streams, delivers to S3
      - No Lambda code required: Direct integration eliminates custom consumer logic
      - Buffering: Accumulates data (e.g., 5 minutes or 128 MB) before writing to S3
      - Reduces S3 PUT requests: Batches small messages into larger S3 objects (cost optimization)
      - Built-in transformations: Optional Lambda for data enrichment/filtering (if needed)
      - Format conversion: Can convert JSON to Parquet before S3 write (query optimization)
      - Compression: Built-in GZIP/Snappy compression (storage cost reduction)
      - Partitioning: Dynamic S3 key prefixes based on timestamp (e.g., year=2026/month=01/day=11/hour=14/)

      **S3 (storage layer)**:
      - Data automatically delivered by Firehose with optimal batching
      - Organized with Hive-style partitions for efficient querying
      - Serves as data lake for historical analysis and training

      **Glue Crawler (metadata)**:
      - Scheduled to run hourly/daily after Firehose delivers new data
      - Automatically detects partitions from S3 key structure
      - Creates/updates Data Catalog tables for Athena/EMR queries
      - No manual schema management

      **Training**:
      - SageMaker reads directly from S3 using Data Catalog metadata
      - Athena/EMR can perform feature engineering queries
      - Parquet format (if Firehose conversion enabled) optimizes training data loads

      **Operational simplicity**:
      - Zero custom consumer code (Firehose handles everything)
      - Automatic scaling for both Kinesis services
      - Automatic partitioning and batching
      - Managed schema discovery
      - Minimal monitoring required

      Why other options are incorrect:

      A: Lambda between Kinesis Data Streams and S3 adds unnecessary complexity:
      - Requires custom Lambda code to consume Kinesis records and write to S3
      - Must implement: Kinesis shard iteration, batch aggregation logic, S3 key partitioning, error handling, retry logic
      - Lambda concurrency management: Need to tune reserved concurrency to match Kinesis shards
      - Potential for data loss if Lambda fails and records exceed Kinesis retention
      - S3 write pattern: Lambda writes small objects frequently (higher PUT costs, poor query performance)
      - Operational overhead: Monitor Lambda errors, timeouts, throttling; tune memory and timeout settings

      Kinesis Data Firehose eliminates all this complexity with a managed service that does exactly this job. Option A essentially asks you to manually implement what Firehose provides out-of-box.

      C: SQS introduces bottlenecks and operational issues:
      - SQS is not designed for high-throughput streaming: While it can handle 10,000 msg/sec, it's not optimal for continuous data streams
      - Requires custom Lambda code for S3 writes (same complexity as Option A)
      - Message retention: Max 14 days (vs Kinesis 365 days) - less replay capability
      - No native partitioning: Lambda must implement S3 key partitioning logic
      - No built-in batching: Lambda must accumulate messages to avoid small S3 objects
      - Manual schema definition: No automatic Glue Crawler integration pattern
      - Loss of streaming semantics: SQS is message queue, not streaming platform

      SQS is excellent for decoupling and job queues, but wrong tool for streaming telemetry ingestion.

      D: API Gateway + DynamoDB + S3 Export is over-engineered and expensive:
      - API Gateway: $3.50 per million requests = 10,000 msg/sec × 2.6M sec/month = 26 billion requests/month = $91,000/month just for API Gateway
      - DynamoDB: Write capacity for 10,000 writes/sec = ~$4,000/month provisioned (or expensive on-demand)
      - DynamoDB Streams: Requires Lambda to consume and write to S3 (custom code)
      - DynamoDB S3 Export: Point-in-time exports (not continuous streaming), exports full table snapshot
      - Cost explosion: 26M requests/month at API GW + DynamoDB writes + Lambda processing = $100,000+/month
      - Kinesis Data Streams: 10 shards = $360/month (300x cheaper)

      This architecture is designed for low-volume API-driven workloads, not high-throughput streaming telemetry.
    awsDocLink: https://aws.amazon.com/firehose/
    services:
      - Amazon Kinesis Data Streams
      - Amazon Kinesis Data Firehose
      - Amazon S3
      - AWS Glue
    concepts:
      - Streaming ingestion patterns
      - Managed vs custom consumers
      - IoT data pipelines

  - id: dis-015
    type: multi
    correctCount: 2
    text: |
      A machine learning team is designing a data pipeline to prepare training data for a recommendation model. The pipeline must:
      - Join customer data from Amazon RDS (PostgreSQL) with clickstream events from S3
      - Filter out test accounts and bot traffic
      - Aggregate features at the customer level (e.g., total clicks per category)
      - Convert CSV clickstream data to Parquet format
      - Process 500 GB of data daily

      Which TWO AWS services should be used for this ETL workload? (Select TWO)
    options:
      - id: A
        text: AWS Glue ETL jobs with Spark to perform joins, filtering, aggregations, and format conversion
      - id: B
        text: AWS Lambda functions to read CSV files from S3, process row by row, and write Parquet to S3
      - id: C
        text: Amazon Athena CREATE TABLE AS SELECT (CTAS) queries to perform transformations and write Parquet output
      - id: D
        text: AWS Step Functions to orchestrate the multi-step pipeline workflow
      - id: E
        text: Amazon SageMaker Processing Jobs with custom Python scripts for transformations
    correctAnswer:
      - A
      - D
    explanation: |
      Options A and D together provide a complete, scalable, and cost-effective solution for this ETL workload.

      **Option A - AWS Glue ETL with Spark**:

      AWS Glue is purpose-built for this exact scenario (large-scale ETL with joins, aggregations, format conversion):

      **Joining RDS and S3 data**:
      - Glue ETL can read from RDS PostgreSQL using JDBC connection
      - Reads S3 CSV files as Spark DataFrame
      - Performs distributed join across datasets:
      ```python
      customers_df = glueContext.create_dynamic_frame.from_catalog(
          database="rds-catalog", table_name="customers"
      )
      clickstream_df = glueContext.create_dynamic_frame.from_catalog(
          database="s3-catalog", table_name="clickstream"
      )
      joined_df = customers_df.join(clickstream_df, "customer_id")
      ```

      **Filtering**:
      - Use Spark SQL WHERE clauses or filter transformations
      - Distributed filtering across Spark executors (scales to 500 GB easily)

      **Aggregations**:
      - GroupBy transformations for customer-level aggregations:
      ```python
      aggregated = joined_df.groupBy("customer_id", "category").agg(
          count("click_id").alias("total_clicks"),
          avg("dwell_time").alias("avg_dwell_time")
      )
      ```

      **Format conversion**:
      - Native Parquet writing with compression:
      ```python
      glueContext.write_dynamic_frame.from_options(
          frame=aggregated,
          connection_type="s3",
          format="parquet",
          connection_options={"path": "s3://bucket/output/"}
      )
      ```

      **Scalability**:
      - Auto-scaling: Glue can scale from 2 to 100 DPUs based on data volume
      - For 500 GB daily, estimate 10-20 DPUs for 1-2 hour processing window
      - Cost: 10 DPUs × 1 hour × $0.44/DPU-hour = $4.40 per day

      **Option D - AWS Step Functions for orchestration**:

      Step Functions provides workflow orchestration for multi-step pipelines:

      **Workflow definition**:
      ```json
      {
        "StartAt": "CrawlRDS",
        "States": {
          "CrawlRDS": { "Type": "Task", "Resource": "arn:aws:states:::glue:startCrawler", ... },
          "CrawlS3": { "Type": "Task", "Resource": "arn:aws:states:::glue:startCrawler", ... },
          "RunGlueETL": { "Type": "Task", "Resource": "arn:aws:states:::glue:startJobRun", ... },
          "TriggerTraining": { "Type": "Task", "Resource": "arn:aws:states:::sagemaker:createTrainingJob", ... }
        }
      }
      ```

      **Orchestration benefits**:
      - Visual workflow editor: DAG visualization of pipeline steps
      - Error handling: Retry logic, catch blocks for failures
      - Parallel execution: Run independent steps concurrently (e.g., crawl RDS and S3 simultaneously)
      - State management: Pass output from one step as input to next
      - Monitoring: CloudWatch integration, execution history, duration tracking
      - Scheduling: EventBridge integration for daily 2 AM execution
      - Conditional logic: Skip steps based on previous results (e.g., only train if data quality checks pass)

      **Integration with Glue**:
      - Native Glue StartJobRun API integration
      - Wait for job completion before next step
      - Pass Glue job parameters dynamically

      **Alternative orchestration** (both valid):
      - AWS Glue Workflows: Built-in orchestration within Glue console (simpler for Glue-only pipelines)
      - Amazon Managed Workflows for Apache Airflow (MWAA): More complex workflows requiring Python DAGs

      Step Functions is optimal for this scenario because it orchestrates multiple AWS services (Glue, potentially SageMaker for training trigger) with visual workflows and enterprise error handling.

      Why other options are less optimal or incorrect:

      B: AWS Lambda is unsuitable for 500 GB data processing:
      - Lambda limits: 15-minute max execution time, 10 GB memory, 512 MB /tmp storage
      - 500 GB cannot fit in Lambda's constraints
      - Row-by-row processing on 500 GB would require millions of Lambda invocations (high cost, complexity)
      - No distributed joins: Lambda is stateless; joining RDS and S3 requires custom coordination
      - Writing Parquet: Lambda can use PyArrow, but aggregations across 500 GB require distributed processing
      - Cost: Millions of Lambda invocations at $0.20 per 1M requests + GB-second compute = $100+ per day

      Lambda is excellent for < 1 GB transformations, event-driven processing, and real-time use cases. Not for large-scale batch ETL.

      C: Amazon Athena CTAS is a valid option but less flexible than Glue:
      - Can perform SQL transformations and write Parquet
      - Cannot directly join RDS tables: Must export RDS to S3 first (requires separate step)
      - Cost: $5 per TB scanned = 500 GB × $5 / 1000 = $2.50 per day (cheaper than Glue)
      - Less flexible for complex logic: SQL-only (no Python UDFs, limited custom transformations)
      - No built-in scheduling: Requires external orchestrator (Step Functions, Glue Workflows)

      **Athena is a reasonable alternative** for pure S3-to-S3 transformations with SQL logic. However, the RDS join requirement makes Glue more suitable (native JDBC connectivity). If RDS data was already in S3, Athena CTAS would be an excellent choice.

      E: SageMaker Processing Jobs are designed for ML-specific data processing:
      - Can run custom Python scripts with ML libraries (Scikit-learn, Pandas, Spark)
      - Supports distributed processing via Spark container
      - More expensive than Glue: $0.096-$0.192 per hour for ml.m5.4xlarge (Glue: $0.44 per DPU-hour ≈ ml.m5.xlarge equivalent)
      - Best use case: Feature engineering tightly coupled with SageMaker training (same pipeline)
      - Requires more custom code than Glue ETL's high-level APIs

      Valid option but Glue is more cost-effective and purpose-built for ETL. SageMaker Processing is ideal when ETL logic is complex and ML-specific (e.g., using Scikit-learn transformers that will be serialized with model).

      **Summary**: A (Glue ETL) + D (Step Functions) provides the best combination of scalability, cost-effectiveness, and operational simplicity for this 500 GB daily ETL workload with joins, aggregations, and format conversion.
    awsDocLink: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api.html
    services:
      - AWS Glue
      - AWS Step Functions
      - Amazon RDS
      - Amazon S3
    concepts:
      - ETL workflows
      - Pipeline orchestration
      - Large-scale data transformation

  - id: dis-016
    type: single
    text: |
      A data science team wants to analyze the correlation between data freshness and model performance for their recommendation system.
      They need to track when each feature value was last updated and retrieve historical feature values as they existed at specific points in time
      for reproducibility in experiments.

      Which SageMaker Feature Store capability enables this requirement?
    options:
      - id: A
        text: Feature Store maintains an automatic changelog of all feature updates in the Online Store with rollback capability
      - id: B
        text: Feature Store records event_time metadata with each feature update, and Offline Store supports point-in-time queries via Athena
      - id: C
        text: Feature Store versions are created manually using tags, and historical versions are stored in separate feature groups
      - id: D
        text: Feature Store integrates with AWS Backup to create daily snapshots of all feature values for time-travel queries
    correctAnswer: B
    explanation: |
      Option B is correct because SageMaker Feature Store automatically tracks event_time metadata with each record and provides point-in-time query capabilities through the Offline Store.

      **Event Time metadata**:

      Every Feature Store record includes required metadata fields:
      - **Record Identifier**: Unique key for entity (e.g., customer_id, product_id)
      - **Event Time**: Timestamp indicating when the feature values were observed or computed
      - **Ingestion Time** (automatic): Timestamp when Feature Store received the record

      Example record structure:
      ```python
      record = [
          {'FeatureName': 'customer_id', 'ValueAsString': '12345'},
          {'FeatureName': 'event_time', 'ValueAsString': '2026-01-11T14:30:00Z'},
          {'FeatureName': 'total_purchases_30d', 'ValueAsString': '15'},
          {'FeatureName': 'avg_transaction_value', 'ValueAsString': '89.50'}
      ]
      ```

      **Point-in-Time Correctness**:

      The Offline Store (S3-based Apache Iceberg tables) maintains complete history of all feature updates with event_time:

      ```
      customer_id | event_time           | total_purchases_30d | avg_transaction_value
      12345       | 2026-01-01T00:00:00 | 10                  | 75.00
      12345       | 2026-01-05T12:00:00 | 12                  | 82.00
      12345       | 2026-01-11T14:30:00 | 15                  | 89.50
      ```

      **Time-Travel Queries**:

      Using SageMaker SDK or Athena, retrieve feature values as they existed at specific time:

      ```python
      from sagemaker.feature_store.feature_store import FeatureStore

      feature_store = FeatureStore()

      # Get features as they existed on 2026-01-05 at 18:00
      historical_features = feature_store.create_dataset(
          base=feature_group,
          record_identifier_value='12345',
          event_time_range=(
              datetime(2026, 1, 5, 18, 0),  # Features as of this time
              datetime(2026, 1, 5, 18, 0)
          )
      ).as_dataframe()
      ```

      Returns: `total_purchases_30d = 12, avg_transaction_value = 82.00` (values from January 5th)

      **Use cases for data freshness analysis**:

      1. **Feature staleness correlation**:
         - Query: Retrieve feature values at prediction time vs most recent values
         - Calculate staleness: `prediction_time - event_time`
         - Correlate staleness with model accuracy: "Does the model perform worse when features are 24+ hours old?"

      2. **Model reproducibility**:
         - Reproduce training dataset: Query features as they existed on training date
         - Eliminates data leakage: Cannot accidentally use future data in historical analysis
         - Example: "Train model using only features available on 2025-12-01" (for fair backtesting)

      3. **Feature version comparison**:
         - Compare model performance using feature computation logic from different dates
         - Isolate impact of feature engineering changes

      **Offline Store implementation**:
      - Apache Iceberg table format on S3
      - Supports time-travel queries natively
      - Compressed Parquet files for storage efficiency
      - Automatic compaction and optimization

      Why other options are incorrect:

      A: Feature Store Online Store does NOT maintain changelog or rollback capability:
      - Online Store (DynamoDB-backed) only stores latest feature values per record
      - Optimized for low-latency reads, not historical tracking
      - When new record written with same record_identifier, it overwrites previous value
      - No built-in rollback: Cannot revert to previous feature state
      - Changelog concept does not exist in Online Store

      Historical tracking is the responsibility of Offline Store, not Online Store.

      C: Manual versioning with tags is not how Feature Store handles history:
      - Feature Store does not require manual version creation
      - Tags are metadata labels for feature groups (e.g., "team=recommendations"), not version control
      - Historical versions are NOT stored in separate feature groups - single feature group contains all history in Offline Store
      - Automatic versioning happens through event_time timestamps, not manual tagging

      This describes a manual, error-prone approach that Feature Store specifically avoids.

      D: AWS Backup integration is not a Feature Store capability:
      - Feature Store does not integrate with AWS Backup for snapshots
      - Daily snapshots would be insufficient granularity (miss intraday feature updates)
      - Time-travel queries require per-record event_time tracking, not periodic snapshots
      - Snapshot-based approach cannot answer "what were features at 2026-01-05 14:37" (between snapshots)

      Feature Store uses continuous event_time tracking in Iceberg tables, not discrete snapshots.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store-offline-store-data-access.html
    services:
      - Amazon SageMaker Feature Store
      - Amazon Athena
    concepts:
      - Event time tracking
      - Point-in-time correctness
      - Feature versioning
      - Time-travel queries

  - id: dis-017
    type: single
    text: |
      An ML team has deployed a SageMaker training job that consumes data from S3 using Pipe Mode with RecordIO-Protobuf format.
      The training job is running on an ml.p3.8xlarge instance but GPU utilization is only 40% despite the algorithm being GPU-bound.
      Network monitoring shows consistent 10 Gbps throughput from S3. The team suspects data loading is the bottleneck.

      What is the MOST likely cause and solution?
    options:
      - id: A
        text: S3 bandwidth is insufficient; upgrade to ml.p3dn.24xlarge instance type with 100 Gbps network bandwidth
      - id: B
        text: RecordIO-Protobuf deserialization is CPU-bound; increase the number of data loader worker processes in training script
      - id: C
        text: Pipe Mode has latency limits; switch to File Mode to enable faster local disk reads after initial download
      - id: D
        text: S3 Transfer Acceleration should be enabled on the training data bucket to reduce network latency
    correctAnswer: B
    explanation: |
      Option B is correct because the bottleneck is in CPU-bound deserialization and data preprocessing, not network bandwidth, and increasing data loader workers enables parallel data pipeline processing.

      **Diagnosis reasoning**:

      Given symptoms:
      - GPU utilization: 40% (GPUs are starved, waiting for data)
      - Network throughput: 10 Gbps consistent (network is not bottleneck)
      - Using Pipe Mode: Data streaming from S3 is working
      - Format: RecordIO-Protobuf (binary format requiring deserialization)

      **Root cause: CPU-bound data pipeline**

      The training flow is:
      1. Pipe Mode streams RecordIO-Protobuf from S3 → Training instance (10 Gbps ✓ working)
      2. Training script reads from named pipe → Deserializes Protobuf → Decodes to NumPy arrays → Applies preprocessing (normalization, augmentation)
      3. Preprocessed batch sent to GPU for forward/backward pass

      If step 2 (deserialization + preprocessing) runs on single CPU core, it becomes bottleneck:
      - ml.p3.8xlarge: 32 vCPUs, 4 NVIDIA V100 GPUs
      - Single-threaded data loading cannot keep 4 GPUs saturated
      - GPUs wait idle while CPU deserializes next batch

      **Solution: Multi-worker data loading**

      PyTorch DataLoader example:
      ```python
      from torch.utils.data import DataLoader

      train_loader = DataLoader(
          dataset,
          batch_size=256,
          num_workers=8,  # ← Key parameter
          pin_memory=True  # Optimize GPU transfer
      )
      ```

      TensorFlow example:
      ```python
      dataset = tf.data.Dataset.from_generator(...)
      dataset = dataset.map(
          parse_function,
          num_parallel_calls=tf.data.AUTOTUNE  # ← Automatic parallelization
      )
      dataset = dataset.prefetch(tf.data.AUTOTUNE)  # Pipeline prefetching
      ```

      **How workers improve throughput**:

      With `num_workers=8`:
      - 8 parallel processes deserialize and preprocess batches
      - While GPU processes batch N, workers prepare batches N+1 through N+8
      - CPU deserialization parallelized across 8 cores (vs 1 core)
      - GPU receives continuous stream of ready batches (no waiting)
      - Expected GPU utilization: 85-95%+

      **Optimal worker count**:
      - Start with: `num_workers = min(num_cpus / 2, 8-16)`
      - For ml.p3.8xlarge (32 vCPUs): Try 8-16 workers
      - Monitor: CPU utilization should increase, GPU utilization should increase
      - Too many workers: Diminishing returns due to process overhead

      Why other options are incorrect:

      A: Network bandwidth is already sufficient at 10 Gbps:
      - RecordIO-Protobuf data: Assume 50 GB training dataset, 1-hour training = 50 GB / 3600 sec = 14 MB/sec = 0.11 Gbps
      - Even with continuous streaming, 10 Gbps >> 0.11 Gbps required
      - ml.p3.8xlarge has 10 Gbps bandwidth, which is not saturated
      - ml.p3dn.24xlarge costs $31.218/hour vs $12.24/hour (2.5x more expensive)
      - Problem is CPU deserialization, not network throughput

      Upgrading instance type wastes money without addressing root cause.

      C: File Mode does not solve CPU deserialization bottleneck:
      - File Mode still requires deserializing RecordIO-Protobuf from local EBS
      - Deserialization is CPU-bound regardless of storage location (S3 vs EBS)
      - File Mode advantages: Random access, multiple epochs from cache
      - File Mode does NOT increase deserialization throughput
      - Switching to File Mode adds 10+ minute download time without fixing GPU starvation

      This is a misconception that local disk is always faster. The bottleneck is CPU processing, not I/O.

      D: S3 Transfer Acceleration is for long-distance transfers (cross-continent):
      - Training instance and S3 bucket in same AWS region: Direct connection over AWS backbone (optimal latency)
      - Transfer Acceleration routes via CloudFront edge locations (beneficial for internet uploads, not intra-region)
      - No benefit for same-region S3 access
      - Does not address CPU deserialization bottleneck
      - Additional cost: $0.04-$0.08 per GB for acceleration (wasted money)

      Transfer Acceleration is useful for uploading training data from on-premises to S3, not for SageMaker-to-S3 streaming within region.

      **Verification after fix**:

      After increasing `num_workers=8`:
      - GPU utilization: 40% → 90%+ (GPUs no longer starved)
      - CPU utilization: 20% → 60% (more cores active for deserialization)
      - Training throughput: 2.5x improvement (measured in samples/sec)
      - Cost: No additional cost (utilizing existing instance capacity)
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/model-access-training-data.html
    services:
      - Amazon SageMaker
      - Amazon S3
    concepts:
      - Pipe Mode performance tuning
      - Data loading parallelism
      - GPU utilization optimization
      - Training bottleneck diagnosis

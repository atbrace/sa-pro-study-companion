questions:
  - id: dis-001
    type: single
    text: |
      A financial services company ingests 2 TB of transaction data daily from multiple sources into their ML data lake on Amazon S3.
      Data scientists frequently query the last 30-90 days of data for feature engineering using Amazon Athena, but rarely access older data.
      The raw data is initially stored in CSV format. The ML team wants to optimize both query performance and storage costs.

      Which combination of actions will BEST achieve these goals?
    options:
      - id: A
        text: Convert CSV to Parquet format using AWS Glue ETL jobs, enable S3 Intelligent-Tiering storage class, and partition data by ingestion date
      - id: B
        text: Keep data in CSV format, implement S3 Lifecycle policies to move data older than 30 days to S3 Glacier, and create a single Glue table without partitions
      - id: C
        text: Convert CSV to JSON format for better compatibility, use S3 Standard storage class for all data, and partition by random UUID to distribute load
      - id: D
        text: Store data in RecordIO-Protobuf format for optimal compression, use S3 Standard-IA for all historical data, and avoid partitioning to simplify queries
    correctAnswer: A
    explanation: |
      Option A is correct because it addresses all requirements optimally:

      1. **Parquet format**: Provides 70-90% compression compared to CSV and enables columnar access for Athena queries. Column pruning dramatically improves query performance when data scientists select specific features.

      2. **S3 Intelligent-Tiering**: Automatically moves data between access tiers based on access patterns. Frequently accessed data (last 30-90 days) stays in frequent access tier, while older data automatically transitions to infrequent access (30 days) and archive instant access (90 days), achieving 40-68% cost savings without manual lifecycle management.

      3. **Partition by ingestion date**: Enables Athena to skip scanning irrelevant data when queries filter by date ranges. For queries on last 30 days, this reduces data scanned by 90%+ compared to full-table scans, directly reducing Athena costs (charged per GB scanned).

      Why other options are incorrect:

      B: CSV format provides no compression or column pruning benefits, resulting in slow queries and high Athena costs. S3 Glacier has millisecond retrieval latency but requires restore operations for bulk access, making it unsuitable for data that might be queried occasionally. No partitioning means all 2 TB scanned for every query.

      C: JSON is actually larger than CSV for structured tabular data (field names repeated for each record) and offers no query performance benefits. Random UUID partitioning provides no query optimization since date-based queries cannot prune partitions. S3 Standard for all data wastes money on infrequently accessed older data.

      D: RecordIO-Protobuf is designed for SageMaker training input, not analytical queries with Athena (which cannot read RecordIO). S3 Standard-IA for all data incurs retrieval charges for frequently accessed recent data, increasing costs. Avoiding partitioning forces full-table scans on every query.
    awsDocLink: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-format.html
    services:
      - Amazon S3
      - AWS Glue
      - Amazon Athena
    concepts:
      - Data formats
      - S3 storage classes
      - Partitioning strategies

  - id: dis-002
    type: single
    text: |
      An ML engineering team is training a custom PyTorch model in Amazon SageMaker on a 150 GB dataset stored in S3.
      The training job takes 6 hours to complete, but the team notices that the first 25 minutes are spent downloading data before training actually begins.
      The training algorithm reads data sequentially during each epoch and does not require random access to records.

      What change would MOST effectively reduce the total training time and cost?
    options:
      - id: A
        text: Increase the SageMaker training instance size to ml.p4d.24xlarge for faster network bandwidth
      - id: B
        text: Convert the dataset to RecordIO-Protobuf format and enable Pipe Mode in the training job configuration
      - id: C
        text: Enable S3 Transfer Acceleration on the bucket to speed up downloads during File Mode
      - id: D
        text: Split the dataset into 100 smaller files and use multi-threaded downloads in File Mode
    correctAnswer: B
    explanation: |
      Option B is correct because Pipe Mode with RecordIO-Protobuf format directly addresses the 25-minute download bottleneck:

      **Pipe Mode benefits**:
      - Eliminates pre-training download phase: Training starts in seconds instead of 25 minutes
      - Streams data from S3 during training: Only small buffers kept in memory
      - Reduced EBS volume requirement: No need to store full 150 GB dataset locally
      - Cost savings: 25 minutes less billable training time on expensive GPU instances
      - Performance improvement: Up to 40% faster data loading with RecordIO-Protobuf streaming

      **RecordIO-Protobuf format**: Optimized binary format specifically designed for streaming with SageMaker. Each record is prefixed with size header, enabling efficient sequential streaming without parsing overhead.

      For a 150 GB dataset on ml.p3.8xlarge instance ($12.24/hour), 25-minute reduction saves approximately $5.10 per training run. Over hundreds of experiments, savings compound significantly.

      Why other options are incorrect:

      A: Upgrading to ml.p4d.24xlarge ($32.77/hour, 4x more expensive) would improve network bandwidth but still requires downloading full 150 GB before training starts. The cost increase far exceeds time savings. Additionally, network bandwidth is rarely the bottleneck for S3 downloads within AWS regions (multi-Gbps throughput available on most instance types).

      C: S3 Transfer Acceleration optimizes transfers over long distances (internet, cross-continent) but provides minimal benefit within the same AWS region where training instances and S3 buckets typically reside. Does not eliminate the fundamental File Mode bottleneck of downloading entire dataset before training.

      D: Multi-threaded downloads can improve File Mode download speed by 2-3x but still requires downloading entire 150 GB to EBS volume before training begins. Adds complexity to training script. Even with 3x speedup (8 minutes download), Pipe Mode is still significantly faster (near-zero startup time).
    awsDocLink: https://aws.amazon.com/blogs/machine-learning/using-pipe-input-mode-for-amazon-sagemaker-algorithms/
    services:
      - Amazon SageMaker
      - Amazon S3
    concepts:
      - Pipe Mode vs File Mode
      - RecordIO-Protobuf format
      - Training optimization

  - id: dis-003
    type: multi
    correctCount: 2
    text: |
      A data engineering team is designing a real-time feature ingestion pipeline for a fraud detection system.
      The system processes 5,000 transactions per second with an average payload size of 2 KB per transaction.
      Features must be available for real-time inference within 500 milliseconds of transaction occurrence.

      Which TWO design decisions will ensure the system meets the latency and throughput requirements? (Select TWO)
    options:
      - id: A
        text: Use Amazon Kinesis Data Streams with 10 shards in provisioned mode to handle the ingestion throughput
      - id: B
        text: Use Amazon Kinesis Data Firehose with a 60-second buffer interval to deliver data to SageMaker Feature Store
      - id: C
        text: Implement AWS Lambda consumers to process Kinesis records and write to SageMaker Feature Store Online Store using PutRecord API
      - id: D
        text: Configure Kinesis Data Streams to write directly to SageMaker Feature Store Offline Store for real-time feature availability
      - id: E
        text: Use Amazon SQS FIFO queues to buffer transactions before batch processing them every minute for feature computation
    correctAnswer:
      - A
      - C
    explanation: |
      Options A and C together provide a complete solution meeting all requirements:

      **Option A - Kinesis Data Streams with 10 shards**:

      Capacity calculation:
      - Throughput: 5,000 transactions/sec × 2 KB = 10 MB/sec
      - Records per second: 5,000
      - Write limits per shard: 1 MB/sec OR 1,000 records/sec (whichever reached first)
      - Required shards: max(10 MB/sec ÷ 1 MB/sec, 5,000 records/sec ÷ 1,000 records/sec) = max(10, 5) = 10 shards

      Provisioned mode is appropriate here because traffic is predictable (constant 5,000 TPS), enabling cost optimization with fixed shard count.

      Latency: Kinesis provides sub-second ingestion latency, well within 500ms requirement.

      **Option C - Lambda consumers writing to Feature Store Online Store**:

      - Lambda triggered by Kinesis records (batch sizes configurable, typically 100-1000 records)
      - Lambda computes features from transaction data
      - PutRecord API writes directly to Online Store (DynamoDB backend)
      - PutRecord latency: Sub-20ms typical, enabling end-to-end latency < 500ms
      - Online Store provides low-latency reads for real-time inference at SageMaker endpoints

      This architecture achieves: Transaction → Kinesis (< 100ms) → Lambda (< 100ms) → Feature Store (< 20ms) = < 250ms end-to-end.

      Why other options are incorrect:

      B: Kinesis Data Firehose has **minimum 60-second buffer interval**, which violates the 500-millisecond latency requirement. Firehose is designed for near-real-time delivery (minutes), not sub-second latency required for real-time fraud detection. Additionally, Firehose typically delivers to S3, not directly to Feature Store Online Store.

      D: Kinesis Data Streams does not write directly to Feature Store - custom application logic (Lambda, Flink, or application code) is required to consume streams and invoke Feature Store APIs. Furthermore, Offline Store (S3-based Iceberg tables) is designed for analytical queries and training, not real-time inference. Offline Store has minute-level latency due to S3 write patterns, incompatible with 500ms requirement.

      E: SQS FIFO queues with 1-minute batch processing introduces minimum 1-minute latency (average 30 seconds for transactions arriving mid-interval), which is 60x-120x higher than the 500ms requirement. SQS is appropriate for decoupling and fault tolerance but not for real-time feature serving.
    awsDocLink: https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
    services:
      - Amazon Kinesis Data Streams
      - AWS Lambda
      - Amazon SageMaker Feature Store
    concepts:
      - Kinesis shard capacity planning
      - Real-time ingestion patterns
      - Feature Store Online Store

  - id: dis-004
    type: single
    text: |
      A machine learning team uses AWS Glue to catalog their S3-based data lake containing customer interaction data organized as:

      s3://ml-datalake/interactions/year=2026/month=01/day=11/interactions.parquet

      After running a Glue crawler, data scientists query the table using Amazon Athena but notice that queries scanning the last 7 days take
      much longer and cost significantly more than expected. The table contains 18 months of data totaling 5 TB.

      What is the MOST likely cause of poor query performance?
    options:
      - id: A
        text: The Glue crawler did not detect the year/month/day folders as partitions, causing Athena to scan all 5 TB for every query
      - id: B
        text: Parquet format is not optimized for Athena queries, and the data should be converted to CSV for better performance
      - id: C
        text: The Glue Data Catalog stores the actual data instead of just metadata, creating a bottleneck during queries
      - id: D
        text: Athena automatically scans all data regardless of WHERE clause filters to ensure accuracy
    correctAnswer: A
    explanation: |
      Option A is correct - the Glue crawler failing to detect partitions is the most common cause of this performance issue pattern.

      **Why this happens**:

      Glue crawlers automatically detect partitions from S3 key patterns **if** the pattern follows standard Hive-style partitioning with key=value format. The provided structure (year=2026/month=01/day=11) should be detected, but common issues that prevent detection include:

      1. **Inconsistent naming**: If some paths use "year" and others use "yr", crawler may skip partition detection
      2. **Crawler configuration**: "Create a single schema for each S3 path" option may have been disabled
      3. **Mixed data types**: If year folders contain both files and subfolders, crawler behavior varies
      4. **Custom classifiers**: Incorrect custom classifier configuration can override partition detection

      **Performance impact without partitions**:

      - Query: `SELECT * FROM interactions WHERE year=2026 AND month=01 AND day>=05`
      - Without partitions: Athena scans all 5 TB (entire table) to filter records
      - With partitions: Athena scans only 7 days ≈ 20 GB (5 TB ÷ 548 days × 7 days)
      - Cost difference: $25.00 vs $0.10 per query (Athena charges $5 per TB scanned)
      - Time difference: 180 seconds vs 4 seconds (partition pruning reduces I/O by 99%+)

      **Solution**: Re-run Glue crawler with correct configuration, or manually add partitions using:
      ```sql
      ALTER TABLE interactions ADD PARTITION (year=2026, month=01, day=11)
      LOCATION 's3://ml-datalake/interactions/year=2026/month=01/day=11/';
      ```

      Why other options are incorrect:

      B: Parquet is **optimal** for Athena queries - it provides 70-90% compression and columnar storage enabling column pruning and predicate pushdown. Converting to CSV would dramatically worsen performance (10x slower queries, 5-10x higher costs) because CSV requires scanning entire file even when selecting specific columns, and offers no compression benefits. AWS explicitly recommends Parquet for Athena workloads.

      C: This is a fundamental misunderstanding of AWS Glue Data Catalog architecture. The Data Catalog stores **only metadata**: table schemas, partition locations, column types, statistics. The actual data remains in S3. Queries retrieve metadata from Catalog (milliseconds), then read data directly from S3 using that metadata. Data Catalog cannot be a bottleneck for data volume.

      D: This is incorrect - Athena's core value proposition is partition pruning and predicate pushdown. Athena analyzes WHERE clause filters, consults Glue Data Catalog partition metadata, and scans only relevant S3 objects. This optimization is precisely how Athena achieves cost-effectiveness for large datasets. Without this capability, Athena would be prohibitively expensive.
    awsDocLink: https://docs.aws.amazon.com/glue/latest/dg/add-crawler.html
    services:
      - AWS Glue
      - AWS Glue Data Catalog
      - Amazon Athena
      - Amazon S3
    concepts:
      - Glue crawlers
      - Partition detection
      - Query optimization

  - id: dis-005
    type: single
    text: |
      An ML team is preparing a training dataset for a computer vision model. The dataset consists of 500,000 images (200 GB total) stored in S3,
      each with corresponding labels in a separate CSV file. They plan to use a SageMaker built-in image classification algorithm for training.

      Which data format and SageMaker feature combination will provide the FASTEST training start time and optimal throughput?
    options:
      - id: A
        text: Store images as individual JPEG files in S3, use augmented manifest format with Pipe Mode to stream image and label data
      - id: B
        text: Convert images to RecordIO-Protobuf format with embedded labels, store in S3, and use File Mode with EBS volume
      - id: C
        text: Keep images as individual JPEG files, copy to EFS (Elastic File System), and mount EFS to training instance
      - id: D
        text: Compress all images into a single ZIP archive, download to training instance, extract, then begin training
    correctAnswer: A
    explanation: |
      Option A is correct because augmented manifest format with Pipe Mode is specifically designed for this scenario (image classification with external label files) and provides optimal performance.

      **Augmented Manifest Format**:
      - JSON Lines format (.manifest file) containing S3 paths to images and corresponding labels
      - Each line: `{"source-ref": "s3://bucket/image001.jpg", "class": "cat"}`
      - No need to convert images to different format - use original JPEGs
      - Supports annotation metadata from SageMaker Ground Truth

      **Pipe Mode with Augmented Manifest**:
      - Streams both image files and labels directly from S3
      - SageMaker reads manifest file, fetches images on-demand during training
      - Training starts in seconds (no 200 GB download wait)
      - Minimal EBS volume required (5 GB typical)
      - Memory efficient: Only current mini-batch of images in memory

      **Performance benefits**:
      - Instant training start vs 10-15 minute download in File Mode
      - 200 GB dataset becomes manageable without large EBS volumes
      - Reduced instance cost: Smaller storage, shorter billable time
      - Native support in SageMaker built-in algorithms (Image Classification, Object Detection)

      Why other options are incorrect:

      B: RecordIO-Protobuf format is designed for tabular/numerical data represented as float arrays, not images. While technically possible to encode images as byte arrays in Protobuf, this is not the intended use case and offers no benefits over augmented manifest. Converting 500,000 images to RecordIO is time-consuming and complex. File Mode with 200 GB dataset requires large EBS volume and 10+ minute download time before training starts, eliminating the fast start time requirement.

      C: EFS mounting appears attractive but introduces significant drawbacks:
      - EFS performance depends on throughput mode and size: Bursting mode only provides 100 MiB/s baseline for files under 1 TiB
      - 200 GB of images = $60/month EFS storage cost vs $4.60/month S3 Standard cost (13x more expensive)
      - Network overhead: Training instance still reads over network, similar to S3 but with EFS limitations
      - Requires VPC configuration and ENI attachment complexity
      - No advantage over Pipe Mode streaming directly from S3

      D: This is the worst option:
      - Creates single point of failure (corrupted ZIP = entire dataset lost)
      - Extract operation on 200 GB ZIP takes 5-10 minutes plus 10-minute download = 15-20 minute start time
      - Requires 400+ GB EBS volume (200 GB for ZIP + 200 GB for extracted files)
      - Instance runs during slow extraction, wasting expensive GPU hours
      - No streaming benefits - full dataset download required
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/augmented-manifest-stream.html
    services:
      - Amazon SageMaker
      - Amazon S3
    concepts:
      - Augmented manifest format
      - Pipe Mode
      - Image classification data formats

  - id: dis-006
    type: single
    text: |
      A company is building a recommendation engine that requires both real-time features (user's last 5 clicked items)
      and historical features (user's total purchases over lifetime) for inference. The system serves 10,000 predictions per second.
      Historical features are computed nightly via batch EMR jobs processing 2 years of data.

      How should the team architect feature storage to meet both latency and data requirements?
    options:
      - id: A
        text: Store all features in SageMaker Feature Store Online Store only, updated by both real-time streams and nightly batch jobs
      - id: B
        text: Store all features in SageMaker Feature Store Offline Store only, queried via Athena during each inference request
      - id: C
        text: Store real-time features in DynamoDB and historical features in S3, requiring inference code to query both sources
      - id: D
        text: Configure SageMaker Feature Store with both Online Store (for real-time features) and Offline Store (for batch features), then synchronize historical features from Offline to Online Store nightly
    correctAnswer: D
    explanation: |
      Option D is correct because it leverages Feature Store's dual-store architecture precisely for this hybrid latency pattern while maintaining feature consistency.

      **Architecture breakdown**:

      1. **Real-time features → Online Store**:
         - Kinesis Data Streams captures user click events
         - Lambda function computes last 5 clicked items
         - PutRecord API writes to Feature Store Online Store
         - Sub-20ms write latency enables real-time updates
         - DynamoDB backend provides single-digit millisecond reads during inference

      2. **Historical features → Offline Store → Online Store sync**:
         - Nightly EMR Spark job processes 2 years of purchase history
         - Computes lifetime value, purchase frequency, category preferences
         - Batch ingestion to Feature Store Offline Store (S3 Iceberg tables)
         - Separate job reads from Offline Store and updates Online Store with latest historical features
         - Ensures both feature types available in single Online Store for inference

      3. **Inference serving**:
         - SageMaker endpoint invokes GetRecord API against Online Store
         - Single query retrieves both real-time and historical features
         - Sub-10ms latency supports 10,000 predictions/sec requirement
         - No complex multi-source query logic in inference code

      **Key benefits**:
      - Unified feature access: One API call retrieves all features
      - Appropriate storage for each pattern: Online for low-latency, Offline for analytics
      - Feature consistency: Same feature definitions across training and inference
      - Simplified inference code: No custom multi-source query logic
      - Cost-effective: Offline Store uses cheap S3; Online Store only for active features

      Why other options are incorrect:

      A: Storing batch historical features ONLY in Online Store wastes cost - DynamoDB storage ($0.25 per GB-month) is 5x more expensive than S3 ($0.023 per GB-month for Intelligent-Tiering). For 2 years of historical data (potentially TB-scale), this is cost-prohibitive. More importantly, Online Store is not designed for large-scale batch ingestion or analytical queries that EMR jobs might need for feature computation. Offline Store (S3-based) is optimal for batch processing with Spark.

      B: Offline Store is S3-based Iceberg tables designed for analytical queries, not low-latency serving. Querying Athena during each inference request would introduce:
      - 2-5 second query latency (Athena is not designed for sub-second queries)
      - $5 per TB scanned cost for every query (10,000 predictions/sec = $millions/day)
      - Query concurrency limits (20 concurrent queries default in Athena)
      - Completely violates 10,000 QPS latency requirements

      C: This is the "build it yourself" approach that Feature Store is designed to replace:
      - Inference code must handle two different APIs (DynamoDB and S3)
      - No unified feature catalog - features scattered across systems
      - Schema inconsistencies between real-time and historical features
      - Training-serving skew risk: Training uses S3 data, inference uses DynamoDB + S3
      - Operational complexity: Manage DynamoDB provisioning, S3 lifecycle policies separately
      - No feature lineage or versioning

      Feature Store solves these exact problems by providing unified feature management with appropriate storage backends (Online for serving, Offline for analytics).
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store-ingest-data.html
    services:
      - Amazon SageMaker Feature Store
      - Amazon EMR
      - Amazon Kinesis Data Streams
      - AWS Lambda
    concepts:
      - Feature Store dual-store architecture
      - Online vs Offline stores
      - Hybrid ingestion patterns

  - id: dis-007
    type: single
    text: |
      An ML platform team manages 50 different machine learning models in production, each with dedicated training data pipelines.
      Raw data arrives in S3 from various sources (databases, APIs, streaming) in different formats (CSV, JSON, Parquet).
      The team wants to centralize metadata management and enable data scientists to discover available datasets without contacting data engineers.

      Which approach provides the MOST comprehensive solution for metadata management and data discovery?
    options:
      - id: A
        text: Create a README.md file in each S3 prefix describing the dataset schema, update date, and contact person
      - id: B
        text: Implement AWS Glue Data Catalog with crawlers scheduled to run after each data pipeline completes, tag tables with metadata, and provide SageMaker Studio access to the catalog
      - id: C
        text: Store all dataset schemas in a DynamoDB table with a custom web UI for search functionality
      - id: D
        text: Require data engineers to document schemas in a shared Google Sheet before deploying pipelines
    correctAnswer: B
    explanation: |
      Option B is correct because AWS Glue Data Catalog is purpose-built for centralized metadata management in data lakes, with native integration across all relevant AWS ML and analytics services.

      **Comprehensive benefits of Glue Data Catalog approach**:

      1. **Automated schema discovery**:
         - Glue crawlers automatically infer schemas from S3 data (CSV, JSON, Parquet, ORC, Avro)
         - Scheduled runs ensure catalog stays synchronized with data pipeline outputs
         - Detects schema evolution (new columns, type changes) and updates catalog
         - Partition discovery automatically maps S3 key structures to queryable partitions

      2. **Centralized metadata repository**:
         - Single source of truth for all dataset schemas, locations, formats
         - Column-level metadata: data types, comments, statistics (min/max/null counts)
         - Table-level properties: creation time, last updated, data format, compression
         - Supports 1 million+ tables in single catalog (regional scope)

      3. **Native AWS service integration**:
         - **SageMaker Studio**: Browse catalog, preview data, import directly into Data Wrangler
         - **Amazon Athena**: Query catalog tables with SQL for feature exploration
         - **AWS Glue ETL**: Reference catalog tables as sources/destinations
         - **Amazon EMR**: Access catalog as Hive metastore for Spark jobs
         - **Amazon Redshift Spectrum**: Query data lake tables alongside warehouse data

      4. **Enhanced data discovery**:
         - SageMaker Studio catalog browser: Search by table name, column name, or tag
         - Resource tagging: Add custom tags (team=recommendation-engine, pii=true, quality=validated)
         - Column-level tagging for governance (sensitive data identification)
         - Catalog search API for programmatic discovery in ML pipelines

      5. **Data governance and security**:
         - AWS Lake Formation integration: Column-level access control via catalog
         - IAM policies control catalog access (read-only for data scientists, write for engineers)
         - Audit logging via CloudTrail: Track who accessed which tables
         - Schema validation before model training: Ensure expected columns exist

      **Operational workflow**:
      1. Data pipeline writes to S3 (any format)
      2. EventBridge triggers Glue crawler on S3 ObjectCreated event
      3. Crawler infers schema, creates/updates catalog table
      4. Data scientist searches catalog in SageMaker Studio
      5. Imports dataset directly into notebook or Data Wrangler
      6. Schema available programmatically for automated ML pipelines

      Why other options are incorrect:

      A: README.md files are unstructured, non-queryable, and require manual maintenance:
      - No programmatic access for ML pipelines to validate schemas
      - Quickly become outdated as schemas evolve
      - Cannot search across all datasets (must check each README individually)
      - No integration with SageMaker, Athena, or other AWS services
      - Schema changes require manual README updates (often forgotten)
      - No governance: Anyone with S3 access can modify READMEs

      B: This manual, unstructured approach has fundamental problems:
      - Spreadsheets are not designed for structured metadata storage
      - No schema validation (data types could be documented incorrectly)
      - No access control (anyone with link can edit)
      - No integration with AWS ML/analytics services
      - Quickly becomes unmaintainable with 50+ models and growing datasets
      - Search functionality is primitive (Excel-style text search)

      C: Building custom metadata management is expensive and error-prone:
      - DynamoDB + custom UI = weeks of development and ongoing maintenance
      - Reinventing functionality that Glue Data Catalog provides out-of-box
      - No native integration with SageMaker, Athena, EMR
      - Schema inference logic must be custom-built for each format
      - No automatic partition detection or schema evolution handling
      - Operational burden: UI hosting, API management, database backups

      AWS Glue Data Catalog is specifically designed to solve this exact problem at scale.
    awsDocLink: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
    services:
      - AWS Glue
      - AWS Glue Data Catalog
      - Amazon SageMaker Studio
      - Amazon S3
    concepts:
      - Metadata management
      - Data discovery
      - Schema inference

  - id: dis-008
    type: multi
    correctCount: 3
    text: |
      A healthcare analytics company is designing a HIPAA-compliant ML data lake on AWS. The solution must:
      - Ingest 500 GB of patient records daily from on-premises SFTP servers
      - Store data in S3 with encryption at rest
      - Catalog and make data discoverable for approved users
      - Minimize operational overhead for data engineers

      Which THREE actions should be included in the architecture? (Select THREE)
    options:
      - id: A
        text: Use AWS Transfer Family with SFTP protocol to receive files directly into S3, enabling S3 default encryption with AWS KMS
      - id: B
        text: Deploy EC2 instances running SFTP servers, then use scheduled Lambda functions to copy files from EC2 to S3
      - id: C
        text: Configure AWS Glue crawlers with KMS encryption enabled to scan S3 data and populate the Data Catalog
      - id: D
        text: Implement AWS Lake Formation for centralized access control to Data Catalog tables, with column-level security for PHI fields
      - id: E
        text: Store all data in a single S3 bucket without organizing by date or type to simplify access management
      - id: F
        text: Use S3 Lifecycle policies to automatically transition historical patient records older than 7 years to S3 Glacier Deep Archive for long-term compliance retention
    correctAnswer:
      - A
      - C
      - D
    explanation: |
      Options A, C, and D together provide a complete, secure, low-operational-overhead solution for HIPAA-compliant data lake ingestion and cataloging.

      **Option A - AWS Transfer Family for SFTP**:

      AWS Transfer Family provides fully managed SFTP, FTPS, and FTP servers with direct S3 integration:

      - **Managed service**: No server provisioning, patching, or scaling required (minimal operational overhead)
      - **Direct S3 writes**: Files uploaded via SFTP are written directly to S3 (no intermediate storage on EC2)
      - **Native encryption**: Configure S3 default encryption with AWS KMS (HIPAA compliance requirement)
      - **Authentication options**: Support for service-managed users, Active Directory, or custom Lambda authorizers
      - **HIPAA eligible**: AWS Transfer Family is a HIPAA-eligible service under BAA
      - **Audit logging**: CloudWatch Logs and CloudTrail capture all file transfer activity
      - **Cost-effective**: Pay per protocol endpoint per hour + data transferred (no EC2 instance costs)

      For 500 GB daily ingestion, Transfer Family is operationally simpler and more secure than managing EC2-based SFTP servers.

      **Option C - Glue Crawlers with KMS Encryption**:

      Glue crawlers automate schema discovery while maintaining encryption:

      - **Automatic schema inference**: Crawlers scan S3 objects and create Data Catalog tables
      - **KMS integration**: Crawlers can read KMS-encrypted S3 objects if granted decrypt permissions
      - **Scheduled runs**: Configure nightly crawlers after daily 500 GB ingestion completes
      - **Metadata security**: Catalog metadata can also be encrypted at rest
      - **HIPAA compliance**: AWS Glue is HIPAA-eligible under BAA
      - **Zero operational overhead**: Serverless, no infrastructure to manage

      Ensures catalog stays synchronized with ingested data without manual schema maintenance.

      **Option D - AWS Lake Formation for Access Control**:

      Lake Formation provides centralized, fine-grained data governance required for HIPAA PHI (Protected Health Information):

      - **Column-level security**: Grant access to specific columns (e.g., allow researchers to see diagnosis codes but not patient names)
      - **Row-level security**: Filter data based on user attributes (e.g., only show patients from specific regions)
      - **Centralized permissions**: Single control plane for Data Catalog, S3, and services (Athena, EMR, SageMaker)
      - **Tag-based access control**: Tag columns containing PHI, apply policies based on tags
      - **Audit logging**: Comprehensive CloudTrail logging of all data access for HIPAA audit requirements
      - **Data masking**: Redact or mask sensitive columns (SSN, MRN) for specific user groups
      - **Integrated with Data Catalog**: Permissions apply across all services querying catalog

      For healthcare data with strict regulatory requirements, Lake Formation is essential for demonstrating access control compliance.

      **Why other options are incorrect or incomplete**:

      B: EC2-based SFTP servers introduce significant operational overhead:
      - Requires patching, scaling, monitoring, and high availability configuration
      - Must implement custom encryption, authentication, and audit logging
      - Higher cost than Transfer Family (24/7 EC2 instances vs pay-per-use managed service)
      - Lambda copying adds complexity, latency, and potential failure points
      - Does not minimize operational overhead as required

      E: Storing data without organization is a data governance anti-pattern:
      - Violates data lake best practices (raw/processed/curated layers)
      - Makes compliance audits difficult (cannot easily identify data from specific time periods)
      - Poor query performance (cannot use partitioning for time-based analysis)
      - Access management becomes harder, not simpler (cannot apply policies to specific data subsets)
      - HIPAA requires data lifecycle management, which is impossible without date-based organization

      F: While S3 Glacier Deep Archive lifecycle policies are a valid cost optimization and compliance strategy (many healthcare regulations require 7-year retention), this option is not essential for the core requirements:
      - Ingestion (covered by A), cataloging (covered by C), and access control (covered by D) are higher priorities
      - Lifecycle policies can be added later without impacting initial architecture
      - The question asks for THREE actions; A, C, D provide complete solution for stated requirements

      However, F would be an excellent addition for a comprehensive solution (if the question asked for four actions).

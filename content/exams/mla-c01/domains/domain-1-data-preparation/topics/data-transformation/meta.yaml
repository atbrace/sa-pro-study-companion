id: data-transformation
name: Data Transformation Pipelines
shortName: Transformation
examTask: task-1-2
description: Transform data and perform feature engineering using AWS Glue, SageMaker Data Wrangler, and related services. Learn ETL patterns, encoding techniques, and scalable transformation pipelines for machine learning workloads.
estimatedStudyTime: 90
difficulty: intermediate

keyServices:
  - AWS Glue
  - AWS Glue DataBrew
  - Amazon SageMaker Data Wrangler
  - Amazon SageMaker Processing
  - Amazon EMR
  - AWS Step Functions

keyConcepts:
  - ETL pipeline design
  - Feature engineering techniques
  - Categorical encoding methods
  - Normalization and standardization
  - Data quality transformations
  - PySpark and Pandas transformations
  - Serverless data processing
  - Workflow orchestration


id: ml-pipelines
name: ML Pipeline Orchestration
shortName: ML Pipelines
examTask: task-3-3
description: Set up CI/CD pipelines for ML workflows using SageMaker Pipelines, Step Functions, and orchestration tools to automate model training, testing, and deployment.
estimatedStudyTime: 90
difficulty: intermediate

keyServices:
  - Amazon SageMaker Pipelines
  - AWS Step Functions
  - AWS CodePipeline
  - Amazon EventBridge
  - SageMaker Model Registry
  - AWS CodeBuild
  - AWS CodeCommit

keyConcepts:
  - Pipeline orchestration and DAG construction
  - CI/CD workflow automation for ML
  - Step types and dependencies
  - Conditional execution and model approval
  - Event-driven pipeline triggers
  - Step caching and optimization
  - Local mode testing and debugging
  - Model registry integration
  - Cross-account deployment patterns
  - Parallel execution strategies


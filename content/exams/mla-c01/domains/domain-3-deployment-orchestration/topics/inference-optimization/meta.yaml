id: inference-optimization
name: Inference Optimization Techniques
shortName: Inference Optimization
examTask: task-3-1
description: >
  Master advanced techniques for optimizing ML model inference on Amazon SageMaker, including
  multi-model and multi-container endpoints, model compilation with SageMaker Neo, instance
  selection using Inference Recommender, and auto-scaling strategies for cost-effective,
  high-performance deployments.
estimatedStudyTime: 75
difficulty: advanced
keyServices:
  - Amazon SageMaker Multi-Model Endpoints
  - Amazon SageMaker Multi-Container Endpoints
  - Amazon SageMaker Neo
  - Amazon SageMaker Inference Recommender
  - Amazon SageMaker Serverless Inference
  - Amazon SageMaker Asynchronous Inference
  - AWS Inferentia
  - AWS Trainium
  - Amazon CloudWatch
keyConcepts:
  - Multi-model endpoint architecture and caching
  - Multi-container endpoint invocation patterns
  - Model compilation and optimization with Neo
  - Instance selection and right-sizing strategies
  - Auto-scaling policies and metrics
  - Inference cost optimization techniques
  - Latency and throughput optimization
  - Serverless and asynchronous inference patterns
  - Hardware acceleration with Inferentia and Trainium
  - Batch transform optimization

  - id: io-013
    type: single
    text: |
      An ML engineer used SageMaker Inference Recommender and received two top recommendations:

      Recommendation 1:
      - Instance: ml.m5.2xlarge
      - P95 Latency: 45ms
      - Max Throughput: 2000 TPS
      - Cost per 1M inferences: $3.50
      - Neo compiled: No

      Recommendation 2:
      - Instance: ml.inf2.xlarge
      - P95 Latency: 28ms
      - Max Throughput: 1500 TPS
      - Cost per 1M inferences: $1.80
      - Neo compiled: Yes

      The workload requires 1200 TPS sustained throughput and P95 latency < 50ms. Which recommendation should be selected?
    options:
      - id: A
        text: Recommendation 1, because it provides higher throughput capacity and headroom for growth
      - id: B
        text: Recommendation 2, because it offers 48% cost savings while meeting all performance requirements
      - id: C
        text: Recommendation 1, because uncompiled models are easier to update and maintain
      - id: D
        text: Deploy both recommendations behind an Application Load Balancer for redundancy
    correctAnswer: B
    explanation: |
      Recommendation 2 (ml.inf2.xlarge with Neo compilation) is the correct choice because:

      **Requirements validation:**
      - ✓ Throughput: 1500 TPS > 1200 TPS required (20% headroom)
      - ✓ Latency: 28ms P95 << 50ms SLA (44% faster than required)
      - ✓ Cost: $1.80 per 1M inferences vs. $3.50 (48% cost reduction = $20,400/month savings at 1B requests/month)

      **Additional benefits of Recommendation 2:**

      1. **Better cost-performance ratio**:
         - 37% lower latency AND 48% lower cost
         - More efficient utilization of AWS Inferentia accelerators

      2. **Neo compilation advantages**:
         - Hardware-optimized inference code (no JIT compilation overhead)
         - Lower memory footprint enables better scaling
         - Faster cold starts for auto-scaling scenarios

      3. **Sufficient capacity buffer**:
         - 20% throughput headroom (1500 vs. 1200 TPS) provides room for traffic spikes
         - Can handle 25% traffic increase before reaching capacity

      4. **Future optimization path**:
         - If throughput needs exceed 1500 TPS, add instances or enable auto-scaling
         - Cost per 1M inferences remains $1.80 regardless of instance count

      **Cost analysis at scale:**
      ```python
      # Assume 1 billion requests/month
      monthly_requests = 1_000_000_000

      # Recommendation 1 (ml.m5.2xlarge)
      cost_rec1 = (monthly_requests / 1_000_000) * 3.50  # $3,500/month

      # Recommendation 2 (ml.inf2.xlarge)
      cost_rec2 = (monthly_requests / 1_000_000) * 1.80  # $1,800/month

      # Annual savings: ($3,500 - $1,800) × 12 = $20,400
      ```

      Why other options are incorrect:
      - A: While Recommendation 1 has higher max throughput (2000 TPS), the workload only requires 1200 TPS. The 33%
           throughput advantage doesn't justify 48% higher costs. If throughput needs grow beyond 1500 TPS,
           Recommendation 2 can scale horizontally
      - C: Neo-compiled models are not harder to maintain. The compilation happens once during deployment, and model
           updates simply require recompilation (automated in SageMaker). The 48% cost savings far outweigh any minimal
           operational differences
      - D: This doesn't make architectural sense. Inference Recommender provides alternatives to choose from, not to
           deploy simultaneously. This would double costs unnecessarily

      **Decision principle**: When multiple recommendations meet performance requirements, optimize for cost.
      Recommendation 2 meets all SLAs with significant cost advantages.

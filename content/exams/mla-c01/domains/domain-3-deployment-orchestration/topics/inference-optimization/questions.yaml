  - id: io-014
    type: multi
    correctCount: 3
    text: |
      A company is preparing to deploy a large language model (LLM) for real-time inference on SageMaker. The model is
      7GB in size and requires GPU acceleration. The expected traffic is 50-500 requests per minute with high variability.
      The team wants to optimize for both cost and performance.

      Which THREE strategies should the ML engineer implement? (Choose 3)
    options:
      - id: A
        text: Deploy to AWS Inferentia instances and compile with AWS Neuron SDK
      - id: B
        text: Configure auto-scaling with target tracking on SageMakerVariantInvocationsPerInstance
      - id: C
        text: Implement dynamic batching in the inference container to increase throughput
      - id: D
        text: Deploy to a multi-model endpoint to share GPU resources across multiple models
      - id: E
        text: Use SageMaker Inference Recommender to identify optimal instance type and configuration
    correctAnswer:
      - B
      - C
      - E
    explanation: |
      The three correct optimization strategies are:

      B - Auto-scaling with target tracking: The 10x traffic variability (50-500 requests/minute) makes auto-scaling
      essential for cost optimization:

      ```python
      asg_client.put_scaling_policy(
          PolicyName='llm-scaling-policy',
          ServiceNamespace='sagemaker',
          ResourceId=f'endpoint/{endpoint_name}/variant/AllTraffic',
          ScalableDimension='sagemaker:variant:DesiredInstanceCount',
          PolicyType='TargetTrackingScaling',
          TargetTrackingScalingPolicyConfiguration={
              'TargetValue': 100.0,  # Target requests/minute/instance
              'PredefinedMetricSpecification': {
                  'PredefinedMetricType': 'SageMakerVariantInvocationsPerInstance'
              },
              'ScaleInCooldown': 600,  # 10 minutes
              'ScaleOutCooldown': 300  # 5 minutes
          }
      )
      ```

      Without auto-scaling, you'd need to provision for peak (500 req/min), wasting 80-90% capacity during low traffic
      (50 req/min). Auto-scaling provides 60-80% cost savings for variable traffic.

      C - Dynamic batching: LLMs benefit significantly from batching multiple requests together:

      **Benefits:**
      - Increases GPU utilization from 40-60% (single requests) to 80-95% (batched)
      - Reduces cost per inference by 40-60%
      - Improves throughput by 3-5x on same hardware

      **Implementation:**
      ```python
      # In inference.py
      class BatchingHandler:
          def __init__(self, model, max_batch_size=8, max_wait_ms=50):
              self.model = model
              self.max_batch_size = max_batch_size
              self.max_wait_ms = max_wait_ms
              self.batch_queue = []

          def predict(self, input_text):
              # Collect requests until batch size or timeout
              self.batch_queue.append(input_text)

              if len(self.batch_queue) >= self.max_batch_size or time_elapsed > self.max_wait_ms:
                  return self._process_batch()
      ```

      For LLMs, batching 4-8 requests together typically provides optimal balance between latency and throughput.

      E - Inference Recommender: Critical for LLM deployments because:
      - Tests multiple GPU instance types (ml.g5.xlarge, ml.g5.2xlarge, ml.g5.4xlarge, etc.)
      - Evaluates different configurations (container parameters, model optimizations)
      - Provides data-driven instance selection with cost and performance metrics
      - Tests with actual model and representative payloads

      For a 7GB LLM, Inference Recommender might recommend:
      - ml.g5.xlarge (24GB GPU memory) for cost optimization
      - ml.g5.2xlarge (48GB GPU memory) if batching or multiple model versions needed

      Why other options are incorrect or suboptimal:
      - A: While AWS Inferentia is excellent for many models, large LLMs (7GB) requiring advanced GPU operations may not
           be fully optimized for Inferentia yet. Inferentia excels at inference but some LLM-specific operations
           (attention mechanisms) are highly optimized for NVIDIA GPUs. Inference Recommender (E) would test both and
           provide data to decide
      - D: Multi-model endpoints with GPU are supported only through Triton Inference Server and add complexity. For a
           single LLM with variable traffic, auto-scaling (B) provides better resource optimization without the complexity
           of multi-model serving. MME is ideal when you have many models, not optimizing a single model

      **Combined impact:**
      - Auto-scaling: 60-80% cost reduction for variable traffic
      - Dynamic batching: 40-60% cost reduction per inference + 3-5x throughput
      - Inference Recommender: Ensures optimal instance selection, preventing over-provisioning
      - Total potential savings: 70-85% compared to naive deployment

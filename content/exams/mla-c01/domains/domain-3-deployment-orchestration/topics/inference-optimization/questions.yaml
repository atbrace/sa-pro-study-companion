questions:
  - id: io-001
    type: single
    text: |
      A financial services company has developed 500 fraud detection models, each trained for specific merchant categories.
      Each model is approximately 200MB in size and receives an average of 10 requests per hour. The company needs to deploy
      these models cost-effectively while maintaining sub-100ms inference latency for each request.

      Which deployment strategy should a machine learning engineer recommend?
    options:
      - id: A
        text: Deploy each model to a separate real-time endpoint using ml.t3.medium instances with auto-scaling enabled
      - id: B
        text: Deploy all models to a multi-model endpoint using ml.m5.2xlarge instances with 5 initial instances
      - id: C
        text: Deploy models to SageMaker Serverless Inference with 2GB memory configuration
      - id: D
        text: Deploy all models to a multi-container endpoint using ml.m5.xlarge instances with direct invocation
    correctAnswer: B
    explanation: |
      Multi-model endpoints (B) are the optimal solution for this scenario. With 500 models of similar size (200MB each)
      receiving low traffic (10 requests/hour), multi-model endpoints provide the best cost-performance balance by:

      1. Sharing infrastructure across all models, dramatically reducing costs compared to 500 separate endpoints
      2. Dynamically loading models from S3 when invoked, with intelligent caching of frequently used models
      3. Supporting sub-100ms latency for cached models (warm start)
      4. Using ml.m5.2xlarge instances (32GB memory) can cache approximately 150+ models simultaneously

      Why other options are incorrect:
      - A: 500 separate endpoints would be extremely expensive ($10,000+/month) and wasteful given low traffic per model
      - C: Serverless inference has cold start latencies of 10-20 seconds, violating the sub-100ms requirement
      - D: Multi-container endpoints support maximum 15 containers, not 500 models

      The company can further optimize by monitoring ModelCacheHit metrics and adjusting instance count/type based on
      cache hit rates and traffic patterns.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/multi-model-endpoints.html
    services:
      - Amazon SageMaker Multi-Model Endpoints
      - Amazon S3
    concepts:
      - Multi-model endpoint architecture
      - Model caching and dynamic loading
      - Cost optimization for many models
      - Infrastructure sharing

  - id: io-002
    type: single
    text: |
      A data science team needs to deploy a computer vision pipeline consisting of three stages: image preprocessing
      (scikit-learn), object detection (PyTorch), and result post-processing (custom Python code). The pipeline must
      process each image through all three stages in sequence. The team wants to minimize operational complexity and cost.

      What is the MOST appropriate deployment architecture?
    options:
      - id: A
        text: Deploy three separate real-time endpoints and orchestrate with AWS Step Functions
      - id: B
        text: Deploy a multi-model endpoint with all three models and invoke them sequentially from the client
      - id: C
        text: Deploy a multi-container endpoint configured as a serial inference pipeline
      - id: D
        text: Deploy all models to SageMaker Batch Transform with custom preprocessing code
    correctAnswer: C
    explanation: |
      A multi-container endpoint configured as a serial inference pipeline (C) is the optimal solution because:

      1. Supports different frameworks (scikit-learn, PyTorch, custom Python) in separate containers
      2. Automatically chains containers so output from one becomes input to the next
      3. Single endpoint invocation processes through entire pipeline, reducing network overhead
      4. Lower operational complexity than managing three separate endpoints
      5. More cost-effective by sharing infrastructure across pipeline stages

      Why other options are incorrect:
      - A: Three separate endpoints add operational complexity, increase latency (3x network round trips), and cost more
      - B: Multi-model endpoints require all models to use the SAME framework, which this scenario does not satisfy
      - D: Batch Transform is for offline processing, not real-time inference pipelines

      Multi-container endpoints support up to 15 containers in a pipeline, with each container running a different
      framework or model. The team can define the pipeline using SageMaker SDK's PipelineModel class.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/multi-container-endpoints.html
    services:
      - Amazon SageMaker Multi-Container Endpoints
    concepts:
      - Serial inference pipelines
      - Multi-container architecture
      - Framework diversity support
      - Pipeline orchestration

  - id: io-003
    type: multi
    correctCount: 3
    text: |
      A machine learning engineer is deploying a TensorFlow model for real-time inference and needs to optimize for both
      cost and latency. The model currently achieves 50ms inference latency on ml.m5.xlarge instances, but the team wants
      to reduce both latency and operational costs.

      Which THREE optimization techniques should the engineer implement? (Choose 3)
    options:
      - id: A
        text: Compile the model using SageMaker Neo to optimize for the target instance family
      - id: B
        text: Deploy the model to ml.p3.2xlarge GPU instances for faster inference
      - id: C
        text: Use SageMaker Inference Recommender to identify the optimal instance type and configuration
      - id: D
        text: Convert the model to use AWS Lambda for serverless inference
      - id: E
        text: Deploy the model to AWS Inferentia (ml.inf2.xlarge) instances for better price-performance
    correctAnswer:
      - A
      - C
      - E
    explanation: |
      The three correct optimization techniques are:

      A - SageMaker Neo compilation: Optimizes models through operator fusion, constant folding, and data layout
      transformations, typically improving latency 2-5x WITHOUT increasing costs. Neo eliminates JIT compilation
      overhead and generates hardware-specific optimized code. This directly addresses both cost and latency goals.

      C - Inference Recommender: Automatically benchmarks the model across multiple instance types and configurations
      to identify the optimal balance of cost and performance. It tests both compiled and uncompiled versions, providing
      metrics for cost-per-inference and latency percentiles. This data-driven approach ensures optimal instance selection.

      E - AWS Inferentia instances: Purpose-built for ML inference, Inferentia provides 30-70% better price-performance
      than general-purpose instances for deep learning models. The ml.inf2.xlarge offers lower cost than ml.m5.xlarge
      while typically providing better latency for TensorFlow models when compiled with AWS Neuron.

      Why other options are less optimal:
      - B: GPU instances (ml.p3.2xlarge) are more expensive than ml.m5.xlarge and overkill for a 50ms model. GPUs are
        beneficial for large models or high-throughput scenarios, not necessarily for cost reduction
      - D: AWS Lambda has a 15-minute timeout and is designed for event-driven computing, not optimized for real-time
        ML inference. SageMaker endpoints with proper configuration provide better latency and integration

      Combined, these three techniques can reduce costs by 40-60% while improving latency 2-3x.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/neo.html
    services:
      - Amazon SageMaker Neo
      - Amazon SageMaker Inference Recommender
      - AWS Inferentia
    concepts:
      - Model compilation optimization
      - Instance selection and right-sizing
      - Hardware acceleration
      - Cost-performance optimization

  - id: io-004
    type: single
    text: |
      A healthcare company runs inference on medical images that are typically 500MB each. Processing time per image is
      approximately 10 minutes, and the company receives 50-100 images per day, primarily during business hours. The
      application can tolerate processing delays of up to 30 minutes.

      Which deployment option provides the MOST cost-effective solution?
    options:
      - id: A
        text: Real-time inference endpoint with ml.g4dn.xlarge instances and auto-scaling from 1 to 5 instances
      - id: B
        text: SageMaker Serverless Inference with 6GB memory configuration and max concurrency of 10
      - id: C
        text: SageMaker Asynchronous Inference with ml.g4dn.xlarge instances and scale-to-zero configuration
      - id: D
        text: SageMaker Batch Transform scheduled to run every hour during business hours
    correctAnswer: C
    explanation: |
      SageMaker Asynchronous Inference with scale-to-zero (C) is the most cost-effective solution because:

      1. Supports large payloads up to 1GB (500MB images fit within limit)
      2. Handles long processing times up to 60 minutes (10-minute processing time is well within limit)
      3. Scales to zero instances when no requests are queued, eliminating costs outside of processing windows
      4. Processes requests within 30-minute tolerance through automatic queue management
      5. Cost = compute time only (approximately 16-33 instance-hours per day), not 24x7 operation

      Cost comparison:
      - Real-time (A): 24 instance-hours/day = 720 hours/month at $0.736/hour = ~$530/month
      - Async (C): ~25 instance-hours/day = 750 hours/month at $0.736/hour = ~$552/month, BUT scales to zero
        during idle periods, actual cost ~$100-150/month

      Why other options are less optimal:
      - A: Real-time endpoints remain running 24x7 even when no images are processed, wasting 80-90% of capacity
      - B: Serverless inference maximum processing time is limited and not suitable for 10-minute processing. Also,
        cold start overhead would be significant for large images
      - D: Batch Transform runs on schedule rather than on-demand, potentially delaying processing unnecessarily and
        not optimized for sporadic arrivals

      The company should configure auto-scaling using ApproximateBacklogSizePerInstance metric to handle traffic variations.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
    services:
      - Amazon SageMaker Asynchronous Inference
      - Amazon S3
      - Amazon SNS
    concepts:
      - Asynchronous inference architecture
      - Scale-to-zero optimization
      - Large payload handling
      - Cost optimization for intermittent workloads

  - id: io-005
    type: multi
    correctCount: 2
    text: |
      A company deployed 20 deep learning models to a multi-model endpoint using ml.m5.4xlarge instances (4 instances).
      CloudWatch metrics show ModelLoadingWaitTime is consistently high (5-8 seconds) and ModelCacheHit is only 40%.
      The models range from 500MB to 2GB in size and have varying traffic patterns.

      Which TWO actions will MOST effectively improve cache hit rates and reduce model loading wait times? (Choose 2)
    options:
      - id: A
        text: Increase the number of instances from 4 to 8 to provide more memory for caching
      - id: B
        text: Switch to ml.m5.8xlarge instances to increase memory capacity per instance
      - id: C
        text: Compile all models with SageMaker Neo to reduce model size
      - id: D
        text: Implement routing logic to direct requests for specific models to dedicated instances
      - id: E
        text: Configure auto-scaling to dynamically adjust instance count based on ModelLoadingWaitTime metric
    correctAnswer:
      - B
      - D
    explanation: |
      The two most effective actions are:

      B - Switch to larger instance types: ml.m5.8xlarge instances have 128GB memory vs. 64GB for ml.m5.4xlarge. With
      models ranging from 500MB-2GB, the current setup can cache approximately 25-30 models per instance at best. The
      40% cache hit rate indicates frequent evictions. Larger instances can cache more models simultaneously, reducing
      evictions and improving cache hit rates to 70-80%.

      D - Implement model-to-instance routing: By routing specific models (or groups of related models) to dedicated
      instances, you ensure those models stay cached on their assigned instances. This is particularly effective when
      traffic patterns show certain models are frequently used together. This sticky routing pattern can improve cache
      hit rates to 80-90% for frequently accessed models.

      Why other options are less effective:
      - A: Increasing instance count without addressing memory capacity per instance won't significantly improve caching.
        SageMaker will distribute models across instances, but each instance still has the same memory constraints
      - C: Neo compilation optimizes inference performance but doesn't significantly reduce model artifact size on disk/memory.
        While it may help marginally, it doesn't address the root cause of insufficient cache capacity
      - E: Auto-scaling based on ModelLoadingWaitTime is reactive rather than preventive. It adds capacity after cache
        misses occur, rather than preventing them. The fundamental issue is cache capacity, not scaling speed

      After implementing B and D, monitor ModelCacheHit metric (target: >70%) and ModelLoadingWaitTime (target: <2 seconds).
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/multi-model-endpoint-instance.html
    services:
      - Amazon SageMaker Multi-Model Endpoints
      - Amazon CloudWatch
    concepts:
      - Model caching optimization
      - Instance sizing for multi-model endpoints
      - Model loading performance
      - Traffic routing strategies

  - id: io-006
    type: single
    text: |
      A machine learning team needs to choose an auto-scaling policy for a real-time inference endpoint serving a sentiment
      analysis model. Traffic patterns show gradual increases during business hours with occasional traffic spikes that are
      10x normal volume. The endpoint must maintain P95 latency below 200ms.

      What is the MOST appropriate auto-scaling configuration?
    options:
      - id: A
        text: Step scaling policy with CloudWatch alarms based on CPUUtilization, scaling out 100% when CPU exceeds 80%
      - id: B
        text: Target tracking policy with SageMakerVariantInvocationsPerInstance target of 1000, scale-out cooldown of 300 seconds
      - id: C
        text: Scheduled scaling to increase capacity to 10 instances during business hours, 1 instance off-hours
      - id: D
        text: Target tracking policy with custom ModelLatency metric, targeting P95 latency of 180ms
    correctAnswer: B
    explanation: |
      Target tracking policy with SageMakerVariantInvocationsPerInstance (B) is the most appropriate because:

      1. AWS strongly recommends InvocationsPerInstance as the primary scaling metric for SageMaker endpoints
      2. Target tracking automatically calculates when to scale out/in to maintain target value, handling both gradual
         increases and sudden spikes
      3. 300-second (5-minute) scale-out cooldown allows new instances to warm up before next scaling decision
      4. InvocationsPerInstance is a leading indicator (predicts load) vs. lagging indicators like CPUUtilization
      5. Automatically handles the 10x traffic spikes by scaling proportionally

      The target value of 1000 invocations/minute/instance should be calibrated based on load testing to ensure
      P95 latency remains below 200ms at that load level.

      Why other options are less optimal:
      - A: Step scaling with CPU is reactive (waits for CPU saturation) and may not scale fast enough for 10x spikes.
        CPU is a lagging indicator that rises after requests are already queued
      - C: Scheduled scaling assumes predictable traffic patterns and cannot handle unexpected spikes. The 10x spikes
        mentioned would exceed scheduled capacity
      - D: While latency-based scaling seems intuitive, it's reactive (scales after latency already degraded). Also,
        ModelLatency doesn't include queuing time, so endpoint might be saturated before latency metric reflects it

      Best practice: Combine target tracking on InvocationsPerInstance with CloudWatch alarms on ModelLatency as a
      safety mechanism to detect if scaling isn't keeping up with latency requirements.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling-policy.html
    services:
      - Amazon SageMaker Auto Scaling
      - Application Auto Scaling
      - Amazon CloudWatch
    concepts:
      - Target tracking scaling
      - Auto-scaling metrics selection
      - Cooldown period configuration
      - Scaling policy optimization

  - id: io-007
    type: single
    text: |
      An ML engineer has deployed a PyTorch computer vision model to SageMaker and needs to reduce inference latency from
      the current 150ms to below 50ms without significantly increasing costs. The model is deployed on ml.m5.2xlarge instances
      and receives 500 requests per minute.

      Which combination of optimizations will MOST likely achieve the latency goal?
    options:
      - id: A
        text: Switch to ml.p3.2xlarge GPU instances and enable model caching
      - id: B
        text: Compile the model with SageMaker Neo targeting ml.m5 family and deploy to ml.inf2.xlarge instances
      - id: C
        text: Enable SageMaker Model Monitor to detect and optimize slow inference requests
      - id: D
        text: Deploy the model to a multi-model endpoint to improve caching efficiency
    correctAnswer: B
    explanation: |
      Compiling with Neo and deploying to Inferentia instances (B) will most effectively achieve the latency goal because:

      1. SageMaker Neo compilation typically reduces inference latency 2-5x through:
         - Operator fusion (combining multiple operations into optimized kernels)
         - Constant folding (pre-computing static operations)
         - Framework-specific to hardware-specific optimization
      2. AWS Inferentia instances (ml.inf2.xlarge) provide 30-70% better price-performance than CPU instances
      3. Combined optimization: 150ms baseline → ~30-50ms after Neo compilation + Inferentia acceleration
      4. Cost remains similar or lower: ml.inf2.xlarge costs less than ml.m5.2xlarge

      Implementation approach:
      ```python
      # Compile model with Neo
      compiled_model = pytorch_model.compile(
          target_instance_family='ml_inf2',
          input_shape={'input': [1, 3, 224, 224]},
          framework='pytorch',
          framework_version='1.13'
      )

      # Deploy to Inferentia
      predictor = compiled_model.deploy(
          initial_instance_count=1,
          instance_type='ml.inf2.xlarge'
      )
      ```

      Why other options won't achieve the goal:
      - A: GPU instances are 3-4x more expensive than ml.m5.2xlarge and overkill for this computer vision model. While
        they would reduce latency, the requirement is to not "significantly increase costs"
      - C: Model Monitor is for detecting data drift and model quality issues, not for optimizing inference latency
      - D: Multi-model endpoints share resources across models but don't inherently reduce single-model latency. They're
        for cost optimization when deploying many models, not latency optimization

      The engineer should use Inference Recommender to validate that the optimized configuration meets requirements
      before production deployment.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/neo.html
    services:
      - Amazon SageMaker Neo
      - AWS Inferentia
      - AWS Neuron SDK
    concepts:
      - Model compilation optimization
      - Hardware acceleration
      - Latency optimization techniques
      - Cost-performance balance

  - id: io-008
    type: multi
    correctCount: 3
    text: |
      A company uses SageMaker Inference Recommender to optimize deployment of a new NLP model. The Inference Recommender
      job completed successfully and provided 10 recommendations with varying instance types, configurations, and metrics.

      Which THREE metrics should the team prioritize when selecting the optimal recommendation for a cost-sensitive
      production deployment with a P95 latency SLA of 100ms? (Choose 3)
    options:
      - id: A
        text: CostPerInference metric to understand cost efficiency of each recommendation
      - id: B
        text: MaxInvocations metric to ensure sufficient throughput capacity
      - id: C
        text: LatencyP95 metric to verify the 100ms SLA can be met
      - id: D
        text: ModelSetupTime to minimize cold start delays
      - id: E
        text: CompilationJobName presence to prefer Neo-compiled recommendations
    correctAnswer:
      - A
      - C
      - E
    explanation: |
      The three critical metrics for this scenario are:

      A - CostPerInference: Since the deployment is cost-sensitive, this metric is essential for comparing economic
      efficiency across recommendations. It accounts for both instance costs and throughput, providing cost per 1M
      inferences. The team should filter recommendations meeting the latency SLA, then select the lowest CostPerInference.

      C - LatencyP95: This directly validates whether the recommendation meets the 100ms latency SLA. P95 means 95% of
      requests complete within this time, which is the standard metric for SLA compliance. Any recommendation with
      LatencyP95 > 100ms should be immediately eliminated regardless of cost.

      E - CompilationJobName (Neo-compiled): Inference Recommender automatically includes Neo-compiled recommendations for
      supported frameworks. Neo compilation typically provides 2-5x latency improvement and 20-40% cost reduction without
      accuracy loss. For cost-sensitive deployments, Neo-compiled recommendations almost always offer better price-performance.

      Selection workflow:
      ```python
      # Filter and rank recommendations
      valid_recommendations = [
          rec for rec in recommendations
          if rec['Metrics']['LatencyP95'] <= 100  # Meet SLA
      ]

      # Prefer Neo-compiled recommendations
      neo_compiled = [
          rec for rec in valid_recommendations
          if rec['ModelConfiguration'].get('CompilationJobName')
      ]

      # Sort by cost efficiency
      optimal = sorted(
          neo_compiled if neo_compiled else valid_recommendations,
          key=lambda x: x['Metrics']['CostPerInference']
      )[0]
      ```

      Why other options are secondary:
      - B: MaxInvocations (throughput) is important but should be validated after cost and latency filtering. The team
        can add instances if throughput is insufficient
      - D: ModelSetupTime matters for cold starts but is less critical for production endpoints that stay warm. It's more
        relevant for serverless inference or infrequently used endpoints
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/inference-recommender.html
    services:
      - Amazon SageMaker Inference Recommender
      - Amazon SageMaker Neo
    concepts:
      - Instance selection criteria
      - Cost-performance optimization
      - Latency SLA validation
      - Model compilation benefits

  - id: io-009
    type: single
    text: |
      A retail company runs daily batch scoring of 10 million customer records for product recommendations. Each record
      requires 50ms of model inference time. The batch job must complete within 4 hours to meet business requirements.
      The company wants to minimize costs while meeting the time constraint.

      What is the MOST cost-effective approach?
    options:
      - id: A
        text: Deploy a real-time endpoint with 20 ml.m5.xlarge instances and invoke from AWS Lambda for each record
      - id: B
        text: Use SageMaker Batch Transform with 40 ml.m5.xlarge instances, MultiRecord strategy, and ShardedByS3Key distribution
      - id: C
        text: Deploy an asynchronous inference endpoint with scale-to-zero and process records individually
      - id: D
        text: Deploy a serverless inference endpoint with max concurrency of 200 and invoke for each record
    correctAnswer: B
    explanation: |
      SageMaker Batch Transform with optimized configuration (B) is the most cost-effective because:

      1. Calculation of required capacity:
         - Total inference time: 10M records × 50ms = 500,000 seconds = 139 instance-hours
         - Time constraint: 4 hours
         - Minimum instances needed: 139 / 4 = 35 instances (40 provides buffer)

      2. Batch Transform optimization features:
         - MultiRecord strategy batches multiple records per request, reducing overhead from ~20ms to ~2ms per record
         - ShardedByS3Key distributes data across instances for parallel processing
         - MaxConcurrentTransforms=8 on ml.m5.xlarge (4 vCPUs) enables efficient parallelism
         - No infrastructure runs after job completes (zero idle costs)

      3. Cost calculation:
         - Batch Transform: 40 instances × 4 hours × $0.23/hour = ~$37 per job
         - No additional costs (networking, Lambda, data transfer)

      Configuration example:
      ```python
      transformer = model.transformer(
          instance_count=40,
          instance_type='ml.m5.xlarge',
          strategy='MultiRecord',
          max_concurrent_transforms=8,
          max_payload=6,  # MB
          data_distribution_type='ShardedByS3Key'
      )
      ```

      Why other options are significantly more expensive:
      - A: Real-time endpoint runs 24x7 (720 hours/month) even though batch runs once daily (4 hours).
           Cost: 20 × 720 × $0.23 = $3,312/month vs. $37/job for Batch Transform
      - C: Asynchronous inference designed for individual large requests (up to 1GB), not efficient for 10M small records.
           Per-request overhead and S3 I/O would significantly increase processing time and cost
      - D: Serverless inference has per-request fee ($0.20 per 1M requests = $2) plus compute time.
           Total: $2 + compute ≈ $40-50 per job, similar to Batch Transform but with less predictable performance

      Further optimization: Consider using Spot instances for Batch Transform to reduce costs by up to 70%
      (job is fault-tolerant).
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html
    services:
      - Amazon SageMaker Batch Transform
      - Amazon S3
    concepts:
      - Batch transform optimization
      - Data distribution strategies
      - MultiRecord batching
      - Cost optimization for offline inference

  - id: io-010
    type: single
    text: |
      An ML team deployed a real-time endpoint serving a recommendation model. CloudWatch metrics show:
      - Average ModelLatency: 30ms
      - Average OverheadLatency: 45ms
      - Average total latency: 75ms

      The team needs to reduce total latency to below 50ms. What is the MOST effective optimization approach?
    options:
      - id: A
        text: Optimize the model inference code to reduce ModelLatency below 15ms
      - id: B
        text: Investigate and reduce OverheadLatency through batching and serialization optimization
      - id: C
        text: Deploy the endpoint to a different Availability Zone with lower network latency
      - id: D
        text: Compile the model with SageMaker Neo to reduce overall processing time
    correctAnswer: B
    explanation: |
      Optimizing OverheadLatency (B) is the most effective approach because it constitutes 60% of total latency (45ms out
      of 75ms). OverheadLatency includes:

      1. Network latency (client to endpoint)
      2. Deserialization of input data
      3. Serialization of output data
      4. Request queuing time
      5. Container management overhead

      Optimization strategies for OverheadLatency:

      **Batching optimization:**
      ```python
      # Instead of individual requests
      for item in items:
          response = predictor.predict(item)  # 45ms overhead × N requests

      # Batch multiple items
      batch_response = predictor.predict(items)  # 45ms overhead × 1 request
      ```

      **Serialization optimization:**
      ```python
      # Use efficient serialization formats
      # JSON (slowest): ~15-20ms for serialization
      # CSV (faster): ~5-10ms for serialization
      # Protobuf/RecordIO (fastest): ~2-3ms for serialization

      predictor = Predictor(
          endpoint_name=endpoint_name,
          serializer=CSVSerializer(),  # Faster than JSON
          deserializer=CSVDeserializer()
      )
      ```

      **VPC Endpoint optimization:**
      - Use VPC endpoints (PrivateLink) to reduce network hops
      - Deploy client and endpoint in same AZ

      Expected improvement: 45ms → 15-20ms OverheadLatency, achieving 45-50ms total latency.

      Why other options are less effective:
      - A: ModelLatency is only 30ms (40% of total latency). Reducing it from 30ms to 15ms (50% reduction, which is
           aggressive) only saves 15ms total, resulting in 60ms total latency—still above 50ms target
      - C: Network latency is a component of OverheadLatency but typically only 5-10ms of the 45ms. AZ changes provide
           minimal improvement compared to serialization/batching optimization
      - D: Neo compilation primarily optimizes ModelLatency (the 30ms component), not OverheadLatency. While it would help,
           it doesn't address the larger bottleneck

      Monitor improvements using CloudWatch metrics:
      ```python
      # Track latency breakdown
      metrics = ['ModelLatency', 'OverheadLatency', 'Invocations']
      # Target: OverheadLatency < 20ms, ModelLatency < 30ms, Total < 50ms
      ```
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/monitoring-cloudwatch.html
    services:
      - Amazon SageMaker Real-Time Inference
      - Amazon CloudWatch
    concepts:
      - Latency breakdown analysis
      - Overhead latency optimization
      - Serialization performance
      - Batching strategies

  - id: io-011
    type: multi
    correctCount: 2
    text: |
      A startup has limited ML traffic initially (10 requests/hour) but expects rapid growth. They need a deployment
      strategy that minimizes initial costs while handling potential 100x traffic growth without re-architecture. Their
      latency SLA is flexible (P95 < 2 seconds is acceptable).

      Which TWO deployment strategies best meet these requirements? (Choose 2)
    options:
      - id: A
        text: Deploy to serverless inference with provisioned concurrency to handle traffic growth
      - id: B
        text: Deploy a real-time endpoint with auto-scaling from 1 to 50 instances using target tracking
      - id: C
        text: Start with serverless inference, migrate to real-time endpoints with auto-scaling as traffic increases
      - id: D
        text: Deploy to asynchronous inference with scale-to-zero and auto-scaling enabled
      - id: E
        text: Use SageMaker Batch Transform on a scheduled basis every hour
    correctAnswer:
      - B
      - C
    explanation: |
      The two viable strategies are:

      B - Real-time endpoint with auto-scaling (1 to 50 instances): This single architecture handles the entire growth
      trajectory without re-architecture:

      **Initial phase (10 requests/hour):**
      - 1 instance minimum provides capacity
      - Cost: 1 instance × 730 hours × $0.23 = ~$168/month

      **Growth phase (1,000 requests/hour = 100x growth):**
      - Auto-scaling automatically adds instances as traffic increases
      - Target tracking on InvocationsPerInstance (e.g., target=1000) smoothly scales from 1→10→50 instances
      - No manual intervention or re-architecture needed

      **Configuration:**
      ```python
      predictor = model.deploy(
          initial_instance_count=1,
          instance_type='ml.m5.xlarge'
      )

      # Configure auto-scaling
      client.register_scalable_target(
          MinCapacity=1,
          MaxCapacity=50,
          ...
      )
      ```

      C - Start serverless, migrate to real-time: This staged approach optimizes costs at each phase:

      **Initial phase (10 requests/hour):**
      - Serverless inference: Pay only for compute time (~$0.50-2/month)
      - 10-20 second cold starts acceptable with 2-second SLA
      - Minimal initial investment

      **Growth phase (traffic increases):**
      - Migrate to real-time endpoint when cost crossover occurs (~100-200 requests/hour)
      - Auto-scaling handles continued growth
      - One-time migration effort but optimizes cost throughout lifecycle

      Why other options don't meet requirements:
      - A: Provisioned concurrency keeps instances warm 24x7, eliminating serverless cost benefits. At 10 requests/hour,
           standard serverless (with cold starts) is more cost-effective
      - D: Asynchronous inference is designed for large payloads and longer processing times, not low-latency real-time
           scenarios. The 2-second SLA suggests real-time requirements
      - E: Batch Transform runs on schedule, not on-demand. This doesn't align with the real-time nature implied by
           requests/hour metric and 2-second latency SLA

      **Decision framework:**
      - Traffic < 100 requests/hour → Serverless (if cold starts acceptable)
      - Traffic 100-1000 requests/hour → Real-time with 1-3 instances
      - Traffic > 1000 requests/hour → Real-time with auto-scaling
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/inference-cost-optimization.html

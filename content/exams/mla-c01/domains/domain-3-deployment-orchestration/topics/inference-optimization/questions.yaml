      - Amazon SageMaker Real-Time Inference
    concepts:
      - Cost comparison for variable traffic
      - Latency consistency trade-offs
      - Cold start behavior
      - Serverless vs real-time selection criteria

  - id: io-017
    type: single
    text: |
      A machine learning engineer is configuring auto-scaling for a multi-model endpoint hosting 50 models. CloudWatch
      metrics show that ModelLoadingWaitTime spikes during traffic increases, causing latency violations. The endpoint
      currently uses target tracking auto-scaling with CPUUtilization target of 70%.

      What change will MOST effectively reduce ModelLoadingWaitTime while maintaining cost efficiency?
    options:
      - id: A
        text: Change auto-scaling metric to InvocationsPerInstance with a lower target value
      - id: B
        text: Increase the CPUUtilization target from 70% to 90% to delay scaling
      - id: C
        text: Add a custom metric for ModelLoadingWaitTime and create a step scaling policy
      - id: D
        text: Pre-load all 50 models into memory by increasing instance memory size
    correctAnswer: A
    explanation: |
      Changing the auto-scaling metric to InvocationsPerInstance with a lower target (A) is the most effective solution:

      **Problem analysis:**

      ModelLoadingWaitTime spikes occur because:
      1. Current metric (CPUUtilization) is a lagging indicator - it rises AFTER models are loaded and inferencing
      2. Multi-model endpoints load models from S3 when invoked (if not cached)
      3. During traffic increases, multiple model loads overwhelm instances before CPU shows saturation
      4. By the time CPU hits 70% and triggers scaling, latency violations have already occurred

      **Solution rationale:**

      InvocationsPerInstance is the AWS-recommended metric for multi-model endpoints because:

      1. **Leading indicator**: Predicts load before resource saturation
         - Invocations increase → Auto-scaling triggers → New capacity before latency spikes
         - CPU increases → Already saturated → Latency violations already occurring

      2. **Multi-model endpoint optimization**:
         - Each invocation potentially requires model loading from S3
         - Lower target value (e.g., 400-600) ensures capacity exists before cache thrashing occurs
         - Proactive scaling maintains healthy cache hit rates

      3. **Model loading consideration**:
         - Formula: Target = (Instance_Capacity / Avg_Models_Per_Request) * Cache_Hit_Rate
         - Example: 1000 req/min capacity, 2 models avg, 70% cache = 1000 / 2 * 0.7 = 350 target

      **Implementation:**
      ```python
      asg_client.put_scaling_policy(
          PolicyName='mme-invocations-scaling',
          ServiceNamespace='sagemaker',
          ResourceId=f'endpoint/{endpoint_name}/variant/AllTraffic',
          ScalableDimension='sagemaker:variant:DesiredInstanceCount',
          PolicyType='TargetTrackingScaling',
          TargetTrackingScalingPolicyConfiguration={
              'TargetValue': 500.0,  # Lower target for multi-model endpoints
              'PredefinedMetricSpecification': {
                  'PredefinedMetricType': 'SageMakerVariantInvocationsPerInstance'
              },
              'ScaleInCooldown': 900,  # Longer to preserve cache warmth
              'ScaleOutCooldown': 300  # Standard scale-out
          }
      )
      ```

      **Expected improvements:**
      - ModelLoadingWaitTime: Reduces from 2-5 seconds to <500ms
      - ModelCacheHit: Increases from 60-70% to 80-90%
      - P95 Latency: More consistent, fewer spikes

      **Why other options are incorrect:**

      B - Increase CPU target to 90% (WRONG):
      - This delays scaling even further, worsening the problem
      - Multi-model endpoints experience cache thrashing before CPU saturation
      - Would increase ModelLoadingWaitTime and latency violations
      - Moves in opposite direction of solution

      C - Custom metric with step scaling (LESS EFFECTIVE):
      - ModelLoadingWaitTime is a reactive metric (problem already occurring)
      - Step scaling adds complexity vs. target tracking
      - Doesn't address root cause of late scaling decisions
      - AWS documentation explicitly recommends InvocationsPerInstance, not custom metrics

      D - Pre-load all models (INEFFICIENT AND COSTLY):
      - 50 models may exceed instance memory capacity
      - Multi-model endpoint design is based on dynamic loading, not pre-loading
      - Would require very large (expensive) instances
      - Defeats the cost optimization purpose of multi-model endpoints
      - Not scalable as model count grows

      **Additional monitoring:**
      ```python
      # Create CloudWatch alarm for ModelLoadingWaitTime as safety net
      cloudwatch.put_metric_alarm(
          AlarmName='high-model-loading-wait-time',
          MetricName='ModelLoadingWaitTime',
          Namespace='AWS/SageMaker',
          Statistic='Average',
          Period=300,
          EvaluationPeriods=2,
          Threshold=2000,  # 2 seconds
          ComparisonOperator='GreaterThanThreshold',
          Dimensions=[
              {'Name': 'EndpointName', 'Value': endpoint_name},
              {'Name': 'VariantName', 'Value': 'AllTraffic'}
          ]
      )
      ```

      This provides visibility if InvocationsPerInstance scaling isn't sufficient, but the primary scaling mechanism
      should be InvocationsPerInstance target tracking.

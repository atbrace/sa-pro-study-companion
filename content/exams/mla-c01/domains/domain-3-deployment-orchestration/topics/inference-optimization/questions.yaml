  - id: io-015
    type: single
    text: |
      A team deployed a model to a real-time endpoint and configured target tracking auto-scaling with
      InvocationsPerInstance target of 1000, scale-out cooldown of 300 seconds, and scale-in cooldown of 600 seconds.

      During testing, they observe that when traffic suddenly spikes from 500 to 3000 requests/minute, the endpoint
      experiences elevated latency (P95 jumps from 80ms to 450ms) for approximately 15 minutes before returning to normal.

      What is the MOST likely cause and solution?
    options:
      - id: A
        text: The target value of 1000 is too high; reduce it to 500 to trigger scaling earlier
      - id: B
        text: The scale-out cooldown of 300 seconds is too long; reduce it to 60 seconds for faster scaling
      - id: C
        text: New instances take time to warm up; implement Least Outstanding Requests routing strategy
      - id: D
        text: The instance type is undersized; migrate to a larger instance type with more memory
    correctAnswer: C
    explanation: |
      The issue is instance warm-up time, and implementing Least Outstanding Requests (LOR) routing (C) is the solution:

      **Root cause analysis:**

      1. **Traffic spike behavior:**
         - Initial: 500 req/min ÷ 1000 target = 0.5 instances (rounds to 1 instance)
         - Spike: 3000 req/min ÷ 1000 target = 3 instances needed
         - Auto-scaling triggers correctly and launches 2 additional instances

      2. **Warm-up period problem:**
         - New instances require 5-10 minutes to warm up (container start, model loading, JIT compilation)
         - During warm-up, new instances process requests slowly or not at all
         - All traffic continues to hit the original instance, causing latency spike
         - After warm-up (10-15 minutes), instances are ready and latency normalizes

      3. **LOR routing solution:**
         - Default routing distributes requests equally across instances
         - LOR routing sends requests to instances with fewest pending requests
         - Automatically reduces load on warm-up instances that are slow to respond
         - Existing warm instances handle more traffic until new instances are ready
         - Reduces latency spikes by 50-70% during scale-out events

      **Implementation:**
      ```python
      # Update endpoint configuration with LOR routing
      sagemaker.create_endpoint_config(
          EndpointConfigName='endpoint-config-with-lor',
          ProductionVariants=[
              {
                  'VariantName': 'AllTraffic',
                  'ModelName': model_name,
                  'InitialInstanceCount': 1,
                  'InstanceType': 'ml.m5.xlarge',
                  'RoutingConfig': {
                      'RoutingStrategy': 'LEAST_OUTSTANDING_REQUESTS'
                  }
              }
          ]
      )

      # Update endpoint to use new config
      sagemaker.update_endpoint(
          EndpointName=endpoint_name,
          EndpointConfigName='endpoint-config-with-lor'
      )
      ```

      **Why other options don't solve the problem:**

      - A: Lowering target to 500 would cause scaling to trigger at 500 req/min instead of 1000 req/min, but doesn't
           address the warm-up problem. New instances would still take 10-15 minutes to be ready, and you'd experience
           the same latency spike at 500 req/min (just at a lower threshold). Plus, it would keep more instances running
           during normal traffic, increasing costs by 50-100%

      - B: Scale-out cooldown prevents rapid consecutive scaling events that cause thrashing. Reducing it to 60 seconds
           is counterproductive because:
           - Instances take 10-15 minutes to warm up, so 60 seconds is too short to assess if scaling worked
           - Would trigger additional scaling before first batch is ready, wasting resources
           - Doesn't address fundamental warm-up latency issue
           - Best practice: cooldown should be ≥ instance warm-up time

      - D: The latency spike is temporary (15 minutes) and resolves when scaling completes. This indicates a scaling
           dynamic issue, not instance size issue. If instances were undersized, latency would remain high even after
           scaling completed. The P95 latency of 80ms during normal operation confirms instances are appropriately sized

      **Additional optimization - pre-warming strategy:**
      ```python
      # In inference.py - warm up model during container startup
      def model_fn(model_dir):
          model = load_model(model_dir)
          model.eval()

          # Warm up with dummy requests
          dummy_input = create_dummy_input()
          for _ in range(10):  # Multiple iterations to warm up JIT compiler
              with torch.no_grad():
                  _ = model(dummy_input)

          return model
      ```

      **Expected improvement:**
      - LOR routing reduces latency spike from 450ms to 150-200ms (60% improvement)
      - Spike duration reduces from 15 minutes to 5-8 minutes
      - Better distribution of load during scale-out events
    awsDocLink: https://aws.amazon.com/blogs/machine-learning/minimize-real-time-inference-latency-by-using-amazon-sagemaker-routing-strategies/
    services:
      - Amazon SageMaker Real-Time Inference
      - Application Auto Scaling
    concepts:
      - Routing strategies
      - Auto-scaling warm-up behavior
      - Least Outstanding Requests routing
      - Scale-out performance optimization

  - id: io-016
    type: multi
    correctCount: 2
    text: |
      An ML engineer is comparing serverless inference and real-time inference for a new model deployment. The model has
      the following characteristics:
      - Model size: 800MB
      - Inference time: 150ms per request
      - Traffic pattern: 20-200 requests per hour, highly variable
      - Latency SLA: P95 < 5 seconds

      Which TWO statements are TRUE regarding the cost and performance trade-offs? (Choose 2)
    options:
      - id: A
        text: Serverless inference will be more cost-effective, saving 70-90% compared to real-time inference
      - id: B
        text: Real-time inference with auto-scaling will provide more consistent P95 latency
      - id: C
        text: Serverless inference requires 2GB memory configuration for the 800MB model
      - id: D
        text: Real-time inference will handle traffic spikes faster due to provisioned capacity
      - id: E
        text: Serverless inference cold start latency will violate the 5-second SLA
    correctAnswer:
      - A
      - B
    explanation: |
      The two true statements are:

      A - Serverless inference cost advantage (TRUE):

      **Cost comparison:**
      ```python
      # Real-time inference (ml.m5.large: $0.115/hour)
      real_time_monthly_cost = 0.115 * 730  # Always running
      # = $83.95/month

      # Serverless inference (2GB memory: $0.00003333/ms per GB)
      # Average traffic: ~110 requests/hour, 150ms each
      # Monthly requests: 110 * 730 = 80,300 requests
      # Compute time: 80,300 * 0.15 seconds * 2 GB
      serverless_compute = (80300 * 150 / 1000) * (0.00003333 * 2)
      # = 12,045 GB-seconds * $0.00003333 = $0.80

      # Request fees: 80,300 * $0.000020 = $1.61
      serverless_total = $0.80 + $1.61 = $2.41/month

      # Savings: ($83.95 - $2.41) / $83.95 = 97% cost reduction
      ```

      With highly variable, low-volume traffic (20-200 req/hour), serverless inference saves 90%+ in costs because:
      - No idle time charges (real-time endpoint runs 24x7 regardless of traffic)
      - Pay only for actual inference compute time
      - Automatic scale-to-zero during idle periods

      B - Real-time inference latency consistency (TRUE):

      **Latency characteristics:**

      Real-time inference with auto-scaling:
      - Warm instances: P95 latency = 150ms + 30ms overhead = ~180ms (consistent)
      - New instance warm-up: 5-10 minutes but LOR routing mitigates impact
      - Consistent sub-second P95 latency once scaled

      Serverless inference:
      - Warm instances: P95 latency = 150ms + 50ms overhead = ~200ms
      - Cold start: 10-20 seconds (highly variable based on model size)
      - P95 latency varies between 200ms (warm) and 15 seconds (cold)
      - Cold start frequency depends on traffic pattern and idle timeout

      For applications requiring consistent latency (e.g., user-facing APIs), real-time inference provides predictable
      performance. For applications tolerant of occasional multi-second latencies, serverless is acceptable.

      **Why other statements are FALSE:**

      C - Memory configuration requirement (FALSE):
      - AWS recommends memory size ≥ model size, so 1024MB (1GB) would suffice for 800MB model
      - 2GB provides more headroom but isn't strictly required
      - Memory should be sized based on model size + overhead + request processing needs
      - Could test 1024MB, 2048MB, 3072MB with Serverless Inference Benchmarking Toolkit

      D - Traffic spike handling (FALSE):
      - Serverless inference automatically scales within 30-60 seconds, similar to real-time auto-scaling
      - Real-time endpoint requires scale-out cooldown (300 seconds typical) before adding more instances
      - Serverless can scale out faster for sudden spikes because it doesn't have cooldown constraints
      - Both have warm-up delays for new capacity, but serverless is more elastic

      E - Cold start violating SLA (FALSE):
      - Serverless cold starts are typically 10-20 seconds for 800MB model
      - 5-second SLA allows for occasional cold starts (P95 means 95% of requests, so 5% can be slower)
      - If traffic is 100 requests/hour, approximately 5 requests/hour could experience cold starts
      - With provisioned concurrency, cold starts can be eliminated entirely if needed

      **Recommendation for this scenario:**
      Given the 5-second SLA flexibility and highly variable traffic, serverless inference is optimal. The 90%+ cost
      savings outweigh occasional cold starts, and the P95 SLA accommodates the cold start distribution.

      If consistent latency becomes critical:
      ```python
      # Add provisioned concurrency to warm 1-2 instances
      serverless_config = ServerlessInferenceConfig(
          memory_size_in_mb=2048,
          max_concurrency=20,
          provisioned_concurrency=2  # Keep 2 instances warm
      )
      # Cost increases to ~$10-15/month but still 80% cheaper than real-time
      ```
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html

  - id: io-012
    type: single
    text: |
      A company has three models in a deployment: a scikit-learn preprocessing model (50MB), a PyTorch inference model
      (2GB), and a custom TensorFlow post-processing model (100MB). They currently deploy these as three separate real-time
      endpoints. The preprocessing model receives 1000 requests/hour, but only 200 of those proceed to inference (filtering),
      and all inference results go through post-processing.

      How should the team optimize this deployment for cost and latency?
    options:
      - id: A
        text: Deploy all three models to a multi-model endpoint using Triton Inference Server
      - id: B
        text: Deploy preprocessing and inference as a serial inference pipeline, keep post-processing separate
      - id: C
        text: Deploy all three models as a serial inference pipeline using multi-container endpoints
      - id: D
        text: Keep separate endpoints but use multi-container endpoints for preprocessing and inference only
    correctAnswer: C
    explanation: |
      Deploying all three models as a serial inference pipeline (C) is optimal because:

      1. **Pipeline efficiency**: Multi-container serial inference pipelines automatically chain containers where output
         from one becomes input to the next:
         - Request → Preprocessing (scikit-learn) → Inference (PyTorch) → Post-processing (TensorFlow) → Response
         - Single endpoint invocation, eliminating 2 additional network round-trips
         - Reduced total latency: 3× network overhead eliminated (60-90ms saved)

      2. **Cost optimization**:
         - Current: 3 endpoints × (instance cost) = 3× infrastructure cost
         - Pipeline: 1 endpoint with 3 containers sharing infrastructure = 1× cost
         - Potential savings: 60-70% reduction in hosting costs

      3. **Framework diversity support**: Multi-container endpoints support up to 15 containers, each with different
         frameworks (scikit-learn, PyTorch, TensorFlow)—perfect for this heterogeneous stack

      4. **Traffic efficiency**: The 80% filtering (1000→200 requests) happens before inference, so inference and
         post-processing containers process fewer requests, balancing container resource utilization

      **Implementation:**
      ```python
      from sagemaker.model import Model
      from sagemaker.pipeline import PipelineModel

      preprocessing_model = Model(
          image_uri=sklearn_container,
          model_data='s3://bucket/preprocessing.tar.gz',
          role=role
      )

      inference_model = Model(
          image_uri=pytorch_container,
          model_data='s3://bucket/inference.tar.gz',
          role=role
      )

      postprocessing_model = Model(
          image_uri=tensorflow_container,
          model_data='s3://bucket/postprocessing.tar.gz',
          role=role
      )

      pipeline = PipelineModel(
          models=[preprocessing_model, inference_model, postprocessing_model],
          role=role,
          name='end-to-end-pipeline'
      )

      predictor = pipeline.deploy(
          initial_instance_count=2,
          instance_type='ml.m5.2xlarge'  # Sufficient for 2GB inference model
      )
      ```

      Why other options are suboptimal:
      - A: Multi-model endpoints require all models to use the SAME framework. This scenario has three different frameworks
           (scikit-learn, PyTorch, TensorFlow), making MME incompatible
      - B: Keeping post-processing separate maintains two endpoints instead of one, retaining 1 network round-trip overhead
           and higher operational complexity
      - D: Multi-container endpoints used for parallel invocation (not serial pipeline) doesn't optimize the sequential
           processing flow. Also still maintains 2 separate deployments

      **Additional benefits:**
      - Simplified operations: One endpoint to manage vs. three
      - Unified monitoring: Single set of CloudWatch metrics
      - Atomic deployments: Update entire pipeline together
      - Better resource utilization: Containers share instance resources
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/multi-container-endpoints.html

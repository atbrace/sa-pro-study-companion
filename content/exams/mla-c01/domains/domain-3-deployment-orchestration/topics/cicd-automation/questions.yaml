  - id: cicd-012
    type: single
    text: |
      A company has production models deployed in multiple AWS regions (us-east-1, eu-west-1, ap-southeast-1) to serve global customers with low latency. Models are trained centrally in us-east-1 and registered in Model Registry. When a model is approved, it should be automatically deployed to endpoints in all three regions.

      What is the MOST scalable approach for multi-region deployment?
    options:
      - id: A
        text: Create EventBridge rules in us-east-1 that trigger when model status changes to Approved. The rule invokes a Lambda function that copies model artifacts to S3 buckets in each region, then starts CodePipeline executions in each region to deploy the model.
      - id: B
        text: Use AWS Systems Manager Parameter Store to store the approved model version. Schedule Lambda functions in each region to poll Parameter Store hourly and deploy new versions when detected.
      - id: C
        text: Create separate Model Registry instances in each region. Train models in us-east-1, then manually copy model artifacts and register in each region's Model Registry before deploying.
      - id: D
        text: Use AWS Global Accelerator to route traffic to a single endpoint in us-east-1, eliminating the need for multi-region deployments.
    correctAnswer: A
    explanation: |
      Option A implements an event-driven, automated multi-region deployment pattern:

      EventBridge in us-east-1 monitors Model Registry for "SageMaker Model Package State Change" events where ModelApprovalStatus changes to "Approved". Lambda function triggered by this event: retrieves model artifacts from S3 in us-east-1, copies artifacts to regional S3 buckets in eu-west-1 and ap-southeast-1 using S3 cross-region replication or boto3 copy operations, invokes StartPipelineExecution API in each target region's CodePipeline (or uses EventBridge cross-region event bus), and logs deployment status.

      Each region's CodePipeline then deploys the model using region-local infrastructure (endpoints, endpoint configs). This approach provides: automation (no manual steps after approval), consistency (same model version deployed everywhere), auditability (CloudTrail logs all deployment steps), and scalability (adding regions requires adding CodePipeline stacks and updating Lambda function region list).

      Option B uses inefficient polling (hourly delays, wasted Lambda invocations) instead of event-driven architecture. Deployments lag approval by up to an hour, and Parameter Store doesn't provide the same richness as Model Registry for tracking model metadata.

      Option C is entirely manual ("manually copy model artifacts") and doesn't scale. Deploying to 3 regions requires 3 manual copy/register operations. Adding more regions increases operational burden linearly. This approach is error-prone (forgetting a region, version mismatches) and slow.

      Option D misunderstands the requirement. Multi-region deployment is for latency (serve customers from nearby regions) and availability (survive regional failures). Global Accelerator improves routing to endpoints but doesn't reduce latency for requests traveling to us-east-1 from Singapore (still crosses the Pacific). For ML inference where latency matters, regional endpoints are necessary.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html
    services:
      - Amazon EventBridge
      - AWS Lambda
      - Amazon S3
      - AWS CodePipeline
      - Amazon SageMaker Model Registry
    concepts:
      - Multi-region deployment
      - Event-driven architecture
      - Artifact replication
      - Global model distribution

  - id: cicd-013
    type: single
    text: |
      A compliance team requires that all deployed ML models can be reproduced exactly from source. This includes the ability to identify the exact training code version, training data version, and hyperparameters used for any model in production. The solution must support audits going back 5 years.

      Which approach provides the MOST complete model reproducibility and lineage tracking?
    options:
      - id: A
        text: Use SageMaker Pipelines with source code stored in CodeCommit. Configure the pipeline to tag model artifacts in S3 with Git commit SHA, data version, and hyperparameters. Enable S3 versioning and lifecycle policies to retain artifacts for 5 years.
      - id: B
        text: Use SageMaker Model Registry to register all models, associating training job ARN with each model version. Enable SageMaker Lineage Tracking to automatically capture relationships between datasets, training jobs, models, and endpoints. Store training code in Git with commit SHAs recorded in model metadata. Configure S3 and CloudTrail log retention for 5 years.
      - id: C
        text: Create a DynamoDB table that records training job configurations. After each training job, write a record with timestamp, S3 data paths, hyperparameters, and resulting model location. Enable DynamoDB point-in-time recovery for 5 years.
      - id: D
        text: Use AWS CloudFormation to define all training infrastructure including training job parameters. Store CloudFormation templates in Git with tags for each deployment. Enable CloudTrail logging with 5-year retention.
    correctAnswer: B
    explanation: |
      Option B leverages SageMaker's purpose-built lineage capabilities for complete reproducibility:

      SageMaker Lineage Tracking automatically creates a directed acyclic graph (DAG) of relationships: S3 dataset URIs → Processing Job (feature engineering) → Training Job (with hyperparameters, code, instance type) → Model Artifacts → Model Registry Version → Endpoint. This graph is queryable via API to answer "What data trained this model?" and "Where is this dataset used?"

      Model Registry stores immutable model versions with metadata including training job ARN, approval status, and custom properties (Git commit SHA, data version). The training job ARN links to full job details (code location, hyperparameters, instance configuration, VPC settings) stored indefinitely by SageMaker.

      Git commit SHAs in model metadata enable retrieving exact training code from repository history. Combined with S3 versioning (retains exact training data files) and CloudTrail logs (who deployed, when, what changed), this provides end-to-end reproducibility: retrieve model from registry → find training job ARN → get hyperparameters and Git SHA → checkout code from Git → retrieve data from S3 versioned bucket → re-run training job.

      This satisfies audit requirements: 5+ year retention (SageMaker metadata retained indefinitely, S3/CloudTrail configured for 5 years), immutability (lineage graph and model registry are append-only), completeness (captures all inputs to model creation), and automation (lineage captured automatically, not manually recorded).

      Option A captures some metadata (tags on S3 objects) but doesn't provide the queryable lineage graph or integration with Model Registry for approval workflows. S3 tags alone don't capture the full relationship graph (which endpoints use which models, which jobs created which artifacts).

      Option C reinvents lineage tracking poorly. DynamoDB requires manual record creation (prone to errors/omissions), doesn't capture the full relationship graph (endpoints, preprocessing jobs), and requires custom code to query and reconstruct lineage.

      Option D focuses on infrastructure reproducibility, not model reproducibility. CloudFormation templates describe training job parameters, but don't capture which training jobs actually ran, what data they used, or the lineage from data to deployed model.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html
    services:
      - Amazon SageMaker Lineage Tracking
      - Amazon SageMaker Model Registry
      - AWS CodeCommit
      - Amazon S3
      - AWS CloudTrail
    concepts:
      - Model reproducibility
      - Lineage tracking
      - Audit compliance
      - Metadata management

  - id: cicd-014
    type: multi
    correctCount: 2
    text: |
      A company wants to implement A/B testing for a recommendation model. The current production model (Version 1) serves 100% of traffic. A new model (Version 2) has shown 15% improvement in offline evaluation. The team wants to validate the improvement with real traffic by serving Version 2 to 20% of users, monitoring business metrics for 7 days, then fully rolling out if metrics are favorable.

      Which TWO steps are required to implement this A/B test? (Select TWO)
    options:
      - id: A
        text: >
          Create a new endpoint configuration with two production variants:
          variant A with Version 1 model at 80% initial weight, and variant B
          with Version 2 model at 20% initial weight. Update the production
          endpoint to use this configuration.
      - id: B
        text: Deploy Version 2 to a separate endpoint. Modify the application code to randomly route 20% of requests to the new endpoint and 80% to the current endpoint. Track which users received which model for metric calculation.
      - id: C
        text: Configure SageMaker Data Capture on the endpoint to record inputs and outputs from both variants, enabling analysis of model predictions and calculation of variant-specific business metrics.
      - id: D
        text: Create a CloudWatch Logs Insights query that filters requests by variant name from endpoint invocation logs, aggregating metrics separately for each variant.
      - id: E
        text: Use AWS Lambda@Edge with CloudFront to route requests based on user cookies, ensuring each user consistently sees the same model variant throughout the test period.
    correctAnswer: [A, C]
    explanation: |
      Options A and C together enable production A/B testing:

      Option A: SageMaker endpoint production variants enable A/B testing without application code changes. Create EndpointConfig with ProductionVariants array containing two variants: {ModelName: "version-1", VariantName: "variant-a", InitialInstanceCount: 2, InstanceType: "ml.m5.xlarge", InitialVariantWeight: 0.8} and {ModelName: "version-2", VariantName: "variant-b", InitialInstanceCount: 1, InstanceType: "ml.m5.xlarge", InitialVariantWeight: 0.2}.

      When the endpoint receives requests, SageMaker automatically routes 80% to variant-a and 20% to variant-b based on weights. The InvokeEndpoint response includes the TargetVariant field indicating which variant served the request. After 7 days, if metrics favor variant-b, update InitialVariantWeight to {variant-a: 0, variant-b: 1.0} to fully roll out Version 2.

      Option C: Data Capture is essential for A/B analysis. Configuration: {EnableCapture: true, CaptureOptions: [InputAndOutput], DestinationS3Uri: "s3://bucket/data-capture/"}. SageMaker writes JSONL files to S3 containing request inputs, model outputs, timestamp, and variant name. Analysts query this data with Athena to calculate variant-specific metrics (click-through rate, conversion rate, revenue per user). Without Data Capture, the team would need custom logging in application code.

      Option B reinvents SageMaker's built-in capability and requires application code changes. Deploying separate endpoints and modifying routing logic increases operational complexity (managing two endpoints, implementing load balancing) and creates opportunities for bugs (routing logic errors, state synchronization).

      Option D is unnecessary if Data Capture (Option C) is enabled. Data Capture provides structured data in S3 for analysis. CloudWatch Logs Insights would require parsing unstructured log messages, which is more complex than querying structured S3 data with Athena.

      Option E is overengineered for this use case. SageMaker production variants already provide request routing. Lambda@Edge adds latency and cost. If sticky sessions (same user sees same variant) are required, implement variant selection in application code based on user ID hash, not Lambda@Edge.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/model-ab-testing.html
    services:
      - Amazon SageMaker Endpoints
      - Amazon SageMaker Data Capture
    concepts:
      - A/B testing
      - Production variants
      - Traffic splitting
      - Data capture
      - Business metrics

  - id: cicd-015
    type: single
    text: |
      An MLOps team manages SageMaker Pipelines using infrastructure-as-code. They define pipelines in Python SDK code stored in Git. When pipeline definitions change, they want automated validation that the pipeline is syntactically correct and all referenced resources (S3 buckets, IAM roles, ECR images) exist before deploying to production.

      What is the MOST effective validation approach?
    options:
      - id: A
        text: In the CodeBuild build phase, execute the Python pipeline definition script to generate the pipeline JSON definition. Use aws sagemaker describe-pipeline to check if a pipeline with that name already exists. If it exists, use update-pipeline; otherwise use create-pipeline. SageMaker will validate the definition when creating/updating.
      - id: B
        text: Create a development SageMaker Pipeline instance. In the CodeBuild build phase, use update-pipeline to deploy the new definition to the development pipeline and immediately start an execution with skip-model-training=true to validate the pipeline runs without errors.
      - id: C
        text: Write unit tests using pytest that import the pipeline definition code, generate the JSON, and validate the structure against a JSON schema. In the build phase, run pytest to validate syntax. Use AWS CloudFormation drift detection to verify referenced resources exist.
      - id: D
        text: In the CodeBuild build phase, execute the pipeline definition script to generate the JSON. Validate JSON syntax with a parser. Query AWS APIs to verify referenced resources exist (boto3 describe-bucket for S3, get-role for IAM, describe-images for ECR). Only proceed to deployment if all validations pass.
    correctAnswer: D
    explanation: |
      Option D provides comprehensive pre-deployment validation:

      The build phase validation workflow:
      1. Execute pipeline definition Python script (imports SageMaker SDK, defines steps, calls Pipeline(...).definition())
      2. Catch Python exceptions (syntax errors, undefined variables, import errors)
      3. Parse generated JSON to validate structure (valid JSON, required fields present)
      4. Extract resource references from JSON (S3 URIs, IAM role ARNs, ECR image URIs)
      5. Validate each resource exists and is accessible:
         - S3 buckets: boto3 s3.head_bucket(Bucket=bucket_name)
         - IAM roles: boto3 iam.get_role(RoleName=role_name)
         - ECR images: boto3 ecr.describe_images(repositoryName=repo, imageIds=[...])
      6. Validate execution role has permissions to access resources
      7. Only if all checks pass, proceed to deploy pipeline to production

      This prevents deployment of broken pipelines. Without validation, pipeline update succeeds but execution fails at runtime when it can't access missing S3 buckets or ECR images. Runtime failures waste compute and delay data scientists. Pre-deployment validation provides fast feedback in the build phase.

      Option A relies on SageMaker's validation, which checks JSON structure but doesn't validate that referenced resources exist. Pipeline update will succeed even if the S3 bucket doesn't exist - the failure only occurs when the pipeline executes. This delays error detection.

      Option B validates the pipeline works but is expensive and slow. Running a full pipeline execution (even with skip-model-training) takes minutes and consumes compute resources. This makes the build phase slow, delaying deployments. It also requires maintaining a separate development pipeline instance. Pre-deployment resource validation (Option D) achieves similar validation in seconds with API calls.

      Option C validates JSON schema but doesn't verify referenced resources exist. CloudFormation drift detection doesn't apply here - pipelines aren't CloudFormation resources, they're SageMaker API resources. Unit tests catch code-level errors but miss infrastructure errors (deleted S3 bucket, rotated ECR image).
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/build-and-manage-pipeline.html
    services:
      - Amazon SageMaker Pipelines
      - AWS CodeBuild
      - AWS Lambda
    concepts:
      - Pipeline validation
      - Pre-deployment checks
      - Infrastructure validation
      - CI best practices

  - id: cicd-016
    type: single
    text: |
      A financial services company requires that when models are rejected during approval review, the rejection must include a documented reason, and the model must not be eligible for resubmission until code or data changes have been made. The system should prevent reviewers from approving previously rejected model versions.

      How should this governance workflow be implemented?
    options:
      - id: A
        text: When a model is rejected, update the Model Registry approval status to "Rejected" with a rejection reason in the custom metadata field. Configure EventBridge to trigger a Lambda function that adds the model version to a DynamoDB "rejected versions" table. Modify the approval workflow Lambda to check this table and prevent status changes from Rejected to Approved.
      - id: B
        text: Use SageMaker Model Cards to document rejection reasons. When a model is rejected, create a Model Card with the rejection details. Configure IAM policies to prevent anyone from changing a model's approval status from Rejected to Approved.
      - id: C
        text: Store rejection reasons in CloudWatch Logs. Configure AWS Config rules to detect when a model's approval status changes from Rejected to Approved and automatically revert the change.
      - id: D
        text: When rejecting a model, delete it from Model Registry entirely and require data scientists to register a new version after making changes.
    correctAnswer: A
    explanation: |
      Option A implements proper governance with auditability and enforcement:

      Model Registry supports approval status values including "Rejected". The custom metadata (ModelApprovalStatus, RejectionReason) captures why the model failed review (poor accuracy, data quality issues, business impact concerns). This metadata is immutable once set, creating an audit trail.

      EventBridge monitors for state changes to "Rejected" and triggers Lambda. Lambda writes record to DynamoDB: {ModelPackageGroupName, ModelPackageVersion, RejectionReason, RejectedBy, RejectedAt, Status: "Rejected"}. This creates a durable, queryable record of all rejections.

      The approval workflow (human reviewer clicks approve link → API Gateway → Lambda) includes logic that queries DynamoDB for the model version. If the version exists with Status="Rejected" AND no code/data changes have occurred (validate by checking Git commit SHA or data version in current metadata vs. rejected metadata), the Lambda returns HTTP 403 with message "Model version was previously rejected. Register new version after making changes."

      This prevents approval of rejected models while allowing new training runs with updated code/data to create new versions that can be reviewed independently.

      Option B uses Model Cards incorrectly. Model Cards are for documentation and transparency (model purpose, training data, fairness metrics), not workflow enforcement. IAM policies can't distinguish between "initial Rejected status" and "someone trying to reapprove a previously rejected model" - they would block all approvals.

      Option C is detective rather than preventive. AWS Config detects the inappropriate status change after it happens, then reverts it. This creates a window where the model appears approved and might trigger deployments. Preventive controls (Option A) are superior.

      Option D is destructive and prevents audit trails. Deleting rejected models removes the historical record of what was tried and why it failed. Teams can't learn from past rejections or track improvement over time. Model versions should be retained indefinitely for compliance and lineage.
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html
    services:
      - Amazon SageMaker Model Registry
      - Amazon EventBridge
      - AWS Lambda
      - Amazon DynamoDB
    concepts:
      - Model governance
      - Rejection workflows
      - Audit trails
      - Approval enforcement

  - id: cicd-017
    type: multi
    correctCount: 3
    text: |
      A company operates in a regulated industry requiring that all ML deployments undergo change management approval. The change management system is a third-party ticketing tool with a REST API. When a model is approved in SageMaker Model Registry, a change ticket must be automatically created. Deployment to production can only proceed after the change ticket is approved in the external system.

      Which THREE components are required for this integration? (Select THREE)
    options:
      - id: A
        text: EventBridge rule that triggers when a model's approval status changes to "Approved" in Model Registry, invoking a Lambda function that creates a change ticket in the external system via its REST API.
      - id: B
        text: CodePipeline approval stage configured with an SNS notification action that sends change details to the ticketing system and waits for approval callback.
      - id: C
        text: API Gateway endpoint that receives webhook callbacks from the external ticketing system when change tickets are approved. The endpoint invokes a Lambda function that retrieves the approved change ticket details and triggers CodePipeline execution for deployment.
      - id: D
        text: AWS Systems Manager OpsCenter to mirror all change tickets from the external system for reporting purposes.
      - id: E
        text: Lambda function that polls the ticketing system API every 5 minutes to check for approved change tickets and triggers deployments when approvals are found.
      - id: F
        text: Secrets Manager secret containing API credentials for the external ticketing system, accessed by Lambda functions that integrate with the system.
    correctAnswer: [A, C, F]
    explanation: |
      Options A, C, and F create a complete event-driven integration:

      Option A: EventBridge rule monitors for "SageMaker Model Package State Change" events where ModelApprovalStatus="Approved". Lambda function is triggered, retrieves model metadata (version, metrics, training details) from Model Registry, constructs change ticket payload, authenticates to external system using credentials from Secrets Manager, POSTs ticket to REST API, stores correlation data (ticket ID ↔ model ARN) in DynamoDB for later callback handling.

      Option C: External ticketing system sends webhook when tickets are approved. API Gateway provides HTTP endpoint for webhooks with authentication (API key or IAM auth). Lambda function handles webhook: validates signature/authentication, retrieves ticket details from payload, queries DynamoDB for corresponding model ARN using ticket ID, starts CodePipeline execution with model ARN as parameter. CodePipeline then deploys the approved model.

      Option F: External system API requires authentication (API key, OAuth token). Storing credentials in Secrets Manager provides: secure storage (encrypted with KMS), automatic rotation capabilities, audit logging (CloudTrail logs secret access), centralized management. Lambda functions retrieve credentials with boto3 get_secret_value() when integrating with the ticketing system.

      Together, these create the workflow: Model Approved → EventBridge → Lambda → Create Ticket → (external review) → Ticket Approved → Webhook → API Gateway → Lambda → Trigger CodePipeline → Deploy.

      Option B misunderstands CodePipeline approval actions. CodePipeline approval actions support SNS notifications and manual approvals in the AWS console or CLI, but they don't support webhook callbacks from external systems. The approval action would block indefinitely waiting for approval through AWS mechanisms.

      Option D adds unnecessary complexity. OpsCenter is for operational issue management, not change ticket mirroring. It doesn't contribute to the integration workflow and creates data synchronization challenges.

      Option E uses inefficient polling instead of event-driven webhooks. Polling adds latency (average 2.5 minute delay), wastes Lambda invocations (most polls find no new approvals), and doesn't scale well (100 models/day means 28,800 Lambda invocations for 5-minute polling vs. 100 webhook deliveries).
    awsDocLink: https://docs.aws.amazon.com/sagemaker/latest/dg/automating-sagemaker-with-eventbridge.html
    services:
      - Amazon EventBridge
      - AWS Lambda
      - Amazon API Gateway
      - AWS Secrets Manager
      - AWS CodePipeline
    concepts:
      - Third-party integration
      - Webhook callbacks
      - Event-driven architecture
      - External approval systems

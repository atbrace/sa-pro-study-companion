id: hybrid-architectures
name: Hybrid Cloud Architectures
shortName: Hybrid Cloud
examTask: task-4-2
description: >
  Design and implement hybrid cloud solutions connecting on-premises infrastructure with AWS,
  including networking, storage, compute, and data transfer services for seamless integration.

estimatedStudyTime: 90
difficulty: advanced
keyServices:
  - AWS Direct Connect
  - AWS VPN
  - AWS Storage Gateway
  - AWS DataSync
  - AWS Snow Family
  - AWS Outposts
  - VMware Cloud on AWS
  - AWS Transit Gateway
learningObjectives:
  - Design resilient hybrid network architectures using Direct Connect and VPN
  - Select appropriate Storage Gateway modes for different use cases
  - Implement efficient data transfer strategies using DataSync and Snow Family
  - Architect on-premises AWS extensions with Outposts and VMware Cloud
  - Apply hybrid networking patterns for multi-region and multi-account scenarios

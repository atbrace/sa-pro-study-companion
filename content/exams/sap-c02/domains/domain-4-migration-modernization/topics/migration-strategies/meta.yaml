id: migration-strategies
name: Migration Strategies and Planning
shortName: Migration Strategies
examTask: task-4-1
description: >
  Design and implement comprehensive migration strategies using the 6 R's framework,
  AWS Migration Hub, Application Migration Service (MGN), and migration assessment tools
  to plan and execute workload migrations to AWS.

estimatedStudyTime: 120
difficulty: advanced

keyServices:
  - AWS Migration Hub
  - AWS Application Migration Service (MGN)
  - AWS Migration Evaluator
  - AWS Application Discovery Service
  - AWS Control Tower
  - AWS Landing Zone

keyConcepts:
  - 6 R's migration strategies (Rehost, Replatform, Repurchase, Refactor, Retire, Retain)
  - Migration portfolio assessment and discovery
  - Migration Hub for tracking and orchestration
  - Application Migration Service for lift-and-shift
  - Landing zone preparation and design
  - Migration wave planning
  - Business case development


id: application-modernization
name: Application Modernization Strategies
shortName: App Modernization
examTask: task-4-3
description: >
  Design and implement strategies to modernize legacy applications using containers,
  serverless, microservices, and managed services. Master incremental modernization
  patterns like strangler fig and techniques for breaking monoliths.

estimatedStudyTime: 150
difficulty: advanced

keyServices:
  - Amazon ECS
  - Amazon EKS
  - AWS Fargate
  - AWS Lambda
  - Amazon API Gateway
  - AWS App Runner
  - AWS Step Functions
  - Amazon EventBridge
  - Amazon SQS
  - Amazon SNS
  - AWS App2Container
  - AWS Copilot

keyConcepts:
  - Strangler fig pattern
  - Microservices decomposition
  - Event-driven architecture
  - Containerization strategies
  - Serverless transformation
  - API Gateway patterns
  - Service mesh (AWS App Mesh)
  - Container orchestration
  - Managed service adoption
  - Incremental modernization
  - Circuit breaker pattern
  - Saga pattern for distributed transactions


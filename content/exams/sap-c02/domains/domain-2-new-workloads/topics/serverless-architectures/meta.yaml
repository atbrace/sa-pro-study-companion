id: serverless-architectures
name: Serverless Architectures and Event-Driven Design
shortName: Serverless Architectures
examTask: task-2-1
description: >
  Design and implement serverless architectures using Lambda, API Gateway, DynamoDB, and Step Functions.
  Create event-driven solutions with EventBridge, implement serverless API patterns, and apply serverless
  best practices for scalable, cost-effective solutions.

estimatedStudyTime: 150
difficulty: advanced

keyServices:
  - AWS Lambda
  - Amazon API Gateway
  - Amazon DynamoDB
  - Amazon S3
  - Amazon EventBridge
  - AWS Step Functions
  - Amazon SQS
  - Amazon SNS
  - AWS AppSync
  - Amazon Kinesis

keyConcepts:
  - Event-driven architecture patterns
  - API Gateway integration types
  - Lambda execution model and optimization
  - DynamoDB access patterns and design
  - Step Functions orchestration
  - Asynchronous processing patterns
  - Serverless authentication (Cognito, IAM)
  - Cold start optimization
  - Serverless observability
  - Cost optimization strategies


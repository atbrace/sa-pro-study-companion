id: network-connectivity
name: Network Connectivity Strategies
shortName: Network Connectivity
examTask: task-1-1
description: >
  Design and implement hybrid and multi-cloud network architectures using
  AWS Transit Gateway, Direct Connect, VPN, and advanced VPC configurations.

estimatedStudyTime: 90
difficulty: intermediate

keyServices:
  - AWS Transit Gateway
  - AWS Direct Connect
  - Amazon VPC
  - AWS VPN
  - AWS Route 53
  - AWS PrivateLink

keyConcepts:
  - Transit Gateway routing and attachments
  - Direct Connect virtual interfaces (VIF)
  - VPN connectivity options
  - Hybrid DNS resolution
  - Network segmentation strategies
  - PrivateLink for service connectivity


id: security-controls
name: Security Controls and Compliance
shortName: Security Controls
examTask: task-1-2
description: >
  Design and implement comprehensive security controls for enterprise AWS environments,
  including identity management, encryption, compliance, and security monitoring.

estimatedStudyTime: 120
difficulty: advanced

keyServices:
  - AWS IAM
  - AWS Organizations
  - AWS KMS
  - AWS CloudTrail
  - AWS Config
  - AWS Security Hub
  - AWS GuardDuty
  - AWS Secrets Manager
  - AWS Certificate Manager

keyConcepts:
  - Service Control Policies (SCPs)
  - IAM permission boundaries
  - Cross-account access patterns
  - KMS key policies and grants
  - CloudTrail log aggregation
  - Config rules and remediation
  - Security Hub integration
  - GuardDuty threat detection
  - Secrets rotation strategies


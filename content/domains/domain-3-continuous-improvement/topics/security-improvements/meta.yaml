id: security-improvements
name: Security Improvements for Existing Solutions
shortName: Security Improvements
examTask: task-3-2
description: >
  Implement security improvements for existing AWS solutions using threat detection,
  compliance frameworks, configuration management, data discovery, access analysis,
  and secrets management to enhance overall security posture.

estimatedStudyTime: 150
difficulty: advanced

keyServices:
  - Amazon GuardDuty
  - AWS Security Hub
  - AWS Config
  - Amazon Macie
  - IAM Access Analyzer
  - AWS Secrets Manager
  - AWS Systems Manager Parameter Store
  - AWS CloudTrail
  - AWS KMS

keyConcepts:
  - Threat detection and response
  - Compliance frameworks (CIS, PCI-DSS, HIPAA)
  - Config rules and conformance packs
  - Automated remediation
  - Sensitive data discovery
  - Unintended access detection
  - Secrets rotation automation
  - Security findings aggregation
  - Multi-account security posture


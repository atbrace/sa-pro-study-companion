id: database-migration
name: Database Migration Strategies
shortName: Database Migration
examTask: task-4-2
description: >
  Design and implement database migration strategies using AWS DMS, Schema Conversion Tool,
  and native database tools. Covers homogeneous and heterogeneous migrations, change data
  capture, zero-downtime patterns, and large-scale data transfers.

estimatedStudyTime: 150
difficulty: advanced

keyServices:
  - AWS Database Migration Service (DMS)
  - AWS Schema Conversion Tool (SCT)
  - AWS Snowball Edge
  - Amazon RDS
  - Amazon Aurora
  - AWS DataSync
  - Amazon S3

keyConcepts:
  - Homogeneous vs heterogeneous migrations
  - Change Data Capture (CDC)
  - Zero-downtime migration patterns
  - Schema conversion strategies
  - Replication instance sizing
  - Snowball Edge for large transfers
  - Migration validation and testing
  - Cutover strategies
  - Network optimization for migrations


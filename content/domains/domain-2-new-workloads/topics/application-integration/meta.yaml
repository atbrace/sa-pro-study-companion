id: application-integration
name: Application Integration
shortName: App Integration
examTask: task-2-1
description: >
  Design and implement application integration using AWS messaging, event-driven architecture, and workflow orchestration services

estimatedStudyTime: 90
difficulty: advanced

keyServices:
  - Amazon SQS
  - Amazon SNS
  - Amazon EventBridge
  - AWS Step Functions
  - Amazon AppFlow
  - Amazon API Gateway
  - Amazon MQ
  - AWS AppSync

keyConcepts:
  - Messaging patterns (point-to-point, pub/sub, fan-out)
  - Event-driven architecture
  - Workflow orchestration and state machines
  - Asynchronous processing
  - Message ordering and deduplication
  - Dead letter queues
  - Event filtering and routing
  - API gateway patterns
  - Integration with SaaS applications


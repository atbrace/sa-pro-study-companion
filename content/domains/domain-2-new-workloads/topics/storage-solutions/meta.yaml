id: storage-solutions
name: Storage Solutions and Data Management
shortName: Storage Solutions
examTask: task-2-1
description: >
  Design storage solutions using S3, EBS, EFS, and FSx. Implement data lifecycle
  policies, optimize performance, and manage costs across object, block, and file storage.

estimatedStudyTime: 100
difficulty: intermediate

keyServices:
  - Amazon S3
  - Amazon EBS
  - Amazon EFS
  - Amazon FSx
  - AWS Storage Gateway
  - AWS DataSync
  - AWS Transfer Family
  - S3 Glacier
  - AWS Backup

keyConcepts:
  - S3 storage classes and lifecycle policies
  - EBS volume types (gp3, io2, st1, sc1)
  - EFS performance modes
  - FSx for Windows and Lustre
  - Storage Gateway modes
  - Cross-region replication
  - S3 performance optimization
  - Storage cost optimization


id: compute-solutions
name: Compute Solutions and Deployment Strategies
shortName: Compute Solutions
examTask: task-2-1
description: >
  Design and implement compute solutions using EC2, Lambda, containers (ECS/EKS),
  and AWS Batch. Select appropriate compute services based on workload characteristics,
  performance requirements, and cost considerations.

estimatedStudyTime: 120
difficulty: advanced

keyServices:
  - Amazon EC2
  - AWS Lambda
  - Amazon ECS
  - Amazon EKS
  - AWS Fargate
  - AWS Batch
  - AWS App Runner
  - AWS Elastic Beanstalk
  - EC2 Auto Scaling
  - Application Auto Scaling

keyConcepts:
  - EC2 instance types and families
  - Lambda execution model and optimization
  - Container orchestration (ECS vs EKS)
  - Serverless compute patterns
  - Batch processing architectures
  - Auto Scaling strategies
  - Deployment strategies (blue/green, canary)
  - Spot Instances and Spot Fleet
  - Placement groups
  - Enhanced networking


id: cost-optimization
name: Cost Optimization and Visibility
shortName: Cost Optimization
examTask: task-1-5
description: >
  Implement cost management, optimization, and visibility strategies for complex AWS
  environments using cost allocation, budgeting, rightsizing, and purchasing options.

estimatedStudyTime: 90
difficulty: intermediate

keyServices:
  - AWS Cost Explorer
  - AWS Budgets
  - AWS Cost and Usage Report (CUR)
  - AWS Compute Optimizer
  - AWS Trusted Advisor
  - Savings Plans
  - Reserved Instances
  - AWS Cost Anomaly Detection
  - AWS Organizations (consolidated billing)
  - Amazon S3 Intelligent-Tiering
  - Amazon EBS (gp3, io2)
  - AWS Graviton processors

keyConcepts:
  - Cost allocation tags
  - Reserved Instances vs. Savings Plans
  - Spot Instances strategies
  - Rightsizing recommendations
  - S3 storage class optimization
  - Data transfer costs
  - Consolidated billing
  - Cost allocation and chargeback
  - Budget alerts and forecasting
  - Cost anomaly detection


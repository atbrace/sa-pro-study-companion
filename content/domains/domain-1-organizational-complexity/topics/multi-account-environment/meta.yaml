id: multi-account-environment
name: Multi-Account AWS Environment Design
shortName: Multi-Account Environment
examTask: task-1-4
description: >
  Design and implement multi-account strategies using AWS Organizations, Control Tower,
  and related services to manage complex enterprise AWS environments.

estimatedStudyTime: 120
difficulty: advanced

keyServices:
  - AWS Organizations
  - AWS Control Tower
  - AWS Service Catalog
  - AWS Resource Access Manager (RAM)
  - AWS Single Sign-On (SSO)
  - AWS Identity Center
  - AWS CloudFormation StackSets
  - AWS Config
  - AWS Security Hub
  - AWS IAM Identity Center

keyConcepts:
  - Organizational Units (OUs) structure
  - Service Control Policies (SCPs)
  - Account vending and provisioning
  - Centralized logging and security
  - Resource sharing across accounts
  - Identity federation and SSO
  - Delegated administration
  - Account baselining
  - Multi-account governance
  - Landing Zone design

